<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestion des Frais & Paiements</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <style>
    :root {
      --primaire: #2563eb;
      --succes: #10b981;
      --attention: #f59e0b;
      --danger: #ef4444;
      --gris-clair: #f3f4f6;
    }
    body { background: #eef2f7; font-family: 'Segoe UI', sans-serif; }
    .card { border: none; border-radius: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.08); margin-bottom: 20px; }
    .card-header { background: white; border-bottom: 1px solid #eee; font-weight: 600; border-radius: 12px 12px 0 0 !important; }
    .badge-vert { background: #d1fae5; color: #065f46; }
    .badge-jaune { background: #fef3c7; color: #92400e; }
    .badge-rouge { background: #fee2e2; color: #991b1b; }
    .progress { height: 10px; border-radius: 5px; }
    .nav-tabs .nav-link { color: #555; font-weight: 500; }
    .nav-tabs .nav-link.active { color: var(--primaire); border-bottom: 3px solid var(--primaire); }
    .somme-du { font-size: 1.1rem; font-weight: 600; }
  </style>
</head>
<body>

<nav class="navbar navbar-dark bg-primary mb-4">
  <div class="container">
    <a class="navbar-brand" href="#">💰 Gestion des Frais & Paiements</a>
    <div>
      <button class="btn btn-light btn-sm" onclick="changerLangue('fr')">FR</button>
      <button class="btn btn-outline-light btn-sm" onclick="changerLangue('en')">EN</button>
      <button class="btn btn-outline-light btn-sm" onclick="changerLangue('ar')">AR</button>
      <a href="dashboard.html" class="btn btn-outline-light btn-sm ms-2">Retour</a>
    </div>
  </div>
</nav>

<div class="container">

  <!-- Filtres -->
  <div class="card p-3 mb-4">
    <div class="row g-2">
      <div class="col-md-3">
        <label class="form-label">Élève</label>
        <select id="filtreEleve" class="form-select" onchange="chargerListeFrais()">
          <option value="">Tous les élèves</option>
        </select>
      </div>
      <div class="col-md-2">
        <label class="form-label">Type de frais</label>
        <select id="filtreType" class="form-select" onchange="chargerListeFrais()">
          <option value="">Tous</option>
          <option value="scolaire">Frais scolaires</option>
          <option value="cantine">Cantine</option>
          <option value="sport">Sport / Activités</option>
          <option value="transport">Transport</option>
          <option value="document">Documents / Divers</option>
        </select>
      </div>
      <div class="col-md-2">
        <label class="form-label">Statut</label>
        <select id="filtreStatut" class="form-select" onchange="chargerListeFrais()">
          <option value="">Tous</option>
          <option value="paye">Payé</option>
          <option value="partiel">Partiel</option>
          <option value="impaye">Impayé</option>
        </select>
      </div>
      <div class="col-md-3">
        <label class="form-label">Période / Année</label>
        <select id="filtreAnnee" class="form-select" onchange="chargerListeFrais()">
          <option value="2026-2027" selected>2026-2027</option>
          <option value="2025-2026">2025-2026</option>
          <option value="2024-2025">2024-2025</option>
        </select>
      </div>
      <div class="col-md-2 d-flex align-items-end">
        <button class="btn btn-primary w-100" data-bs-toggle="modal" data-bs-target="#modalFrais">
          <i class="bi bi-plus-lg"></i> Ajouter
        </button>
      </div>
    </div>
  </div>

  <!-- Résumé -->
  <div class="row mb-4">
    <div class="col-md-3">
      <div class="card p-3 text-center">
        <h6 class="text-muted">Total dû</h6>
        <h4 class="fw-bold text-danger" id="totalDu">0 F CFA</h4>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card p-3 text-center">
        <h6 class="text-muted">Total payé</h6>
        <h4 class="fw-bold text-success" id="totalPaye">0 F CFA</h4>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card p-3 text-center">
        <h6 class="text-muted">Reste à payer</h6>
        <h4 class="fw-bold text-primary" id="totalReste">0 F CFA</h4>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card p-3 text-center">
        <h6 class="text-muted">Taux de recouvrement</h6>
        <h4 class="fw-bold" id="tauxRecouvrement">0 %</h4>
      </div>
    </div>
  </div>

  <!-- Liste des frais -->
  <div class="card">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover mb-0">
          <thead class="table-light">
            <tr>
              <th>Élève</th>
              <th>Type</th>
              <th>Libellé</th>
              <th>Période</th>
              <th>Montant total</th>
              <th>Payé</th>
              <th>Reste</th>
              <th>Statut</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="listeFrais">
            <!-- Chargé par JS -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

</div>

<!-- Modal Ajout/Modification Frais -->
<div class="modal fade" id="modalFrais" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="titreModalFrais">Ajouter des Frais</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="formFrais">
        <div class="modal-body">
          <input type="hidden" id="fraisId">
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">Élève <span class="text-danger">*</span></label>
              <select id="fraisEleve" class="form-select" required>
                <option value="">Choisir l'élève...</option>
              </select>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Type de Frais <span class="text-danger">*</span></label>
              <select id="fraisType" class="form-select" required>
                <option value="">Choisir le type...</option>
                <option value="scolaire">📚 Frais Scolaires</option>
                <option value="cantine">🍽️ Cantine</option>
                <option value="sport">⚽ Sport / Activités</option>
                <option value="transport">🚌 Transport</option>
                <option value="document">📄 Documents / Divers</option>
              </select>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Libellé / Désignation <span class="text-danger">*</span></label>
              <input type="text" id="fraisLibelle" class="form-control" placeholder="Ex: Scolarité Octobre" required>
            </div>
            <div class="col-md-3 mb-3">
              <label class="form-label">Période / Mois</label>
              <input type="month" id="fraisPeriode" class="form-control">
            </div>
            <div class="col-md-3 mb-3">
              <label class="form-label">Année Scolaire</label>
              <select id="fraisAnnee" class="form-select">
                <option value="2026-2027" selected>2026-2027</option>
                <option value="2025-2026">2025-2026</option>
                <option value="2024-2025">2024-2025</option>
              </select>
            </div>
            <div class="col-md-4 mb-3">
              <label class="form-label">Montant Total (F CFA) <span class="text-danger">*</span></label>
              <input type="number" id="fraisMontant" class="form-control" min="0" required>
            </div>
            <div class="col-md-4 mb-3">
              <label class="form-label">Montant Déjà Payé</label>
              <input type="number" id="fraisPaye" class="form-control" min="0" value="0">
            </div>
            <div class="col-md-4 mb-3">
              <label class="form-label">Date du dernier paiement</label>
              <input type="date" id="fraisDatePaiement" class="form-control">
            </div>
            <div class="col-12 mb-3">
              <label class="form-label">Observations / Notes</label>
              <textarea id="fraisNotes" class="form-control" rows="2" placeholder="Infos complémentaires..."></textarea>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="reset" class="btn btn-outline-secondary" data-bs-dismiss="modal">Annuler</button>
          <button type="submit" class="btn btn-primary">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Modal Saisie de Paiement -->
<div class="modal fade" id="modalPaiement" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Enregistrer un Paiement</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="formPaiement">
        <div class="modal-body">
          <input type="hidden" id="paiementFraisId">
          <div class="mb-3">
            <label class="form-label">Élève / Frais</label>
            <input type="text" id="paiementLibelle" class="form-control" readonly>
          </div>
          <div class="row mb-3">
            <div class="col-6">
              <label class="form-label">Montant Restant</label>
              <input type="text" id="paiementReste" class="form-control" readonly>
            </div>
            <div class="col-6">
              <label class="form-label">Montant Réglé <span class="text-danger">*</span></label>
              <input type="number" id="paiementMontant" class="form-control" min="0" required>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Mode de Paiement</label>
            <select id="paiementMode" class="form-select">
              <option value="especes">Espèces</option>
              <option value="virement">Virement</option>
              <option value="mobile">Mobile Money</option>
              <option value="cheque">Chèque</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Date</label>
            <input type="date" id="paiementDate" class="form-control" value="">
          </div>
        </div>
        <div class="modal-footer">
          <button type="reset" class="btn btn-outline-secondary" data-bs-dismiss="modal">Annuler</button>
          <button type="submit" class="btn btn-success">Valider le Paiement</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
// ========== CONFIG ==========
const API_URL = '/api';
let token = localStorage.getItem('token') || '';
let listeFrais = [];
let listeEleves = [];

// Traductions
const t = {
  fr: { devise: 'F CFA', impaye: 'Impayé', partiel: 'Partiel', paye: 'Payé', supprimerConfirm: 'Supprimer ce frais ?', enregistre: 'Enregistré !' },
  en: { devise: 'XOF', impaye: 'Unpaid', partiel: 'Partial', paye: 'Paid', supprimerConfirm: 'Delete this fee?', enregistre: 'Saved!' },
  ar: { devise: 'فرنك', impaye: 'غير مدفوع', partiel: 'جزئي', paye: 'مدفوع', supprimerConfirm: 'حذف هذا الرسم؟', enregistre: 'تم الحفظ!' }
};
let langueActuelle = localStorage.getItem('langue') || 'fr';

function changerLangue(lg) {
  langueActuelle = lg; localStorage.setItem('langue', lg);
}

function formatMontant(n) { return new Intl.NumberFormat('fr-FR').format(n)+' '+t[langueActuelle].devise; }

function getBadgeStatut(reste, total) {
  if (reste <= 0) return '<span class="badge badge-vert">'+t[langueActuelle].paye+'</span>';
  if (reste < total) return '<span class="badge badge-jaune">'+t[langueActuelle].partiel+'</span>';
  return '<span class="badge badge-rouge">'+t[langueActuelle].impaye+'</span>';
}

function getIconeType(type) {
  const icones = { scolaire: '📚', cantine: '🍽️', sport: '⚽', transport: '🚌', document: '📄' };
  return icones[type] || '📌';
}

// ========== CHARGEMENT ==========
async function chargerEleves() {
  try {
    const res = await fetch(`${API_URL}/eleves/liste`, { headers: { 'Authorization': `Bearer ${token}` } });
    listeEleves = await res.json();
    let opt = '<option value="">Tous les élèves</option>';
    let opt2 = '<option value="">Choisir...</option>';
    listeEleves.forEach(e => {
      opt += `<option value="${e.id}">${e.nom} ${e.prenom}</option>`;
      opt2 += `<option value="${e.id}">${e.nom} ${e.prenom}</option>`;
    });
    document.getElementById('filtreEleve').innerHTML = opt;
    document.getElementById('fraisEleve').innerHTML = opt2;
  } catch(e) { console.error(e); }
}

async function chargerListeFrais() {
  const eleve = document.getElementById('filtreEleve').value;
  const type = document.getElementById('filtreType').value;
  const statut = document.getElementById('filtreStatut').value;
  const annee = document.getElementById('filtreAnnee').value;

  try {
    const res = await fetch(`${API_URL}/frais?annee=${annee}`, { headers: { 'Authorization': `Bearer ${token}` } });
    listeFrais = await res.json();
  } catch {
    // Mode démo si pas d'API
    listeFrais = [];
  }

  // Filtrage
  let filtré = listeFrais;
  if (eleve) filtré = filtré.filter(f => f.eleve_id == eleve);
  if (type) filtré = filtré.filter(f => f.type == type);
  if (statut === 'paye') filtré = filtré.filter(f => f.reste <= 0);
  if (statut === 'impaye') filtré = filtré.filter(f => f.reste >= f.montant);
  if (statut === 'partiel') filtré = filtré.filter(f => f.reste > 0 && f.reste < f.montant);

  // Calcul totaux
  const totalDu = filtré.reduce((s,f) => s + Number(f.montant), 0);
  const totalPaye = filtré.reduce((s,f) => s + Number(f.paye), 0);
  const totalReste = totalDu - totalPaye;
  const taux = totalDu > 0 ? Math.round((totalPaye / totalDu) * 100) : 0;

  document.getElementById('totalDu').textContent = formatMontant(totalDu);
  document.getElementById('totalPaye').textContent = formatMontant(totalPaye);
  document.getElementById('totalReste').textContent = formatMontant(totalReste);
  document.getElementById('tauxRecouvrement').textContent = taux + ' %';

  // Affichage tableau
  const tbody = document.getElementById('listeFrais');
  tbody.innerHTML = '';
  filtré.forEach(f => {
    const reste = Number(f.montant) - Number(f.paye);
    const elNom = listeEleves.find(e => e.id == f.eleve_id);
    const nomEleve = elNom ? `${elNom.nom} ${elNom.prenom}` : 'Élève #'+f.eleve_id;
    tbody.innerHTML += `
      <tr>
        <td class="fw-medium">${nomEleve}</td>
        <td>${getIconeType(f.type)}</td>
        <td>${f.libelle}</td>
        <td>${f.periode || '-'}</td>
        <td class="fw-semibold">${formatMontant(f.montant)}</td>
        <td class="text-success">${formatMontant(f.paye || 0)}</td>
        <td class="fw-semibold ${reste > 0 ? 'text-danger' : 'text-success'}">${formatMontant(reste)}</td>
        <td>${getBadgeStatut(reste, f.montant)}</td>
        <td>
          <button class="btn btn-sm btn-outline-success py-0 px-1" onclick="ouvrirPaiement('${f.id}')" title="Paiement">💰</button>
          <button class="btn btn-sm btn-outline-primary py-0 px-1" onclick="editerFrais('${f.id}')" title="Modifier">✏️</button>
          <button class="btn btn-sm btn-outline-danger py-0 px-1" onclick="supprimerFrais('${f.id}')" title="Supprimer">🗑️</button>
        </td>
      </tr>`;
  });
}

// ========== FORMULAIRE FRAIS ==========
document.getElementById('formFrais').addEventListener('submit', async e => {
  e.preventDefault();
  const id = document.getElementById('fraisId').value;
  const data = {
    eleve_id: document.getElementById('fraisEleve').value,
    type: document.getElementById('fraisType').value,
    libelle: document.getElementById('fraisLibelle').value,
    periode: document.getElementById('fraisPeriode').value,
    annee: document.getElementById('fraisAnnee').value,
    montant: document.getElementById('fraisMontant').value,
    paye: document.getElementById('fraisPaye').value || 0,
    date_paiement: document.getElementById('fraisDatePaiement').value,
    notes: document.getElementById('fraisNotes').value
  };

  try {
    const url = id ? `${API_URL}/frais/${id}` : `${API_URL}/frais`;
    const methode = id ? 'PUT' : 'POST';
    await fetch(url, {
      method: methode,
      headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
    alert(t[langueActuelle].enregistre);
    document.getElementById('formFrais').reset();
    document.getElementById('fraisId').value = '';
    bootstrap.Modal.getInstance(document.getElementById('modalFrais')).hide();
    chargerListeFrais();
  } catch(e) { alert('Erreur réseau'); }
});

function editerFrais(id) {
  const f = listeFrais.find(x => x.id == id);
  if (!f) return;
  document.getElementById('fraisId').value = f.id;
  document.getElementById('fraisEleve').value = f.eleve_id;
  document.getElementById('fraisType').value = f.type;
  document.getElementById('fraisLibelle').value = f.libelle;
  document.getElementById('fraisPeriode').value = f.periode;
  document.getElementById('fraisAnnee').value = f.annee;
  document.getElementById('fraisMontant').value = f.montant;
  document.getElementById('fraisPaye').value = f.paye;
  document.getElementById('fraisDatePaiement').value = f.date_paiement || '';
  document.getElementById('fraisNotes').value = f.notes || '';
  document.getElementById('titreModalFrais').textContent = 'Modifier les Frais';
  new bootstrap.Modal(document.getElementById('modalFrais')).show();
}

async function supprimerFrais(id) {
  if (!confirm(t[langueActuelle].supprimerConfirm)) return;
  try {
    await fetch(`${API_URL}/frais/${id}`, {
      method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` }
    });
    chargerListeFrais();
  } catch { alert('Erreur suppression'); }
}

// ========== ENREGISTREMENT PAIEMENT ==========
function ouvrirPaiement(id) {
  const f = listeFrais.find(x => x.id == id);
  if (!f) return;
  const reste = Number(f.montant) - Number(f.paye);
  document.getElementById('paiementFraisId').value = id;
  document.getElementById('paiementLibelle').value = f.libelle;
  document.getElementById('paiementReste').value = formatMontant(reste);
  document.getElementById('paiementMontant').value = reste;
  document.getElementById('paiementDate').value = new Date().toISOString().split('T')[0];
  new bootstrap.Modal(document.getElementById('modalPaiement')).show();
}

document.getElementById('formPaiement').addEventListener('submit', async e => {
  e.preventDefault();
  const id = document.getElementById('paiementFraisId').value;
  const montantRegle = Number(document.getElementById('paiementMontant').value);
  const mode = document.getElementById('paiementMode').value;
  const date = document.getElementById('paiementDate').value;

  try {
    await fetch(`${API_URL}/frais/paiement/${id}`, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ montant: montantRegle, mode: mode, date: date })
    });
    alert('Paiement enregistré ✅');
    bootstrap.Modal.getInstance(document.getElementById('modalPaiement')).hide();
    chargerListeFrais();
  } catch { alert('Erreur lors de l\'enregistrement'); }
});

// Init
chargerEleves().then(() => chargerListeFrais());
document.getElementById('fraisDatePaiement').valueAsDate = new Date();
</script>
</body>
</html>
