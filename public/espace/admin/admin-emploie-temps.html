<!DOCTYPE html>
<html lang="fr" class="lang-fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>
    <span class="lang-fr">Gestion Emploi du Temps — Administration</span>
    <span class="lang-en">Timetable Management — Administration</span>
    <span class="lang-ar">إدارة الجدول الزمني — الإدارة</span>
  </title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    :root {
      --fond: #f8fafc;
      --surface: #ffffff;
      --texte: #1e293b;
      --texte-secondaire: #64748b;
      --bord: #e2e8f0;
      --primaire: #0c4a6e;
      --accent: #f59e0b;
      --succes: #10b981;
      --danger: #ef4444;
      --ombre: 0 2px 8px rgba(0,0,0,0.06);
    }
    [data-theme="sombre"] {
      --fond: #0f172a;
      --surface: #1e293b;
      --texte: #f8fafc;
      --texte-secondaire: #94a3b8;
      --bord: #334155;
      --primaire: #38bdf8;
      --accent: #fbbf24;
      --succes: #34d399;
      --danger: #f87171;
      --ombre: 0 2px 12px rgba(0,0,0,0.35);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; transition: all 0.25s ease; }
    body { background: var(--fond); color: var(--texte); min-height: 100vh; font-family:'Segoe UI', sans-serif; }
    .entete-page { background: var(--surface); border-bottom: 2px solid var(--accent); padding: 1.2rem 0; box-shadow: var(--ombre); }
    .carte { background: var(--surface); border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; border: 1px solid var(--bord); box-shadow: var(--ombre); }
    .carte:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,0.08); }
    .form-control, .form-select {
      background: var(--fond); border: 1px solid var(--bord); color: var(--texte); border-radius: 8px;
    }
    .form-control:focus, .form-select:focus {
      background: var(--fond); border-color: var(--accent); color: var(--texte);
      box-shadow: 0 0 0 0.25rem rgba(245,158,11,0.20);
    }
    .btn-primaire { background: var(--primaire); color: white; border-radius: 8px; border: none; padding: 0.5rem 1rem; }
    .btn-primaire:hover { filter: brightness(1.08); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(12,74,110,0.25); }
    .btn-ajouter { background: var(--succes); color: white; border-radius: 8px; border: none; padding: 0.5rem 1rem; }
    .btn-ajouter:hover { background: #059669; color: white; transform: translateY(-1px); }
    .btn-modif { background: var(--accent); color: #000; padding: 5px 10px; font-size: 14px; border-radius: 6px; border: none; }
    .btn-suppr { background: var(--danger); color: white; padding: 5px 10px; font-size: 14px; border-radius: 6px; border: none; }
    .table { color: var(--texte); margin-bottom: 0; }
    .table th { border-color: var(--bord); background: var(--primaire); color: white; }
    .table td { border-color: var(--bord); }
    .table-striped > tbody > tr:nth-of-type(odd) { background: rgba(12,74,110,0.03); }
    [data-theme="sombre"] .table-striped > tbody > tr:nth-of-type(odd) { background: rgba(56,189,248,0.04); }
    .lang-en, .lang-ar { display: none; }
    body.lang-fr .lang-fr { display: inline; }
    body.lang-en { direction: ltr; }
    body.lang-en .lang-fr, body.lang-en .lang-ar { display: none; }
    body.lang-en .lang-en { display: inline; }
    body.lang-ar { direction: rtl; }
    body.lang-ar .lang-fr, body.lang-ar .lang-en { display: none; }
    body.lang-ar .lang-ar { display: inline; }
    .btn-mode { border-radius: 20px; padding: 4px 12px; font-size: 14px; border: 1px solid var(--bord); background: var(--surface); color: var(--texte); }
    .btn-mode:hover { border-color: var(--accent); }
  </style>
</head>
<body class="lang-fr" data-theme="clair">

<!-- 🔗 CONFIGURATION API — PLUS DE LOCALHOST -->
<script>
const API_URL = "https://mama-zoumana-api.onrender.com/api";

function getToken() {
  return localStorage.getItem('token');
}

async function requeteAPI(chemin, options = {}) {
  const reponse = await fetch(`${API_URL}${chemin}`, {
    ...options,
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${getToken()}`,
      ...options.headers
    }
  });
  const donnees = await reponse.json();
  if (reponse.status === 401) {
    alert("⛔ Session expirée — Veuillez vous reconnecter");
    localStorage.removeItem('token');
    localStorage.removeItem('role');
    window.location.href = 'connexion.html';
    return;
  }
  return donnees;
}

const token = getToken();
const role = localStorage.getItem('role');
let langue = localStorage.getItem('langue') || 'fr';
let theme = localStorage.getItem('theme') || 'clair';

// 💾 TRADUCTIONS
const MSG = {
  fr: {
    titre: "📅 Gestion de l'Emploi du Temps",
    choisirClasse: "-- Choisir une classe --",
    ajouterCours: "Ajouter un cours",
    modifierCours: "Modifier le cours",
    jour: "Jour",
    heureDebut: "Heure de début",
    heureFin: "Heure de fin",
    matiere: "Matière",
    professeur: "Enseignant",
    choisirProf: "-- Sélectionner --",
    enregistrer: "💾 Enregistrer",
    listeCours: "📋 Emploi du Temps",
    horaires: "Horaire",
    actions: "Actions",
    aucuneDonnee: "Aucun cours programmé",
    selectionnerClasseDabord: "⚠️ Sélectionnez une classe d'abord !",
    confirmerSuppression: "Confirmer la suppression ?",
    coursAjoute: "✅ Cours ajouté !",
    coursModifie: "✅ Cours mis à jour !",
    coursSupprime: "✅ Cours supprimé !",
    deconnexion: "Déconnexion"
  },
  en: {
    titre: "📅 Timetable Management",
    choisirClasse: "-- Select a class --",
    ajouterCours: "Add course",
    modifierCours: "Edit course",
    jour: "Day",
    heureDebut: "Start time",
    heureFin: "End time",
    matiere: "Subject",
    professeur: "Teacher",
    choisirProf: "-- Select --",
    enregistrer: "💾 Save",
    listeCours: "📋 Timetable",
    horaires: "Time",
    actions: "Actions",
    aucuneDonnee: "No course scheduled",
    selectionnerClasseDabord: "⚠️ Select a class first!",
    confirmerSuppression: "Confirm deletion?",
    coursAjoute: "✅ Course added!",
    coursModifie: "✅ Course updated!",
    coursSupprime: "✅ Course deleted!",
    deconnexion: "Sign out"
  },
  ar: {
    titre: "📅 إدارة الجدول الزمني",
    choisirClasse: "-- اختر المستوى --",
    ajouterCours: "إضافة حصة",
    modifierCours: "تعديل الحصة",
    jour: "اليوم",
    heureDebut: "وقت البدء",
    heureFin: "وقت الانتهاء",
    matiere: "المادة",
    professeur: "الأستاذ",
    choisirProf: "-- اختر --",
    enregistrer: "💾 حفظ",
    listeCours: "📋 الجدول الزمني",
    horaires: "الوقت",
    actions: "إجراءات",
    aucuneDonnee: "لا توجد حصص",
    selectionnerClasseDabord: "⚠️ اختر المستوى أولاً !",
    confirmerSuppression: "تأكيد الحذف ؟",
    coursAjoute: "✅ تمت الإضافة !",
    coursModifie: "✅ تم التحديث !",
    coursSupprime: "✅ تم الحذف !",
    deconnexion: "تسجيل الخروج"
  }
};
function m(cle) { return MSG[langue]?.[cle] || MSG.fr[cle]; }

// 🔒 SÉCURITÉ
if(!token || !['admin','comptable','directeur'].includes((role||'').toLowerCase())){
  alert("⛔ Accès réservé à l'administration");
  localStorage.clear();
  location.href = 'connexion.html';
}

// 🌙 THÈME
function appliquerTheme(t) {
  theme = t;
  document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem('theme', t);
  document.getElementById('btn-theme').innerHTML = t === 'clair' ? '<i class="bi bi-moon"></i>' : '<i class="bi bi-sun"></i>';
}
function basculerTheme() { appliquerTheme(theme === 'clair' ? 'sombre' : 'clair'); }

// 🗣️ LANGUE
function appliquerLangue(lg) {
  langue = lg;
  localStorage.setItem('langue', lg);
  document.body.classList.remove('lang-fr','lang-en','lang-ar');
  document.body.classList.add('lang-' + lg);
  document.getElementById('selecteurLangue').value = lg;
  document.title = document.querySelector(`.lang-${lg}`)?.textContent || document.title;
}
</script>

<!-- 📌 EN-TÊTE -->
<div class="entete-page">
  <div class="container d-flex justify-content-between align-items-center">
    <div>
      <h3 class="mb-1">
        <i class="bi bi-calendar3-week me-2" style="color:var(--accent)"></i>
        <span class="lang-fr">Gestion de l'Emploi du Temps</span>
        <span class="lang-en">Timetable Management</span>
        <span class="lang-ar">إدارة الجدول الزمني</span>
      </h3>
    </div>
    <div class="d-flex align-items-center gap-2">
      <button class="btn-mode" id="btn-theme" onclick="basculerTheme()" title="Mode jour/nuit">
        <i class="bi bi-moon"></i>
      </button>
      <select id="selecteurLangue" class="form-select form-select-sm w-auto" onchange="appliquerLangue(this.value)">
        <option value="fr">🇫🇷 FR</option>
        <option value="en">🇬🇧 EN</option>
        <option value="ar">🇸🇦 AR</option>
      </select>
      <a href="dashboard-admin.html" class="btn btn-outline-secondary btn-sm ms-1">
        <i class="bi bi-arrow-left"></i>
        <span class="lang-fr"> Retour</span>
        <span class="lang-en"> Back</span>
        <span class="lang-ar"> عودة</span>
      </a>
    </div>
  </div>
</div>

<div class="container py-4">
  <!-- 🏫 CHOIX CLASSE -->
  <div class="carte">
    <label class="form-label fw-bold">1️⃣ <span class="lang-fr">Sélectionnez une classe</span><span class="lang-en">Select a class</span><span class="lang-ar">اختر المستوى</span> :</label>
    <select id="id_classe" class="form-select form-select-lg" onchange="chargerEmploi()">
      <option value="">-- Choisir une classe --</option>
    </select>
  </div>

  <!-- ✏️ FORMULAIRE -->
  <div class="carte">
    <h5 id="titreForm" class="mb-3 text-primary">➕ <span class="lang-fr">Ajouter un cours</span><span class="lang-en">Add course</span><span class="lang-ar">إضافة حصة</span></h5>
    <form id="formCours">
      <input type="hidden" id="id_emploi">
      <div class="row g-3">
        <div class="col-md-3">
          <label class="form-label fw-semibold">📅 <span class="lang-fr">Jour</span><span class="lang-en">Day</span><span class="lang-ar">اليوم</span></label>
          <select id="jour" class="form-select" required>
            <option value="Lundi">Lundi / Monday / الاثنين</option>
            <option value="Mardi">Mardi / Tuesday / الثلاثاء</option>
            <option value="Mercredi">Mercredi / Wednesday / الأربعاء</option>
            <option value="Jeudi">Jeudi / Thursday / الخميس</option>
            <option value="Vendredi">Vendredi / Friday / الجمعة</option>
            <option value="Samedi">Samedi / Saturday / السبت</option>
          </select>
        </div>
        <div class="col-md-2">
          <label class="form-label fw-semibold">⏰ <span class="lang-fr">Début</span><span class="lang-en">Start</span><span class="lang-ar">البدء</span></label>
          <input type="time" id="heure_debut" class="form-control" required>
        </div>
        <div class="col-md-2">
          <label class="form-label fw-semibold">⏱️ <span class="lang-fr">Fin</span><span class="lang-en">End</span><span class="lang-ar">الانتهاء</span></label>
          <input type="time" id="heure_fin" class="form-control" required>
        </div>
        <div class="col-md-3">
          <label class="form-label fw-semibold">📖 <span class="lang-fr">Matière</span><span class="lang-en">Subject</span><span class="lang-ar">المادة</span></label>
          <input type="text" id="matiere" class="form-control" placeholder="Ex: Mathématiques" required>
        </div>
        <div class="col-md-3">
          <label class="form-label fw-semibold">👨‍🏫 <span class="lang-fr">Enseignant</span><span class="lang-en">Teacher</span><span class="lang-ar">الأستاذ</span></label>
          <select id="id_professeur" class="form-select" required>
            <option value="">-- Sélectionner --</option>
          </select>
        </div>
        <div class="col-md-12 text-end">
          <button type="submit" class="btn btn-primaire fw-bold">💾 <span class="lang-fr">Enregistrer</span><span class="lang-en">Save</span><span class="lang-ar">حفظ</span></button>
        </div>
      </div>
    </form>
  </div>

  <!-- 📋 TABLEAU EMPLOI DU TEMPS -->
  <div class="carte">
    <h5 class="mb-3 text-dark">📋 <span class="lang-fr">Emploi du Temps</span><span class="lang-en">Timetable</span><span class="lang-ar">الجدول الزمني</span></h5>
    <div class="table-responsive">
      <table class="table table-striped table-hover align-middle">
        <thead>
          <tr>
            <th>📅 <span class="lang-fr">Jour</span><span class="lang-en">Day</span><span class="lang-ar">اليوم</span></th>
            <th>⏰ <span class="lang-fr">Horaires</span><span class="lang-en">Time</span><span class="lang-ar">الوقت</span></th>
            <th>📖 <span class="lang-fr">Matière</span><span class="lang-en">Subject</span><span class="lang-ar">المادة</span></th>
            <th>👨‍🏫 <span class="lang-fr">Enseignant</span><span class="lang-en">Teacher</span><span class="lang-ar">الأستاذ</span></th>
            <th width="140">⚙️</th>
          </tr>
        </thead>
        <tbody id="corpsEmploi">
          <tr><td colspan="5" class="text-center text-muted py-4">-- Sélectionnez une classe --</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
let listeCours = [];

// 🚀 CHARGEMENT INITIAL
window.onload = async () => {
  appliquerLangue(langue);
  appliquerTheme(theme);
  await chargerClasses();
  await chargerProfesseurs();
};

// 🏫 CHARGER LA LISTE DES CLASSES
async function chargerClasses() {
  try {
    const d = await requeteAPI('/enseignement/classes/liste');
    if (d.ok) {
      const sel = document.getElementById('id_classe');
      sel.innerHTML = `<option value="">${m('choisirClasse')}</option>`;
      d.classes.forEach(c => sel.innerHTML += `<option value="${c.id}">${c.nom_fr || c.code}</option>`);
    }
  } catch(e){ console.error("Erreur classes :", e); }
}

// 👨‍🏫 CHARGER LA LISTE DES ENSEIGNANTS
async function chargerProfesseurs() {
  try {
    const d = await requeteAPI('/utilisateurs/professeurs');
    if (d.ok) {
      const sel = document.getElementById('id_professeur');
      sel.innerHTML = `<option value="">${m('choisirProf')}</option>`;
      d.professeurs.forEach(p => sel.innerHTML += `<option value="${p.id}">${p.prenom || ''} ${p.nom || ''}</option>`);
    }
  } catch(e){ console.error("Erreur profs :", e); }
}

// 📚 CHARGER L'EMPLOI DU TEMPS D'UNE CLASSE
async function chargerEmploi() {
  const id = document.getElementById('id_classe').value;
  if (!id) {
    document.getElementById('corpsEmploi').innerHTML = `<tr><td colspan="5" class="text-center text-muted py-4">${m('choisirClasse')}</td></tr>`;
    listeCours = [];
    return;
  }
  try {
    const d = await requeteAPI(`/enseignement/emploi/liste?classe_id=${id}`);
    if (d.ok) {
      listeCours = d.emploi || [];
      afficherListe();
    }
  } catch(e){ console.error("Erreur emploi :", e); }
}

// 🖥️ AFFICHER LE TABLEAU
function afficherListe() {
  const ordre = {Lundi:1, Mardi:2, Mercredi:3, Jeudi:4, Vendredi:5, Samedi:6};
  listeCours.sort((a,b) => ordre[a.jour] - ordre[b.jour] || a.heure_debut?.localeCompare(b.heure_debut));
  const corps = document.getElementById('corpsEmploi');
  if (!listeCours.length) {
    corps.innerHTML = `<tr><td colspan="5" class="text-center text-muted py-4">${m('aucuneDonnee')}</td></tr>`;
    return;
  }
  corps.innerHTML = '';
  listeCours.forEach(c => {
    corps.innerHTML += `
      <tr>
        <td class="fw-semibold">${c.jour}</td>
        <td>${(c.heure_debut||'').slice(0,5)} — ${(c.heure_fin||'').slice(0,5)}</td>
        <td>${c.matiere_nom || c.matiere}</td>
        <td>${c.prof_nom || c.professeur}</td>
        <td>
          <button class="btn btn-sm btn-modif" onclick="modifier(${c.id})" title="Modifier">✏️</button>
          <button class="btn btn-sm btn-suppr" onclick="supprimer(${c.id})" title="Supprimer">🗑️</button>
        </td>
      </tr>`;
  });
}

// ✏️ PRÉ-REMPLIR POUR MODIFICATION
function modifier(id) {
  const c = listeCours.find(x => Number(x.id) === Number(id));
  if(!c) return;
  document.getElementById('id_emploi').value = c.id;
  document.getElementById('jour').value = c.jour;
  document.getElementById('heure_debut').value = (c.heure_debut||'').slice(0,5);
  document.getElementById('heure_fin').value = (c.heure_fin||'').slice(0,5);
  document.getElementById('matiere').value = c.matiere_nom || c.matiere || '';
  document.getElementById('id_professeur').value = c.professeur_id || '';
  document.getElementById('titreForm').innerHTML = '✏️ ' + m('modifierCours');
  window.scrollTo({top:0,behavior:'smooth'});
}

// 💾 ENREGISTRER (AJOUT / MODIF)
document.getElementById('formCours').onsubmit = async e => {
  e.preventDefault();
  const id_classe = document.getElementById('id_classe').value;
  if (!id_classe) return alert(m('selectionnerClasseDabord'));
  const id_emploi = document.getElementById('id_emploi').value;
  const donnees = {
    affectation_id: id_emploi || null,
    jour: document.getElementById('jour').value,
    heure_debut: document.getElementById('heure_debut').value,
    heure_fin: document.getElementById('heure_fin').value,
    salle: ''
  };
  try {
    let d;
    if (id_emploi) {
      d = await requeteAPI(`/enseignement/emploi/${id_emploi}`, {
        method: 'PUT',
        body: JSON.stringify(donnees)
      });
    } else {
      alert("ℹ️ Créez d'abord une Affectation avant d'ajouter un cours à l'emploi du temps");
      return;
    }
    alert(d.message || d.erreur);
    if (d.ok) { reinitForm(); chargerEmploi(); }
  } catch(err){ alert("❌ Erreur réseau"); }
};

// 🗑️ SUPPRIMER UN COURS
async function supprimer(id) {
  if (!confirm(m('confirmerSuppression'))) return;
  try {
    const d = await requeteAPI(`/enseignement/emploi/${id}`, { method: "DELETE" });
    alert(d.message || d.erreur);
    if (d.ok) chargerEmploi();
  } catch(err){ alert("❌ Erreur réseau"); }
}

// 🔄 RÉINITIALISER LE FORMULAIRE
function reinitForm() {
  document.getElementById('formCours').reset();
  document.getElementById('id_emploi').value = '';
  document.getElementById('titreForm').innerHTML = '➕ ' + m('ajouterCours');
}
</script>
</body>
</html>
