<!DOCTYPE html>
<html lang="fr" class="lang-fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="classementNotes">Classement par Notes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand" href="index.html">🏠 MAMA-ZOUMANA</a>
    <select id="selecteurLangue" class="form-select form-select-sm w-auto ms-auto" onchange="changerLangue(this.value)">
      <option value="fr">🇫🇷 Français</option>
      <option value="en">🇬🇧 English</option>
      <option value="ar">🇸🇦 العربية</option>
    </select>
  </div>
</nav>

<div class="container py-4">
  <h2 class="text-center mb-4">📊 <span data-i18n="classementNotes">Classement par Notes & Moyenne</span></h2>

  <div class="card mb-4">
    <div class="card-body">
      <div class="row">
        <div class="col-md-5 mb-3">
          <label class="form-label fw-bold" data-i18n="modeAffichage">Mode d'affichage</label>
          <select id="modeAffichage" class="form-select form-select-lg" onchange="changerMode()">
            <option value="classe" data-i18n="parClasse">📚 Par Classe</option>
            <option value="general" data-i18n="generalToutesClasses">🌍 Général — Toutes Classes</option>
          </select>
        </div>
        <div class="col-md-7 mb-3" id="zoneClasse">
          <label class="form-label fw-bold" data-i18n="choisirClasse">Sélectionnez une classe</label>
          <select id="choixClasse" class="form-select form-select-lg" onchange="chargerClassement()">
            <option value="" data-i18n="choisirClasse">-- Choisir une classe --</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <div id="infosClassement" class="alert alert-info d-none"></div>

  <div class="card mb-3">
    <div class="card-header fw-bold" data-i18n="legendeMentions">🏅 Légende des Mentions</div>
    <div class="card-body py-2">
      <span class="badge bg-success m-1" data-i18n="mentionTB">≥16 : Très Bien 🎖️</span>
      <span class="badge bg-primary m-1" data-i18n="mentionB">14-15,99 : Bien 🎉</span>
      <span class="badge bg-info text-dark m-1" data-i18n="mentionAB">12-13,99 : Assez Bien ✅</span>
      <span class="badge bg-warning text-dark m-1" data-i18n="mentionP">10-11,99 : Passable</span>
      <span class="badge bg-danger m-1" data-i18n="mentionI">&lt;10 : Insuffisant ⚠️</span>
    </div>
  </div>

  <div class="card">
    <div class="card-header bg-dark text-white fw-bold">📋 Résultats</div>
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-striped table-hover mb-0">
          <thead class="table-dark">
            <tr>
              <th data-i18n="rang">Rang</th>
              <th data-i18n="classe">Classe</th>
              <th data-i18n="matricule">Matricule</th>
              <th data-i18n="nomPrenoms">Nom & Prénoms</th>
              <th data-i18n="moyenne">Moyenne</th>
              <th data-i18n="mention">Mention</th>
              <th data-i18n="appreciation">Appréciation</th>
            </tr>
          </thead>
          <tbody id="corpsClassement">
            <tr><td colspan="7" class="text-center text-muted py-4" data-i18n="chargement">Chargement...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="mt-3 text-center">
    <a href="classe-emploi.html" class="btn btn-secondary">↩️ <span data-i18n="retour">Retour</span></a>
  </div>
</div>

<script src="config.js"></script>
<script src="lang-config.js"></script>
<script>
const API = `${API_URL}/classe-emploi`;
let modeActuel = 'classe';

window.onload = async () => {
  document.getElementById('selecteurLangue').value = langueActuelle;
  appliquerTraductions();
  await chargerListeClasses();
};

async function chargerListeClasses() {
  const res = await fetch(`${API}/liste-classes`);
  const d = await res.json();
  if (d.ok) {
    const sel = document.getElementById('choixClasse');
    sel.innerHTML = `<option value="">-- ${traductions[langueActuelle].choisirClasse} --</option>`;
    d.classes.forEach(c => sel.innerHTML += `<option value="${c.id_classe}">${c.libelle_classe}</option>`);
  }
}

function changerMode() {
  modeActuel = document.getElementById('modeAffichage').value;
  document.getElementById('zoneClasse').classList.toggle('d-none', modeActuel === 'general');
  if (modeActuel === 'general') chargerClassementGeneral();
  else document.getElementById('corpsClassement').innerHTML = `<tr><td colspan="7" class="text-center">-- ${traductions[langueActuelle].choisirClasse} --</td></tr>`;
}

async function chargerClassement() {
  const id = document.getElementById('choixClasse').value;
  if (!id) return;
  document.getElementById('infosClassement').classList.remove('d-none');
  document.getElementById('infosClassement').textContent = traductions[langueActuelle].chargement;
  const res = await fetch(`${API}/classement-notes/classe/${id}`);
  afficherResultats(await res.json());
}

async function chargerClassementGeneral() {
  document.getElementById('infosClassement').classList.remove('d-none');
  document.getElementById('infosClassement').textContent = traductions[langueActuelle].chargement;
  const res = await fetch(`${API}/classement-notes/general`);
  afficherResultats(await res.json());
}

function afficherResultats(d) {
  const t = traductions[langueActuelle];
  if (!d.ok) {
    document.getElementById('corpsClassement').innerHTML = `<tr><td colspan="7" class="text-center text-danger">⚠️ ${d.erreur}</td></tr>`;
    return;
  }
  document.getElementById('infosClassement').innerHTML = `<strong>${d.classe?.libelle_classe || t.generalToutesClasses}</strong> — ${d.effectif || d.total_eleves} ${t.eleve}`;
  let html = '';
  d.classement.forEach((e, idx) => {
    const rang = e.moyenne ? `${idx+1}<sup>èr</sup>` : '—';
    const moyenne = e.moyenne ? `<strong>${e.moyenne}/20</strong>` : '<span class="text-muted">—</span>';
    html += `<tr>
      <td class="fw-bold">${rang}</td>
      <td>${e.libelle_classe || d.classe?.libelle_classe || '-'}</td>
      <td><code>${e.matricule}</code></td>
      <td>${e.nom} ${e.prenoms}</td>
      <td>${moyenne}</td>
      <td><span class="badge bg-${e.couleur || 'secondary'}">${e.mention || t.mentionAucune}</span></td>
      <td><small>${e.appreciation || ''}</small></td>
    </tr>`;
  });
  document.getElementById('corpsClassement').innerHTML = html || `<tr><td colspan="7" class="text-center">${t.aucunResultat}</td></tr>`;
}
</script>
</body>
</html>
