<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>
    <span class="lang-fr">Messagerie</span>
    <span class="lang-en">Messages</span>
    <span class="lang-ar">الرسائل</span>
  </title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    :root {
      --sombre: #0f172a;
      --sombre-clair: #1e293b;
      --bord-orange: #f59e0b;
      --bleu: #3b82f6;
      --texte: #f8fafc;
    }
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:var(--sombre);color:var(--texte);min-height:100vh;font-family:'Segoe UI',sans-serif;}
    .entete-page{background:var(--sombre-clair);border-bottom:2px solid var(--bord-orange);padding:1.2rem 0}
    .carte{background:var(--sombre-clair);border-radius:12px;border-left:3px solid var(--bord-orange);padding:1.2rem;}
    .ligne-msg{border-bottom:1px solid #334155;padding:1rem;cursor:pointer;transition:background 0.2s;}
    .ligne-msg:hover{background:rgba(245,158,11,0.08);border-radius:6px;}
    .ligne-msg.non-lu{border-left:3px solid var(--bord-orange);background:rgba(245,158,11,0.05);}
    .btn-action{background:var(--bleu);color:white;border-radius:8px;border:none;}
    .btn-langue.active{background:var(--bord-orange);color:#000;border-color:var(--bord-orange);font-weight:bold;}

    .lang-en, .lang-ar { display: none; }
    body.lang-fr .lang-fr { display: inline; }
    body.lang-en { direction: ltr; }
    body.lang-en .lang-fr, body.lang-en .lang-ar { display: none; }
    body.lang-en .lang-en { display: inline; }
    body.lang-ar { direction: rtl; }
    body.lang-ar .lang-fr, body.lang-ar .lang-en { display: none; }
    body.lang-ar .lang-ar { display: inline; }
  </style>
</head>
<body class="lang-fr">

<script>
const token = localStorage.getItem('token');
const role = localStorage.getItem('role');
if(!token || role !== 'prof'){
  alert("⛔ Accès réservé aux enseignants");
  localStorage.clear();
  location.href = 'connexion.html';
}
</script>

<div class="entete-page">
  <div class="container d-flex justify-content-between align-items-center">
    <div>
      <h3 class="mb-1">
        <span class="lang-fr">📬 Messagerie</span>
        <span class="lang-en">📬 Messages</span>
        <span class="lang-ar">📬 الرسائل</span>
      </h3>
      <p class="mb-0 opacity-75">
        <span class="lang-fr">Communiquer avec l'administration et les parents</span>
        <span class="lang-en">Communicate with admin and parents</span>
        <span class="lang-ar">التواصل مع الإدارة وأولياء الأمور</span>
      </p>
    </div>
    <div class="d-flex align-items-center gap-2">
      <button class="btn btn-sm btn-outline-light btn-langue active" onclick="changerLangue('fr')" id="btn-fr">FR</button>
      <button class="btn btn-sm btn-outline-light btn-langue" onclick="changerLangue('en')" id="btn-en">EN</button>
      <button class="btn btn-sm btn-outline-light btn-langue" onclick="changerLangue('ar')" id="btn-ar">AR</button>
      <a href="contacter-parents.html" class="btn btn-action ms-2">
        <i class="bi bi-plus-lg"></i>
        <span class="lang-fr"> Nouveau</span>
        <span class="lang-en"> New</span>
        <span class="lang-ar"> جديد</span>
      </a>
      <a href="dashboard.html" class="btn btn-outline-light ms-2">
        <i class="bi bi-arrow-left"></i>
      </a>
    </div>
  </div>
</div>

<div class="container py-4">
  <div class="carte">
    <h5 class="mb-3">
      <span class="lang-fr">📋 Messages Reçus</span>
      <span class="lang-en">📋 Inbox</span>
      <span class="lang-ar">📋 الوارد</span>
    </h5>
    <div id="listeMessages">
      <div class="text-center py-4 text-muted">
        <span class="lang-fr">Chargement...</span>
        <span class="lang-en">Loading...</span>
        <span class="lang-ar">جار التحميل...</span>
      </div>
    </div>
  </div>
</div>

<script>
const BASE_URL = "/api/messages";

async function chargerMessages(){
  try {
    const r = await fetch(BASE_URL + '/recus', {headers:{'Authorization':`Bearer ${token}`}});
    const res = await r.json();
    const liste = document.getElementById('listeMessages');
    if(res.ok && res.lignes.length > 0){
      liste.innerHTML = res.lignes.map(m=>`
        <div class="ligne-msg ${m.lu==0?'non-lu':''}">
          <div class="d-flex justify-content-between align-items-start">
            <div>
              <h6 class="mb-1 fw-bold">${m.sujet || 'Sans sujet'}</h6>
              <p class="mb-1 small opacity-75">${m.expediteur || 'Expéditeur inconnu'}</p>
              <p class="mb-0 text-truncate opacity-75">${(m.contenu||'').substring(0,80)}...</p>
            </div>
            <div class="small opacity-50 text-nowrap ms-2">${m.date_envoi || ''}</div>
          </div>
        </div>
      `).join('');
    } else {
      liste.innerHTML = `<div class="text-center py-4 text-muted">
        <span class="lang-fr">Aucun message</span>
        <span class="lang-en">No messages</span>
        <span class="lang-ar">لا توجد رسائل</span>
      </div>`;
    }
  } catch(e) { 
    console.log("❌ Erreur chargement messages :", e);
    document.getElementById('listeMessages').innerHTML = `<div class="text-center py-4 text-muted">
      <span class="lang-fr">Erreur de chargement</span>
      <span class="lang-en">Load error</span>
      <span class="lang-ar">خطأ في التحميل</span>
    </div>`;
  }
}

function changerLangue(langue) {
  document.body.className = 'lang-' + langue;
  localStorage.setItem('langue', langue);
  document.querySelectorAll('.btn-langue').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-'+langue).classList.add('active');
}

// 🚀 Au chargement
let langue = localStorage.getItem('langue') || 'fr';
document.body.className = 'lang-' + langue;
document.querySelectorAll('.btn-langue').forEach(b => b.classList.remove('active'));
document.getElementById('btn-'+langue).classList.add('active');

chargerMessages();
</script>

</body>
</html>
