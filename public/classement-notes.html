<!DOCTYPE html>
<html lang="fr" class="lang-fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="classementNotes">Classement par Notes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    :root {
      --primaire: #0c4a6e;
    }
    sup { font-size: 0.65em; }
    tr:hover { transition: background 0.2s ease; }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark" style="background: linear-gradient(90deg, #0f172a, #0c4a6e);">
  <div class="container">
    <a class="navbar-brand" href="index.html">🏠 MAMA-ZOUMANA</a>
    <div class="d-flex align-items-center gap-2">
      <select id="selecteurLangue" class="form-select form-select-sm" onchange="changerLangue(this.value)">
        <option value="fr">🇫🇷 Français</option>
        <option value="en">🇬🇧 English</option>
        <option value="ar">🇸🇦 العربية</option>
      </select>
    </div>
  </div>
</nav>

<div class="container py-4">
  <h2 class="text-center mb-4">📊 <span data-i18n="classementNotes">Classement par Notes & Moyenne</span></h2>

  <div class="card mb-4 shadow-sm">
    <div class="card-body">
      <div class="row">
        <div class="col-md-5 mb-3">
          <label class="form-label fw-bold" data-i18n="modeAffichage">Mode d'affichage</label>
          <select id="modeAffichage" class="form-select form-select-lg" onchange="changerMode()">
            <option value="classe" data-i18n="parClasse">📚 Par Classe</option>
            <option value="general" data-i18n="generalToutesClasses">🌍 Général — Toutes Classes</option>
          </select>
        </div>
        <div class="col-md-7 mb-7" id="zoneClasse">
          <label class="form-label fw-bold" data-i18n="choisirClasse">Sélectionnez une classe</label>
          <select id="choixClasse" class="form-select form-select-lg" onchange="chargerClassement()">
            <option value="" data-i18n="choisirClasse">-- Choisir une classe --</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <div id="infosClassement" class="alert alert-info d-none"></div>

  <div class="card mb-3 shadow-sm">
    <div class="card-header fw-bold" data-i18n="legendeMentions">🏅 Légende des Mentions</div>
    <div class="card-body py-2">
      <span class="badge bg-success m-1">≥16 : Très Bien 🎖️</span>
      <span class="badge bg-primary m-1">14–15,99 : Bien 🎉</span>
      <span class="badge bg-info text-dark m-1">12–13,99 : Assez Bien ✅</span>
      <span class="badge bg-warning text-dark m-1">10–11,99 : Passable</span>
      <span class="badge bg-danger m-1">&lt;10 : Insuffisant ⚠️</span>
    </div>
  </div>

  <div class="card shadow-sm">
    <div class="card-header bg-dark text-white fw-bold">📋 <span data-i18n="resultats">Résultats</span></div>
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-striped table-hover mb-0">
          <thead class="table-dark">
            <tr>
              <th data-i18n="rang">Rang</th>
              <th data-i18n="classe">Classe</th>
              <th data-i18n="matricule">Matricule</th>
              <th data-i18n="nomPrenoms">Nom & Prénoms</th>
              <th data-i18n="moyenne">Moyenne</th>
              <th data-i18n="mention">Mention</th>
              <th data-i18n="appreciation">Appréciation</th>
            </tr>
          </thead>
          <tbody id="corpsClassement">
            <tr>
              <td colspan="7" class="text-center text-muted py-4">
                <div class="spinner-border text-primary"></div>
                <p class="mt-2 mb-0" data-i18n="chargement">Chargement...</p>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="mt-4 text-center">
    <a href="classe-emploi.html" class="btn btn-secondary">↩️ <span data-i18n="retour">Retour</span></a>
  </div>
</div>

<script>
  // ==================================================
  // ✅ CONFIGURATION API
  // ==================================================
  const API_BASE = "https://mama-zoumana.onrender.com/api";
  const API = `${API_BASE}/classe-emploi`;
  let langueActuelle = localStorage.getItem('langue') || 'fr';
  let modeActuel = 'classe';

  // ==================================================
  // ✅ TRADUCTIONS INTÉGRÉES
  // ==================================================
  const traductions = {
    fr: {
      classementNotes: "Classement par Notes & Moyenne",
      modeAffichage: "Mode d'affichage",
      parClasse: "📚 Par Classe",
      generalToutesClasses: "🌍 Général — Toutes Classes",
      choisirClasse: "-- Choisir une classe --",
      legendeMentions: "🏅 Légende des Mentions",
      resultats: "Résultats",
      chargement: "Chargement...",
      aucunResultat: "Aucun résultat trouvé",
      erreurChargement: "Erreur lors du chargement",
      rang: "Rang",
      classe: "Classe",
      matricule: "Matricule",
      nomPrenoms: "Nom & Prénoms",
      moyenne: "Moyenne",
      mention: "Mention",
      mentionAucune: "—",
      appreciation: "Appréciation",
      eleve: "élève(s)",
      retour: "Retour"
    },
    en: {
      classementNotes: "Ranking by Grades & Average",
      modeAffichage: "Display mode",
      parClasse: "📚 By Class",
      generalToutesClasses: "🌍 All Classes",
      choisirClasse: "-- Select a class --",
      legendeMentions: "🏅 Grading Legend",
      resultats: "Results",
      chargement: "Loading...",
      aucunResultat: "No results found",
      erreurChargement: "Loading error",
      rang: "Rank",
      classe: "Class",
      matricule: "Student ID",
      nomPrenoms: "Full Name",
      moyenne: "Average",
      mention: "Honors",
      mentionAucune: "—",
      appreciation: "Comment",
      eleve: "student(s)",
      retour: "Back"
    },
    ar: {
      classementNotes: "الترتيب حسب المعدلات",
      modeAffichage: "وضع العرض",
      parClasse: "📚 حسب الفصل",
      generalToutesClasses: "🌍 جميع الفصول",
      choisirClasse: "-- اختر الفصل --",
      legendeMentions: "🏅 دلالات التقدير",
      resultats: "النتائج",
      chargement: "جارٍ التحميل...",
      aucunResultat: "لم يتم العثور على نتائج",
      erreurChargement: "خطأ في التحميل",
      rang: "الترتيب",
      classe: "الفصل",
      matricule: "المعرف",
      nomPrenoms: "الاسم الكامل",
      moyenne: "المعدل",
      mention: "التقدير",
      mentionAucune: "—",
      appreciation: "ملاحظات",
      eleve: "تلميذ(ة)",
      retour: "عودة"
    }
  };

  // ==================================================
  // ✅ GESTION LANGUE
  // ==================================================
  function changerLangue(lang) {
    langueActuelle = lang;
    localStorage.setItem('langue', lang);
    document.documentElement.lang = lang;
    document.documentElement.classList.remove('lang-fr','lang-en','lang-ar');
    document.documentElement.classList.add(`lang-${lang}`);
    document.body.style.direction = lang === 'ar' ? 'rtl' : 'ltr';
    appliquerTraductions();
  }

  function appliquerTraductions() {
    const t = traductions[langueActuelle];
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const cle = el.getAttribute('data-i18n');
      if (t[cle]) el.textContent = t[cle];
    });
  }

  // ==================================================
  // ✅ REQUÊTE API SÉCURE
  // ==================================================
  async function requeteAPI(url) {
    try {
      const reponse = await fetch(url, { signal: AbortSignal.timeout(12000) });
      if (!reponse.ok) throw new Error(`Erreur ${reponse.status}`);
      return await reponse.json();
    } catch (err) {
      console.warn("❌", url, err.message);
      return { ok: false, erreur: err.message };
    }
  }

  // ==================================================
  // ✅ CHARGER LISTE DES CLASSES
  // ==================================================
  async function chargerListeClasses() {
    const sel = document.getElementById('choixClasse');
    const t = traductions[langueActuelle];
    sel.disabled = true;
    const d = await requeteAPI(`${API}/liste-classes`);
    sel.disabled = false;
    sel.innerHTML = `<option value="">-- ${t.choisirClasse} --</option>`;
    if (d.ok && Array.isArray(d.classes)) {
      d.classes.forEach(c => {
        const libelle = c.libelle_classe || c.libelle || '';
        sel.innerHTML += `<option value="${c.id_classe || c.id || libelle}">${libelle}</option>`;
      });
    } else {
      sel.innerHTML += `<option disabled>⚠️ ${t.erreurChargement}</option>`;
    }
  }

  // ==================================================
  // ✅ CHANGER MODE D'AFFICHAGE
  // ==================================================
  function changerMode() {
    modeActuel = document.getElementById('modeAffichage').value;
    document.getElementById('zoneClasse').classList.toggle('d-none', modeActuel === 'general');
    if (modeActuel === 'general') {
      chargerClassementGeneral();
    } else {
      const t = traductions[langueActuelle];
      document.getElementById('corpsClassement').innerHTML = `<tr><td colspan="7" class="text-center text-muted py-4">-- ${t.choisirClasse} --</td></tr>`;
      document.getElementById('infosClassement').classList.add('d-none');
    }
  }

  // ==================================================
  // ✅ CHARGER CLASSEMENT PAR CLASSE
  // ==================================================
  async function chargerClassement() {
    const id = document.getElementById('choixClasse').value;
    const t = traductions[langueActuelle];
    if (!id) return;

    document.getElementById('infosClassement').classList.remove('d-none', 'alert-info', 'alert-danger');
    document.getElementById('infosClassement').classList.add('alert-info');
    document.getElementById('infosClassement').textContent = t.chargement;

    const data = await requeteAPI(`${API}/classement-notes/classe/${id}`);
    afficherResultats(data);
  }

  // ==================================================
  // ✅ CHARGER CLASSEMENT GÉNÉRAL
  // ==================================================
  async function chargerClassementGeneral() {
    const t = traductions[langueActuelle];
    document.getElementById('infosClassement').classList.remove('d-none', 'alert-info', 'alert-danger');
    document.getElementById('infosClassement').classList.add('alert-info');
    document.getElementById('infosClassement').textContent = t.chargement;

    const data = await requeteAPI(`${API}/classement-notes/general`);
    afficherResultats(data);
  }

  // ==================================================
  // ✅ AFFICHAGE COMMUN DES RÉSULTATS
  // ==================================================
  function afficherResultats(d) {
    const t = traductions[langueActuelle];
    const corps = document.getElementById('corpsClassement');
    const infos = document.getElementById('infosClassement');

    if (!d.ok || !Array.isArray(d.classement)) {
      infos.classList.remove('alert-info');
      infos.classList.add('alert-danger');
      infos.textContent = `${t.erreurChargement} : ${d.erreur || ''}`;
      corps.innerHTML = `<tr><td colspan="7" class="text-center text-danger py-4">⚠️ ${t.aucunResultat}</td></tr>`;
      return;
    }

    // Infos en-tête
    const libClasse = d.classe?.libelle_classe || t.generalToutesClasses;
    const effectif = d.effectif || d.total_eleves || d.classement.length;
    infos.innerHTML = `<strong>${libClasse}</strong> — ${effectif} ${t.eleve}`;

    // Construction tableau
    let html = '';
    d.classement.forEach((e, idx) => {
      const moyenne = Number(e.moyenne);
      const rang = e.moyenne ? `${idx + 1}<sup>er</sup>` : '—';
      const affMoyenne = e.moyenne ? `<strong>${moyenne.toFixed(2)}/20</strong>` : '<span class="text-muted">—</span>';
      const classe = e.libelle_classe || d.classe?.libelle_classe || '-';
      const nom = e.nom || e.nom_eleve || '';
      const prenoms = e.prenoms || e.prenom || '';
      const mention = e.mention || '';
      const appreciation = e.appreciation || '';
      const badgeCouleur = e.couleur || (
        moyenne >= 16 ? 'success' :
        moyenne >= 14 ? 'primary' :
        moyenne >= 12 ? 'info text-dark' :
        moyenne >= 10 ? 'warning text-dark' : 'danger'
      );

      html += `<tr>
        <td class="fw-bold">${rang}</td>
        <td>${classe}</td>
        <td><code>${e.matricule || '-'}</code></td>
        <td>${nom} ${prenoms}</td>
        <td>${affMoyenne}</td>
        <td><span class="badge bg-${badgeCouleur}">${mention || t.mentionAucune}</span></td>
        <td><small>${appreciation}</small></td>
      </tr>`;
    });

    corps.innerHTML = html || `<tr><td colspan="7" class="text-center text-muted py-4">${t.aucunResultat}</td></tr>`;
  }

  // ==================================================
  // ✅ INITIALISATION
  // ==================================================
  document.addEventListener('DOMContentLoaded', async () => {
    document.getElementById('selecteurLangue').value = langueActuelle;
    appliquerTraductions();
    await chargerListeClasses();
  });
</script>
</body>
</html>
