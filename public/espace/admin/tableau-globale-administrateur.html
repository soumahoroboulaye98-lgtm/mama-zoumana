<!DOCTYPE html>
<html lang="fr" class="lang-fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>
    <span class="txt-fr">Tableau de Bord — Administration</span>
    <span class="txt-en">Dashboard — Administration</span>

  </title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    /* ===== 🎨 VARIABLES CLAIR / SOMBRE ===== */
    :root, :root[data-bs-theme="light"] {
      --primaire: #0c4a6e; --succes: #10b981; --alerte: #f59e0b;
      --danger: #ef4444; --info: #3b82f6; --sombre: #ffffff;
      --sombre-clair: #f1f5f9; --texte: #1e293b; --texte-dore: #b45309;
      --bordure: #e2e8f0; --carte: #ffffff; --ombre: rgba(15,23,42,.08);
      --input-fond: #f8fafc; --dore: #b78628; --dore-clair: #d4a03a;
    }
    :root[data-bs-theme="dark"] {
      --primaire: #0369a1; --succes: #34d399; --alerte: #fbbf24;
      --danger: #f87171; --info: #60a5fa; --sombre: #0f172a;
      --sombre-clair: #1e293b; --texte: #f8fafc; --texte-dore: #fcd34d;
      --bordure: rgba(245,158,11,.25); --carte: rgba(30,41,59,.85); --ombre: rgba(0,0,0,.3);
      --input-fond: rgba(15,23,42,.6); --dore: #9a6f22; --dore-clair: #b78628;
    }
    /* ===== 🗣️ TRILINGUE ===== */
    .txt-en,.txt-ar{display:none}
    body.lang-fr .txt-fr{display:inline}
    body.lang-en .txt-en{display:inline}
    body.lang-ar .txt-ar{display:inline}
    body.lang-en .txt-fr,body.lang-en .txt-ar{display:none}
    body.lang-fr .txt-en,body.lang-fr .txt-ar{display:none}
    body.lang-ar .txt-fr,body.lang-ar .txt-en{display:none}
    body.lang-ar { direction: rtl; }
    /* ===== GÉNÉRAL ===== */
    body {
      background: linear-gradient(160deg, var(--dore), var(--dore-clair));
      color: var(--texte);
      min-height: 100vh;
      transition: background .4s ease, color .3s ease;
    }
    .entete {
      background: rgba(15,23,42,.85);
      border-bottom: 2px solid var(--alerte);
      padding: 1.5rem 0;
      backdrop-filter: blur(10px);
    }
    .carte {
      background: var(--carte);
      border-radius: 12px;
      padding: 1.25rem;
      border-left: 3px solid var(--alerte);
      margin-bottom: 1.5rem;
      box-shadow: 0 4px 20px var(--ombre);
      transition: transform .3s ease;
    }
    .carte:hover { transform: translateY(-3px); }
    .barre-langue { display: flex; gap: .75rem; justify-content: center; margin-bottom: 2rem; }
    .lang-btn.active { background:var(--alerte); border-color:var(--alerte); color:#000; }
    .theme-btn { width:38px; height:38px; border-radius:50%; border:2px solid; padding:0; display:flex; align-items:center; justify-content:center; }
    .no-print { display: none !important; }
    @media print { .no-print { display: none !important; } }
    /* ===== CARTES COMPTEURS ===== */
    .carte-compteur {
      border-radius: 12px;
      padding: 1.25rem;
      color: white;
      box-shadow: 0 4px 12px rgba(0,0,0,.15);
      transition: transform .3s ease;
      cursor: pointer;
      text-decoration: none;
      display: block;
    }
    .carte-compteur:hover { transform: scale(1.04); color: white; }
    /* ===== GRAPHIQUES ===== */
    .conteneur-graphique {
      position: relative;
      height: 260px;
      width: 100%;
    }
    /* ===== LIENS RAPIDES ===== */
    .lien-module {
      display: block;
      padding: 1rem;
      border-radius: 10px;
      background: var(--sombre-clair);
      color: var(--texte);
      text-decoration: none;
      transition: all .25s ease;
      border-left: 3px solid transparent;
    }
    .lien-module:hover {
      border-left-color: var(--alerte);
      background: rgba(245,158,11,.08);
      transform: translateX(4px);
    }
    .titre-module { font-weight: 600; margin-bottom: .25rem; }
    .resume-module { font-size: .9rem; opacity: .75; }
  </style>
</head>

  // ✅ Requête API standardisée
  async function requeteAPI(chemin, options = {}) {
    const reponse = await fetch(`${API_URL}${chemin}`, {
      ...options,
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${getToken() || ''}`,
        ...options.headers
      }
    });
    const donnees = await reponse.json();
    if (reponse.status === 401) {
      alert("⛔ Session expirée — Reconnectez-vous");

      window.location.href = 'connexion.html';

    return donnees;

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // ==================================================
  // 📊 VARIABLES GRAPHIQUES
  // ==================================================
  let graphClasse = null, graphFiliere = null, graphTendance = null;

  // ==================================================
  // 🎨 MODE CLAIR/SOMBRE
  // ==================================================
  document.getElementById('btnTheme').addEventListener('click', () => {
    const actuel = document.documentElement.getAttribute('data-bs-theme') || 'light';
    const nouveau = actuel === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-bs-theme', nouveau);
    localStorage.setItem('theme', nouveau);
    majIconeTheme(nouveau);
    setTimeout(majCouleursGraphiques, 100);
  });

  function majIconeTheme(theme) {
    const icone = document.getElementById('iconeTheme');
    icone.className = theme === 'dark' ? 'bi bi-sun' : 'bi bi-moon-stars';
  }
  majIconeTheme(themeActuel);

  // ==================================================
  // 🗣️ CHANGEMENT DE LANGUE
  // ==================================================
  document.querySelectorAll('.lang-btn').forEach(bouton => {
    bouton.addEventListener('click', () => {
      const lang = bouton.dataset.lang;
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
      bouton.classList.add('active');
      document.body.className = `lang-${lang}`;
      localStorage.setItem('langue', lang);
      chargerTextesStatiques();
      chargerDonnees();
    });
  });
  document.querySelector(`[data-lang="${langueActuelle}"]`)?.classList.add('active');

  // ==================================================
  // 🚪 DÉCONNEXION
  // ==================================================
  function deconnexion() {
    localStorage.clear();
    location.href = 'index.html';
  }

  // ==================================================
  // 🔠 CHARGER TEXTES TRADUITS
  // ==================================================
  function chargerTextesStatiques() {
    document.getElementById('bonjourTxt').textContent =
      langueActuelle === 'fr' ? 'Bonjour,' :
      langueActuelle === 'ar' ? 'مرحباً،' : 'Hello,';
    document.getElementById('nomUtilisateurAffiche').textContent = nomUtilisateur;
    document.getElementById('dateJour').textContent =
      `${m('aujourdhui')} ${new Date().toLocaleDateString(
        langueActuelle==='fr'?'fr-FR':langueActuelle==='ar'?'ar-SA':'en-GB',
        {dateStyle:'long'}
      )}`;

    document.getElementById('lbl-eleves').textContent = m('totalEleves');
    document.getElementById('lbl-profs').textContent = m('totalProfs');
    document.getElementById('lbl-documents').textContent = m('totalDocuments');
    document.getElementById('lbl-frais').textContent = m('fraisPayes');
    document.getElementById('lbl-parClasse').textContent = m('parClasse');
    document.getElementById('lbl-parFiliere').textContent = m('parParcours');
    document.getElementById('lbl-tendance').textContent = m('tendanceInscriptions');
  }

  // ==================================================
  // 📥 CHARGER DONNÉES DEPUIS L'API
  // ==================================================
  async function chargerDonnees() {
    try {
      const enTetes = { Authorization: `Bearer ${token}` };

      // 🔄 Chargement en parallèle
      const [resEleves, resPersonnel, resDocs, resPaiments] = await Promise.allSettled([
        fetch(`${API_URL}/eleves/tous`, { headers: enTetes }),
        fetch(`${API_URL}/personnel/tous`, { headers: enTetes }),
        fetch(`${API_URL}/documents/tous`, { headers: enTetes }),
        fetch(`${API_URL}/paiements/tous`, { headers: enTetes })
      ]);

      // 📊 Élèves
      let eleves = [];
      if (resEleves.status === 'fulfilled') {
        const d = await resEleves.value.json();
        eleves = d.ok ? (d.lignes || d.eleves || []) : [];
      }
      document.getElementById('c-eleves').textContent = eleves.length || '0';

      // 👨‍🏫 Personnel
      let personnel = [];
      if (resPersonnel.status === 'fulfilled') {
        const d = await resPersonnel.value.json();
        personnel = d.ok ? (d.lignes || d.personnel || []) : [];
      }
      document.getElementById('c-profs').textContent = personnel.length || '0';

      // 📄 Documents
      let documents = [];
      if (resDocs.status === 'fulfilled') {
        const d = await resDocs.value.json();
        documents = d.ok ? (d.lignes || d.documents || []) : [];
      }
      document.getElementById('c-documents').textContent = documents.length || '0';

      // 💰 Paiements
      let totalFrais = 0;
      if (resPaiments.status === 'fulfilled') {
        const d = await resPaiments.value.json();
        const paiements = d.ok ? (d.lignes || d.paiements || []) : [];
        totalFrais = paiements.reduce((somme, p) => somme + (Number(p.montant) || 0), 0);
      }
      document.getElementById('c-frais').textContent = totalFrais.toLocaleString('fr-FR') + ' F CFA';

      // 📊 Graphique par Classe
      const parClasse = {};
      eleves.forEach(e => {
        const c = e.classe || e.nom_classe || '—';
        parClasse[c] = (parClasse[c] || 0) + 1;
      });
      creerGraphiqueClasse(parClasse);

      // 🎓 Graphique par Filière
      const parFiliere = {};
      eleves.forEach(e => {
        const f = e.filiere || e.parcours || 'Générale';
        parFiliere[f] = (parFiliere[f] || 0) + 1;
      });
      creerGraphiqueFiliere(parFiliere);

      // 📈 Tendance inscriptions (6 derniers mois)
      const parMois = {};
      for (let i = 5; i >= 0; i--) {
        const dt = new Date(); dt.setMonth(dt.getMonth() - i);
        const cle = dt.toLocaleDateString(
          langueActuelle==='fr'?'fr-FR':langueActuelle==='ar'?'ar-SA':'en-GB',
          { month: 'short' }
        );
        parMois[cle] = 0;
      }
      eleves.forEach(e => {
        if (!e.date_creation && !e.date_inscription) return;
        const dt = new Date(e.date_creation || e.date_inscription);
        if (isNaN(dt.getTime())) return;
        const cle = dt.toLocaleDateString(
          langueActuelle==='fr'?'fr-FR':langueActuelle==='ar'?'ar-SA':'en-GB',
          { month: 'short' }
        );
        if (parMois.hasOwnProperty(cle)) parMois[cle]++;
      });
      creerGraphiqueTendance(parMois);

    } catch (err) {
      console.warn("⚠️ Mode données locales activé :", err.message);
      document.getElementById('c-eleves').textContent = getItem('nb_eleves') || '—';
      document.getElementById('c-profs').textContent = getItem('nb_personnel') || '—';
      const docsLocaux = JSON.parse(getItem('documents_crees') || '[]');
      document.getElementById('c-documents').textContent = docsLocaux.length;
      document.getElementById('c-frais').textContent = '— F CFA';
    }
  }

  // ==================================================
  // 📊 GRAPHIQUE PAR CLASSE (BARRES)
  // ==================================================
  function creerGraphiqueClasse(donnees) {
    const etiquettes = Object.keys(donnees);
    const valeurs = Object.values(donnees);
    const ctx = document.getElementById('graphiqueClasse').getContext('2d');
    if (graphClasse) graphClasse.destroy();
    const couleurTexte = themeActuel === 'dark' ? '#cbd5e1' : '#475569';
    const couleurGrille = themeActuel === 'dark' ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.05)';

    graphClasse = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: etiquettes,
        datasets: [{
          data: valeurs,
          backgroundColor: COULEURS.slice(0, etiquettes.length),
          borderRadius: 8
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          y: { beginAtZero: true, ticks: { color: couleurTexte }, grid: { color: couleurGrille } },
          x: { ticks: { color: couleurTexte }, grid: { display: false } }
        }
      }
    });
  }

  // ==================================================
  // 🎓 GRAPHIQUE PAR FILIÈRE (CAMEMBERT)
  // ==================================================
  function creerGraphiqueFiliere(donnees) {
    const etiquettes = Object.keys(donnees);
    const valeurs = Object.values(donnees);
    const ctx = document.getElementById('graphiqueFiliere').getContext('2d');
    if (graphFiliere) graphFiliere.destroy();
    const couleurTexte = themeActuel === 'dark' ? '#cbd5e1' : '#475569';
    const couleurBordure = themeActuel === 'dark' ? '#1e293b' : '#fff';

    graphFiliere = new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: etiquettes,
        datasets: [{
          data: valeurs,
          backgroundColor: COULEURS.slice(0, etiquettes.length),
          borderWidth: 2,
          borderColor: couleurBordure
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { position: 'bottom', labels: { color: couleurTexte, padding: 15 } }
        }
      }
    });
  }

  // ==================================================
  // 📈 GRAPHIQUE TENDANCE INSCRIPTIONS (COURBE)
  // ==================================================
  function creerGraphiqueTendance(donnees) {
    const etiquettes = Object.keys(donnees);
    const valeurs = Object.values(donnees);
    const ctx = document.getElementById('graphiqueTendance').getContext('2d');
    if (graphTendance) graphTendance.destroy();
    const couleurTexte = themeActuel === 'dark' ? '#cbd5e1' : '#475569';
    const couleurGrille = themeActuel === 'dark' ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.05)';

    graphTendance = new Chart(ctx, {
      type: 'line',
      data: {
        labels: etiquettes,
        datasets: [{
          label: m('totalEleves'),
          data: valeurs,
          borderColor: '#f59e0b',
          backgroundColor: 'rgba(245,158,11,.15)',
          fill: true,
          tension: .4,
          pointBackgroundColor: '#f59e0b',
          pointRadius: 5
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          y: { beginAtZero: true, ticks: { color: couleurTexte }, grid: { color: couleurGrille } },
          x: { ticks: { color: couleurTexte }, grid: { display: false } }
        }
      }
    });
  }

  // ==================================================
  // 🎨 RAFRAÎCHIR GRAPHIQUES AU CHANGEMENT DE THÈME
  // ==================================================
  function majCouleursGraphiques() {
    chargerDonnees();
  }

  // ==================================================
  // 🚀 LANCEMENT AU CHARGEMENT
  // ==================================================
  chargerTextesStatiques();
  chargerDonnees();
</script>
