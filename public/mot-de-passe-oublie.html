<!DOCTYPE html>
<html lang="fr" class="lang-fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>
    <span class="txt-fr">Mot de passe oublié — MAMA-ZOUMANA</span>
    <span class="txt-en">Forgot Password — MAMA-ZOUMANA</span>
    <span class="txt-ar">نسيت كلمة المرور — ماما زومانا</span>
  </title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    :root {
      --primaire: #0c4a6e;
      --accent: #f59e0b;
      --sombre: #0f172a;
      --bg-jour: #f8fafc;
      --texte-jour: #1e293b;
      --cadre-jour: rgba(255,255,255,0.95);
      --bord-jour: rgba(12,74,110,0.15);
    }

    /* ☀️ MODE JOUR */
    body.jour {
      background: linear-gradient(135deg, #e0f2fe, #f0f9ff);
    }
    body.jour .cadre-lumineux {
      background: var(--cadre-jour);
      box-shadow: 0 10px 40px rgba(12,74,110,0.15);
    }
    body.jour .cadre-lumineux::after {
      background: transparent;
    }
    body.jour .titre-form { color: var(--primaire); }
    body.jour .sous-titre { color: #475569; }
    body.jour .form-label { color: var(--texte-jour); }
    body.jour .form-control {
      background: white;
      border: 1px solid var(--bord-jour);
      color: var(--texte-jour);
    }
    body.jour .form-control:focus {
      background: #f0f9ff;
      border-color: var(--primaire);
      box-shadow: 0 0 0 0.25rem rgba(12,74,110,0.15);
    }
    body.jour .lien-retour { color: #64748b; }
    body.jour .lien-retour:hover { color: var(--primaire); }
    body.jour .barre-outils button {
      background: rgba(12,74,110,0.08);
      color: var(--primaire);
    }

    /* 🌙 MODE NUIT (par défaut) */
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, var(--sombre), #1e293b);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      transition: all 0.35s ease;
    }
    body.lang-ar {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      direction: rtl;
      text-align: right;
    }

    .cadre-lumineux {
      position: relative;
      background: rgba(15,23,42,0.9);
      border-radius: 20px;
      padding: 40px 30px;
      max-width: 480px;
      width: 100%;
      overflow: hidden;
      transition: all 0.35s ease;
    }
    .cadre-lumineux::before {
      content: '';
      position: absolute;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background: conic-gradient(transparent,#f59e0b,#fbbf24,#f59e0b,transparent 30%);
      animation: rotation-bord 3.5s linear infinite;
    }
    .cadre-lumineux::after {
      content: '';
      position: absolute;
      inset: 3px;
      background: rgba(15,23,42,0.98);
      border-radius: 18px;
      z-index: 1;
      transition: all 0.35s ease;
    }
    @keyframes rotation-bord {
      100% { transform: rotate(360deg); }
    }

    .contenu-form { position: relative; z-index: 2; }
    .titre-form {
      color: var(--accent);
      font-weight: 700;
      text-align: center;
      margin-bottom: 15px;
      transition: color 0.35s ease;
    }
    .sous-titre {
      color: #cbd5e1;
      text-align: center;
      margin-bottom: 30px;
      font-size: 0.95rem;
      transition: color 0.35s ease;
    }

    .form-label {
      color: #e2e8f0;
      font-weight: 500;
      transition: color 0.35s ease;
    }
    .form-control {
      background: rgba(30,41,59,0.7);
      border: 1px solid rgba(245,158,11,0.25);
      color: white;
      border-radius: 10px;
      padding: 12px 14px;
      transition: all 0.35s ease;
    }
    .form-control:focus {
      background: rgba(30,41,59,0.9);
      border-color: var(--accent);
      box-shadow: 0 0 0 0.25rem rgba(245,158,11,0.25);
      color: white;
    }

    .btn-envoi {
      width: 100%;
      background: linear-gradient(135deg, var(--accent), #f97316);
      border: none;
      color: var(--sombre);
      font-weight: 700;
      padding: 12px;
      border-radius: 10px;
      margin-top: 10px;
      transition: transform 0.2s ease;
    }
    .btn-envoi:hover { transform: translateY(-2px); }

    .lien-retour {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #94a3b8;
      text-decoration: none;
      transition: color 0.35s ease;
    }
    .lien-retour:hover { color: var(--accent); }

    /* 🌐 TRILINGUE */
    .txt-en, .txt-ar { display: none; }
    body.lang-fr .txt-fr { display: inline; }
    body.lang-fr .txt-en, body.lang-fr .txt-ar { display: none; }
    body.lang-en .txt-en { display: inline; }
    body.lang-en .txt-fr, body.lang-en .txt-ar { display: none; }
    body.lang-ar .txt-ar { display: inline; }
    body.lang-ar .txt-fr, body.lang-ar .txt-en { display: none; }

    .barre-outils {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .barre-langue { display: flex; gap: 4px; }
    .btn-langue, .btn-theme {
      background: rgba(255,255,255,0.1);
      color: white;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 20px;
      padding: 5px 12px;
      transition: all 0.35s ease;
    }
    .btn-langue.actif, .btn-theme.actif {
      background: var(--accent);
      color: var(--sombre);
      border-color: var(--accent);
    }
    .btn-theme { font-size: 1.1rem; padding: 4px 10px; }
  </style>
</head>
<body class="lang-fr nuit">


<div class="cadre-lumineux">
  <div class="contenu-form">

    <!-- 🛠️ BARRE OUTILS : LANGUE + JOUR/NUIT -->
    <div class="barre-outils">
      <div class="barre-langue">
        <button class="btn-langue actif" data-lang="fr">FR</button>
        <button class="btn-langue" data-lang="en">EN</button>
        <button class="btn-langue" data-lang="ar">AR</button>
      </div>
      <button class="btn-theme" id="btnJourNuit" title="Mode Jour/Nuit">🌙</button>
    </div>

    <h2 class="titre-form">
      <span class="txt-fr">🔑 Mot de passe oublié</span>
      <span class="txt-en">🔑 Forgot Your Password</span>
      <span class="txt-ar">🔑 نسيت كلمة المرور</span>
    </h2>
    <p class="sous-titre">
      <span class="txt-fr">Saisissez votre email, nous vous enverrons un lien de réinitialisation</span>
      <span class="txt-en">Enter your email, we will send you a reset link</span>
      <span class="txt-ar">أدخل بريدك الإلكتروني، وسنرسل لك رابط إعادة التعيين</span>
    </p>

    <form id="formMdpOublie">
      <div class="mb-4">
        <label class="form-label">
          <span class="txt-fr">Adresse email</span>
          <span class="txt-en">Email Address</span>
          <span class="txt-ar">البريد الإلكتروني</span>
        </label>
        <input type="email" id="email" class="form-control" placeholder="votre@email.com" required>
      </div>
      <button type="submit" class="btn-envoi">
        <span class="txt-fr">📧 Envoyer le lien</span>
        <span class="txt-en">📧 Send the Link</span>
        <span class="txt-ar">📧 إرسال الرابط</span>
      </button>
    </form>

    <a href="connexion.html" class="lien-retour">
      ←
      <span class="txt-fr">Retour à la connexion</span>
      <span class="txt-en">Back to Login</span>
      <span class="txt-ar">العودة إلى تسجيل الدخول</span>
    </a>
  </div>
</div>

<script>
const API_URL = 'https://mama-zoumana-api.onrender.com/api';

// ☀️🌙 MODE JOUR / NUIT — HARMONISÉ ✅
const body = document.body;
const btnJourNuit = document.getElementById('btnJourNuit');

function basculerMode(mode) {
  localStorage.setItem('theme', mode);
  if (mode === 'jour') {
    body.classList.add('jour'); body.classList.remove('nuit');
    btnJourNuit.textContent = '☀️'; btnJourNuit.classList.add('actif');
  } else {
    body.classList.remove('jour'); body.classList.add('nuit');
    btnJourNuit.textContent = '🌙'; btnJourNuit.classList.remove('actif');
  }
}

btnJourNuit.addEventListener('click', () => {
  basculerMode(body.classList.contains('nuit') ? 'jour' : 'nuit');
});

// 🗣️ GESTION DE LA LANGUE ✅
function appliquerLangue(lang) {
  localStorage.setItem('langue', lang);
  document.body.classList.remove('lang-fr','lang-en','lang-ar');
  document.body.classList.add('lang-' + lang);
  document.querySelectorAll('.btn-langue').forEach(b => b.classList.remove('actif'));
  document.querySelector(`.btn-langue[data-lang="${lang}"]`)?.classList.add('actif');
}

document.querySelectorAll('.btn-langue').forEach(btn => {
  btn.addEventListener('click', () => appliquerLangue(btn.dataset.lang));
});

// ✅ Restaurer langue et thème au chargement
window.addEventListener('DOMContentLoaded', () => {
  appliquerLangue(localStorage.getItem('langue') || 'fr');
  basculerMode(localStorage.getItem('theme') || 'nuit');
});

// 📤 SOUMISSION DU FORMULAIRE ✅
document.getElementById('formMdpOublie').addEventListener('submit', async e => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();

  const messages = {
    fr: {
      lienEnvoye: "✅ Un lien vous a été envoyé par email !\n(Vérifiez vos spams si vous ne le trouvez pas)",
      erreurEmail: "❌ Email introuvable",
      erreurServeur: "❌ Erreur serveur — réessayez plus tard"
    },
    en: {
      lienEnvoye: "✅ A link has been sent to your email!\n(Check your spam folder if not found)",
      erreurEmail: "❌ Email not found",
      erreurServeur: "❌ Server error — try again later"
    },
    ar: {
      lienEnvoye: "✅ تم إرسال رابط إلى بريدك الإلكتروني!\n(تحقق من البريد المزعج إذا لم تجده)",
      erreurEmail: "❌ البريد غير مسجل",
      erreurServeur: "❌ خطأ في الخادم — حاول مرة أخرى لاحقاً"
    }
  };
  const lang = localStorage.getItem('langue') || 'fr';
  const msg = messages[lang];

  try {
    const res = await fetch(`${API_URL}/auth/mot-de-passe-oublie`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email })
    });
    const data = await res.json();
    if(data.ok){
      alert(msg.lienEnvoye);
      location.href = 'connexion.html';
    }else{
      alert("❌ " + (data.erreur || msg.erreurEmail));
    }
  } catch (err) {
    alert(msg.erreurServeur);
  }
});
</script>

</body>
</html>
