<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>
    <span class="lang-fr">Contacter les Parents</span>
    <span class="lang-en">Contact Parents</span>
    <span class="lang-ar">التواصل مع أولياء الأمور</span>
  </title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    :root {
      --sombre: #0f172a;
      --sombre-clair: #1e293b;
      --bord-orange: #f59e0b;
      --vert: #10b981;
      --bleu: #3b82f6;
      --texte: #f8fafc;
    }
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:var(--sombre);color:var(--texte);min-height:100vh;font-family:'Segoe UI',sans-serif;}
    .entete-page{background:var(--sombre-clair);border-bottom:2px solid var(--bord-orange);padding:1.2rem 0}
    .carte{background:var(--sombre-clair);border-radius:12px;border-left:3px solid var(--bord-orange);padding:1.5rem;}
    .form-control,.form-select{background:#0f172a;border:1px solid #334155;color:white;border-radius:8px}
    .form-control:focus,.form-select:focus{background:#0f172a;border-color:var(--bord-orange);color:white;box-shadow:0 0 0 0.25rem rgba(245,158,11,0.25)}
    .btn-valide{background:var(--vert);color:white;border-radius:8px;border:none;}
    .btn-langue.active{background:var(--bord-orange);color:#000;border-color:var(--bord-orange);font-weight:bold;}

    .lang-en, .lang-ar { display: none; }
    body.lang-fr .lang-fr { display: inline; }
    body.lang-en { direction: ltr; }
    body.lang-en .lang-fr, body.lang-en .lang-ar { display: none; }
    body.lang-en .lang-en { display: inline; }
    body.lang-ar { direction: rtl; }
    body.lang-ar .lang-fr, body.lang-ar .lang-en { display: none; }
    body.lang-ar .lang-ar { display: inline; }
  </style>
</head>
<body class="lang-fr">

<script>
const token = localStorage.getItem('token');
const role = localStorage.getItem('role');
if(!token || role !== 'prof'){
  alert("⛔ Accès réservé aux enseignants");
  localStorage.clear();
  location.href = 'connexion.html';
}
</script>

<div class="entete-page">
  <div class="container d-flex justify-content-between align-items-center">
    <div>
      <h3 class="mb-1">
        <span class="lang-fr">📧 Contacter les Parents</span>
        <span class="lang-en">📧 Contact Parents</span>
        <span class="lang-ar">📧 التواصل مع أولياء الأمور</span>
      </h3>
      <p class="mb-0 opacity-75">
        <span class="lang-fr">Envoyer un message aux parents d'élèves</span>
        <span class="lang-en">Send message to parents</span>
        <span class="lang-ar">إرسال رسالة إلى أولياء الأمور</span>
      </p>
    </div>
    <div class="d-flex align-items-center gap-2">
      <button class="btn btn-sm btn-outline-light btn-langue active" onclick="changerLangue('fr')" id="btn-fr">FR</button>
      <button class="btn btn-sm btn-outline-light btn-langue" onclick="changerLangue('en')" id="btn-en">EN</button>
      <button class="btn btn-sm btn-outline-light btn-langue" onclick="changerLangue('ar')" id="btn-ar">AR</button>
      <a href="dashboard.html" class="btn btn-outline-light ms-2">
        <i class="bi bi-arrow-left"></i>
        <span class="lang-fr"> Retour</span>
        <span class="lang-en"> Back</span>
        <span class="lang-ar"> عودة</span>
      </a>
    </div>
  </div>
</div>

<div class="container py-4">
  <div class="carte mb-4">
    <div class="row g-3 mb-3">
      <div class="col-md-6">
        <label class="form-label fw-bold">
          <span class="lang-fr">🏫 Classe</span>
          <span class="lang-en">🏫 Class</span>
          <span class="lang-ar">🏫 الفصل</span>
        </label>
        <select id="classe" class="form-select" onchange="chargerEleves()">
          <option value="">-- Chargement... --</option>
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label fw-bold">
          <span class="lang-fr">👤 Élève</span>
          <span class="lang-en">👤 Student</span>
          <span class="lang-ar">👤 التلميذ</span>
        </label>
        <select id="eleve" class="form-select">
          <option value="">-- Sélectionner d'abord la Classe --</option>
        </select>
      </div>
    </div>
    <div class="mb-3">
      <label class="form-label fw-bold">
        <span class="lang-fr">📌 Sujet</span>
        <span class="lang-en">📌 Subject</span>
        <span class="lang-ar">📌 الموضوع</span>
      </label>
      <input type="text" id="sujet" class="form-control" placeholder="Ex: Absence, Retard, Note importante...">
    </div>
    <div class="mb-4">
      <label class="form-label fw-bold">
        <span class="lang-fr">✉️ Message</span>
        <span class="lang-en">✉️ Message</span>
        <span class="lang-ar">✉️ الرسالة</span>
      </label>
      <textarea id="message" class="form-control" rows="5" placeholder="Saisis ton message..."></textarea>
    </div>
    <button class="btn btn-valide w-100 fw-bold" onclick="envoyerMessage()">
      <i class="bi bi-send me-2"></i>
      <span class="lang-fr">Envoyer le Message</span>
      <span class="lang-en">Send Message</span>
      <span class="lang-ar">إرسال الرسالة</span>
    </button>
  </div>
</div>

<script>
let eleves = [];

async function chargerClasses(){
  try {
    const r = await fetch('/api/notes/mes-classes-matieres', {headers:{'Authorization':`Bearer ${token}`}});
    const res = await r.json();
    if(res.ok){
      const classes = res.classes || res.lignes || [];
      document.getElementById('classe').innerHTML = '<option value="">-- Sélectionner --</option>' +
        classes.map(c=>`<option value="${c.id_classe}">${c.libelle_classe}</option>`).join('');
    }
  } catch(e) { console.log("Erreur :", e); }
}

async function chargerEleves(){
  const id_classe = document.getElementById('classe').value;
  if(!id_classe) return;
  try {
    const r = await fetch(`/api/notes/eleves-classe/${id_classe}`, {headers:{'Authorization':`Bearer ${token}`}});
    const res = await r.json();
    if(res.ok){
      eleves = res.eleves || res.lignes || [];
      document.getElementById('eleve').innerHTML = '<option value="">-- Tous les parents --</option>' +
        eleves.map(e=>`<option value="${e.id_utilisateur || e.id_eleve}">${e.nom} ${e.prenoms || e.prenom}</option>`).join('');
    }
  } catch(e) { console.log("Erreur :", e); }
}

async function envoyerMessage(){
  const id_classe = document.getElementById('classe').value;
  const id_eleve = document.getElementById('eleve').value;
  const sujet = document.getElementById('sujet').value.trim();
  const message = document.getElementById('message').value.trim();

  if(!id_classe || !sujet || !message){
    alert("⚠️ Remplis Classe, Sujet et Message !"); return;
  }

  try {
    const r = await fetch('/api/messages/envoyer-parents', {
      method: 'POST',
      headers: {'Content-Type':'application/json','Authorization':`Bearer ${token}`},
      body: JSON.stringify({ id_classe, id_eleve, sujet, message })
    });
    const res = await r.json();
    if(res.ok){
      alert("✅ Message envoyé aux parents !");
      document.getElementById('sujet').value = '';
      document.getElementById('message').value = '';
    } else {
      alert("❌ " + (res.erreur || "Erreur"));
    }
  } catch(e) { alert("❌ Erreur Réseau : " + e.message); }
}

function changerLangue(langue) {
  document.body.className = 'lang-' + langue;
  localStorage.setItem('langue', langue);
  document.querySelectorAll('.btn-langue').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-'+langue).classList.add('active');
}

let langue = localStorage.getItem('langue') || 'fr';
document.body.className = 'lang-' + langue;
document.getElementById('btn-'+langue).classList.add('active');
chargerClasses();
</script>
</body>
</html>
