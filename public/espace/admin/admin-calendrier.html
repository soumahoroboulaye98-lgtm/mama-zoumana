<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>
    <span class="lang-fr">Administration — Calendrier Scolaire</span>
    <span class="lang-en">Administration — School Calendar</span>
    <span class="lang-ar">الإدارة — التقويم المدرسي</span>
  </title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    :root {
      --sombre: #0f172a; --sombre-clair: #1e293b;
      --bord-orange: #f59e0b; --vert: #10b981;
      --rouge: #ef4444; --bleu: #3b82f6;
      --texte: #f8fafc;
      --cours: #22c55e; --vacances: #f59e0b; --ferie: #ef4444;
    }
    *{margin:0;padding:0;box-sizing:border-box;transition:all 0.2s ease}
    body{background:var(--sombre);color:var(--texte);min-height:100vh;font-family:'Segoe UI',sans-serif;}
    .entete-page{background:var(--sombre-clair);border-bottom:2px solid var(--bord-orange);padding:1.2rem 0}
    .carte{background:var(--sombre-clair);border-radius:12px;padding:1.5rem;margin-bottom:1.5rem;border-left:4px solid}
    .carte.cours{border-color:var(--cours)}
    .carte.vacances{border-color:var(--vacances)}
    .carte.ferie{border-color:var(--ferie)}
    .form-control,.form-select{background:#0f172a;border:1px solid #334155;color:white;border-radius:8px}
    .form-control:focus,.form-select:focus{background:#0f172a;border-color:var(--bord-orange);color:white;box-shadow:0 0 0 0.25rem rgba(245,158,11,0.25)}
    .btn-valide{background:var(--vert);color:white;border-radius:8px;border:none;padding:0.5rem 1rem;}
    .btn-valide:hover{box-shadow:0 0 15px rgba(16,185,129,0.4);transform:translateY(-1px)}
    .btn-modif{background:var(--bord-orange);color:white;padding:6px 12px;font-size:14px;border-radius:6px;border:none;}
    .btn-modif:hover{background:#d97706;}
    .btn-suppr{background:var(--rouge);color:white;padding:6px 12px;font-size:14px;border-radius:6px;border:none;}
    .btn-suppr:hover{background:#dc2626;}
    .badge-cours{background:rgba(34,197,94,0.15);color:#86efac;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:600}
    .badge-vacances{background:rgba(245,158,11,0.15);color:#fcd34d;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:600}
    .badge-ferie{background:rgba(239,68,68,0.15);color:#fca5a5;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:600}
    .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);align-items:center;justify-content:center;z-index:1050}
    .modal.active{display:flex}
    .modal-contenu{background:var(--sombre-clair);padding:1.8rem;border-radius:12px;width:92%;max-width:600px;max-height:92vh;overflow-y:auto;border:1px solid #334155}
    .modal-contenu h2{color:var(--bord-orange);margin-bottom:1.2rem}
    .ligne{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .actions{display:flex;justify-content:flex-end;gap:10px;margin-top:1rem}
    .btn-fermer{background:#475569;color:white;border-radius:6px;border:none;padding:0.5rem 1rem;}
    .btn-enregistrer{background:var(--bleu);color:white;border-radius:6px;border:none;padding:0.5rem 1rem;}
    .btn-enregistrer:hover{background:#2563eb;color:white}
    .message{margin-top:1rem;padding:0.75rem;border-radius:6px;display:none}
    .message.succes{background:rgba(16,185,129,0.1);color:#34d399;display:block}
    .message.erreur{background:rgba(239,68,68,0.1);color:#fca5a5;display:block}
    .alerte-api{border-left:3px solid var(--rouge);background:rgba(239,68,68,0.1);border-radius:8px;padding:0.75rem 1rem;margin-bottom:1rem;}
    .btn-langue.active{background:var(--bord-orange);color:#000;border-color:var(--bord-orange);font-weight:bold;}
    .info-ligne{color:#cbd5e1;font-size:14px;margin:4px 0}
    .lang-en, .lang-ar { display: none; }
    body.lang-fr .lang-fr { display: inline; }
    body.lang-en { direction: ltr; }
    body.lang-en .lang-fr, body.lang-en .lang-ar { display: none; }
    body.lang-en .lang-en { display: inline; }
    body.lang-ar { direction: rtl; }
    body.lang-ar .lang-fr, body.lang-ar .lang-en { display: none; }
    body.lang-ar .lang-ar { display: inline; }
  </style>
</head>
<body class="lang-fr">

<!-- 🔗 CONFIGURATION API & SÉCURITÉ -->
<script>
  const API_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
    ? 'http://localhost:5000/api/calendrier'
    : 'https://mama-zoumana-api.onrender.com/api/calendrier';
  const token = localStorage.getItem('token');
  const role = (localStorage.getItem('role') || '').trim();
  let langue = localStorage.getItem('langue') || 'fr';
  let modeLocal = false;

  // 💾 STOCKAGE LOCAL
  function obtenirPeriodesLocales() { return JSON.parse(localStorage.getItem('calendrier_periodes') || '[]'); }
  function sauvegarderPeriodesLocales(liste) { localStorage.setItem('calendrier_periodes', JSON.stringify(liste)); }

  // 🗣️ TRADUCTIONS — TOUJOURS EN PREMIER
  const MSG = {
    fr: {
      accesReserve: "⛔ Accès réservé à l'Administrateur",
      serveurIndispo: "⚠️ Serveur indisponible — Mode local actif",
      compteur: "période(s)",
      ajouterTitre: "Ajouter une période",
      modifierTitre: "Modifier une période",
      nomPeriode: "Nom de la période *",
      dateDebut: "Date de début *",
      dateFin: "Date de fin *",
      typePeriode: "Type de période *",
      choisirType: "— Choisir le type —",
      cours: "🟢 Cours",
      vacances: "🟠 Vacances",
      ferie: "🔴 Jour férié",
      anneeScolaire: "Année scolaire",
      descFR: "Description (FR)",
      descEN: "Description (EN)",
      descAR: "Description (AR)",
      du: "Du", au: "au", annuler: "Annuler", enregistrer: "Enregistrer",
      ajouterOk: "✅ Période ajoutée !",
      modifierOk: "✅ Période modifiée !",
      confirmerSuppr: "Confirmer la suppression ?",
      supprOk: "✅ Période supprimée !",
      ajouterBtn: "➕ Ajouter une période",
      modifierBtn: "✏️ Modifier",
      supprimerBtn: "🗑️ Supprimer",
      retour: "Retour",
      aucunePeriode: "Aucune période enregistrée",
      erreurToken: "⛔ Session expirée. Veuillez vous reconnecter."
    },
    en: {
      accesReserve: "⛔ Access restricted to Administrator",
      serveurIndispo: "⚠️ Server offline — Local mode active",
      compteur: "period(s)",
      ajouterTitre: "Add a period",
      modifierTitre: "Edit period",
      nomPeriode: "Period name *",
      dateDebut: "Start date *",
      dateFin: "End date *",
      typePeriode: "Period type *",
      choisirType: "— Choose type —",
      cours: "🟢 Classes", vacances: "🟠 Holidays", ferie: "🔴 Public holiday",
      anneeScolaire: "School year",
      descFR: "Description (FR)", descEN: "Description (EN)", descAR: "Description (AR)",
      du: "From", au: "to", annuler: "Cancel", enregistrer: "Save",
      ajouterOk: "✅ Period added!", modifierOk: "✅ Period updated!",
      confirmerSuppr: "Confirm deletion?", supprOk: "✅ Period deleted!",
      ajouterBtn: "➕ Add period", modifierBtn: "✏️ Edit", supprimerBtn: "🗑️ Delete",
      retour: "Back", aucunePeriode: "No period registered",
      erreurToken: "⛔ Session expired. Please log in again."
    },
    ar: {
      accesReserve: "⛔ الوصول مقصور على المدير",
      serveurIndispo: "⚠️ الخادم غير متاح — العمل محلي",
      compteur: "فترة",
      ajouterTitre: "إضافة فترة", modifierTitre: "تعديل الفترة",
      nomPeriode: "اسم الفترة *", dateDebut: "تاريخ البدء *", dateFin: "تاريخ الانتهاء *",
      typePeriode: "نوع الفترة *", choisirType: "— اختر النوع —",
      cours: "🟢 دراسة", vacances: "🟠 عطلة", ferie: "🔴 عطلة رسمية",
      anneeScolaire: "السنة الدراسية",
      descFR: "الوصف (فرنسي)", descEN: "الوصف (إنجليزي)", descAR: "الوصف (عربي)",
      du: "من", au: "إلى", annuler: "إلغاء", enregistrer: "حفظ",
      ajouterOk: "✅ تمت إضافة الفترة!", modifierOk: "✅ تم تعديل الفترة!",
      confirmerSuppr: "تأكيد الحذف؟", supprOk: "✅ تم حذف الفترة!",
      ajouterBtn: "➕ إضافة فترة", modifierBtn: "✏️ تعديل", supprimerBtn: "🗑️ حذف",
      retour: "عودة", aucunePeriode: "لا توجد فترات مسجلة",
      erreurToken: "⛔ انتهت الجلسة. الرجاء تسجيل الدخول مرة أخرى."
    }
  };
  function m(cle) { return MSG[langue]?.[cle] || MSG.fr[cle]; }

  // 🔒 SÉCURITÉ — Vérifie token ET rôle
  if(!token || !['admin','Admin','super_admin'].includes(role)){
    alert(!token ? m('erreurToken') : m('accesReserve'));
    localStorage.clear();
    location.href = 'connexion.html';
  }

  // Appliquer la langue au plus tôt
  document.body.classList.remove('lang-fr','lang-en','lang-ar');
  document.body.classList.add('lang-' + langue);
</script>

<!-- 📌 EN-TÊTE -->
<div class="entete-page">
  <div class="container d-flex justify-content-between align-items-center">
    <div>
      <h3 class="mb-1">
        <i class="bi bi-calendar-event me-2" style="color:var(--bord-orange)"></i>
        <span class="lang-fr">Gestion du Calendrier Scolaire</span>
        <span class="lang-en">School Calendar Management</span>
        <span class="lang-ar">إدارة التقويم المدرسي</span>
      </h3>
      <p class="mb-0 opacity-75 small">
        <span class="lang-fr">Définir les périodes de cours, vacances et jours fériés</span>
        <span class="lang-en">Define class periods, holidays and public holidays</span>
        <span class="lang-ar">تحديد فترات الدراسة والعطل والعطل الرسمية</span>
      </p>
    </div>
    <div class="d-flex align-items-center gap-2">
      <button class="btn btn-sm btn-outline-light btn-langue" onclick="changerLangue('fr')" id="btn-fr">FR</button>
      <button class="btn btn-sm btn-outline-light btn-langue" onclick="changerLangue('en')" id="btn-en">EN</button>
      <button class="btn btn-sm btn-outline-light btn-langue" onclick="changerLangue('ar')" id="btn-ar">AR</button>
      <a href="dashboard.html" class="btn btn-outline-light btn-sm ms-2">
        <i class="bi bi-arrow-left"></i>
        <span class="lang-fr"> Retour</span>
        <span class="lang-en"> Back</span>
        <span class="lang-ar"> عودة</span>
      </a>
    </div>
  </div>
</div>

<div class="container py-4">
  <!-- ⚠️ ALERTE MODE LOCAL -->
  <div id="alerteApi" class="alerte-api d-none">
    <i class="bi bi-wifi-off me-2"></i>
    <span id="texteAlerteApi"></span>
  </div>

  <!-- BARRE D'ACTION -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <p class="mb-0 fw-bold"><span id="compteur">0</span> <span class="lang-fr">période(s)</span><span class="lang-en">period(s)</span><span class="lang-ar">فترة</span></p>
    <button class="btn btn-valide" onclick="ouvrirFormulaire()">
      <i class="bi bi-plus-lg"></i>
      <span class="lang-fr"> Ajouter une période</span>
      <span class="lang-en"> Add period</span>
      <span class="lang-ar"> إضافة فترة</span>
    </button>
  </div>

  <!-- 📋 LISTE DES PÉRIODES -->
  <div id="liste"></div>
</div>

<!-- 📝 MODAL FORMULAIRE -->
<div class="modal" id="formModal">
  <div class="modal-contenu">
    <h2 id="titreForm">...</h2>
    <form id="formPeriode">
      <input type="hidden" id="id">
      <input type="text" id="periode" class="form-control" placeholder="Nom de la période *" required>
      <div class="ligne">
        <input type="date" id="date_debut" class="form-control" required>
        <input type="date" id="date_fin" class="form-control" required>
      </div>
      <select id="type_periode" class="form-select" required>
        <option value="">— Type —</option>
        <option value="Cours">🟢 Cours</option>
        <option value="Vacances">🟠 Vacances</option>
        <option value="Jour férié">🔴 Jour férié</option>
      </select>
      <input type="text" id="annee_scolaire" class="form-control" placeholder="Année scolaire" value="2026-2027">
      <textarea id="description_fr" class="form-control" rows="3" placeholder="Description (FR)"></textarea>
      <textarea id="description_en" class="form-control" rows="2" placeholder="Description (EN)"></textarea>
      <textarea id="description_ar" class="form-control" rows="2" placeholder="Description (AR)"></textarea>
      <div class="actions">
        <button type="button" class="btn-fermer" onclick="fermerFormulaire()">
          <span class="lang-fr">Annuler</span>
          <span class="lang-en">Cancel</span>
          <span class="lang-ar">إلغاء</span>
        </button>
        <button type="submit" class="btn-enregistrer">
          <span class="lang-fr">Enregistrer</span>
          <span class="lang-en">Save</span>
          <span class="lang-ar">حفظ</span>
        </button>
      </div>
      <div class="message" id="message"></div>
    </form>
  </div>
</div>

<script>
let listeCalendrier = [];

// 📡 ALERTE MODE LOCAL
function basculerModeLocal(actif) {
  modeLocal = actif;
  const alerte = document.getElementById('alerteApi');
  document.getElementById('texteAlerteApi').textContent = m('serveurIndispo');
  alerte.classList.toggle('d-none', !actif);
}

// 🗣️ CHANGEMENT DE LANGUE
function changerLangue(nouvelleLangue) {
  langue = nouvelleLangue;
  localStorage.setItem('langue', langue);
  document.body.classList.remove('lang-fr','lang-en','lang-ar');
  document.body.classList.add('lang-' + langue);
  document.querySelectorAll('.btn-langue').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + langue)?.classList.add('active');
  afficherListe();
}

// 🎨 Classe CSS selon le type
function classeType(t) {
  if (t === 'Cours') return 'cours';
  if (t === 'Vacances') return 'vacances';
  return 'ferie';
}
function badgeType(t) {
  if (t === 'Cours') return 'badge-cours';
  if (t === 'Vacances') return 'badge-vacances';
  return 'badge-ferie';
}

// 📅 Formatage de la date
function formatDate(d) {
  return new Date(d).toLocaleDateString(langue === 'ar' ? 'ar-MA' : 'fr-FR', { day:'2-digit', month:'long', year:'numeric' });
}

// 📋 CHARGER LA LISTE
async function chargerListe(forcerLocal = false) {
  let liste = [];
  if (!forcerLocal) {
    try {
      const res = await fetch(`${API_URL}/liste`, { headers:{'Authorization':`Bearer ${token}`} });
      if (res.status === 401) throw new Error('401'); // Token expiré → déconnexion
      if (!res.ok) throw new Error();
      const data = await res.json();
      liste = data.calendrier || data || [];
      sauvegarderPeriodesLocales(liste);
      basculerModeLocal(false);
    } catch (err) {
      if (err.message === '401') {
        alert(m('erreurToken'));
        localStorage.clear();
        location.href = 'connexion.html';
        return;
      }
      forcerLocal = true;
    }
  }
  if (forcerLocal) {
    basculerModeLocal(true);
    liste = obtenirPeriodesLocales();
  }
  listeCalendrier = liste;
  document.getElementById('compteur').textContent = liste.length;
  afficherListe();
}

// 🖥️ AFFICHER LA LISTE
function afficherListe() {
  const conteneur = document.getElementById('liste');
  if (!listeCalendrier.length) {
    conteneur.innerHTML = `<div class="carte text-center py-4 text-muted">${m('aucunePeriode')}</div>`;
    return;
  }
  conteneur.innerHTML = '';
  listeCalendrier.sort((a,b) => new Date(a.date_debut) - new Date(b.date_debut)).forEach(p => {
    const classe = classeType(p.type_periode);
    const badge = badgeType(p.type_periode);
    conteneur.innerHTML += `
      <div class="carte ${classe}">
        <h5 class="fw-bold mb-2">${p.periode} <span class="${badge}">${p.type_periode}</span></h5>
        <div class="info-ligne">📅 ${m('du')} ${formatDate(p.date_debut)} ${m('au')} ${formatDate(p.date_fin)} — ${p.annee_scolaire || ''}</div>
        ${p.description_fr ? `<div class="info-ligne mt-2">${p.description_fr}</div>` : ''}
        <div class="mt-3">
          <button class="btn-modif" onclick="modifier(${p.id})">✏️ ${m('modifierBtn')}</button>
          <button class="btn-suppr" onclick="supprimer(${p.id})">🗑️ ${m('supprimerBtn')}</button>
        </div>
      </div>`;
  });
}

// 📝 OUVRIR FORMULAIRE
function ouvrirFormulaire() {
  document.getElementById('formPeriode').reset();
  document.getElementById('id').value = '';
  document.getElementById('titreForm').textContent = m('ajouterTitre');
  document.getElementById('annee_scolaire').value = '2026-2027';
  document.getElementById('formModal').classList.add('active');
}

// ✏️ MODIFIER PÉRIODE
function modifier(id) {
  const p = listeCalendrier.find(x => Number(x.id) === Number(id));
  if(!p) return;
  ['id','periode','date_debut','date_fin','type_periode','annee_scolaire','description_fr','description_en','description_ar'].forEach(k => {
    const el = document.getElementById(k);
    if(el) el.value = p[k] || '';
  });
  document.getElementById('titreForm').textContent = m('modifierTitre');
  document.getElementById('formModal').classList.add('active');
}

// ❌ FERMER FORMULAIRE
function fermerFormulaire() {
  document.getElementById('formModal').classList.remove('active');
  document.getElementById('message').className = 'message';
  document.getElementById('message').textContent = '';
}

// 💾 ENREGISTRER PÉRIODE
document.getElementById('formPeriode').addEventListener('submit', async e => {
  e.preventDefault();
  const id = document.getElementById('id').value;
  const donnees = {
    periode: document.getElementById('periode').value,
    date_debut: document.getElementById('date_debut').value,
    date_fin: document.getElementById('date_fin').value,
    type_periode: document.getElementById('type_periode').value,
    annee_scolaire: document.getElementById('annee_scolaire').value,
    description_fr: document.getElementById('description_fr').value,
    description_en: document.getElementById('description_en').value,
    description_ar: document.getElementById('description_ar').value
  };
  const msg = document.getElementById('message');
  try {
    const url = id ? `${API_URL}/${id}` : `${API_URL}/ajouter`;
    const methode = id ? 'PUT' : 'POST';
    const res = await fetch(url, {
      method: methode,
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
      body: JSON.stringify(donnees)
    });
    if (res.status === 401) throw new Error('401');
    const rep = await res.json();
    if (rep.ok) {
      msg.className = 'message succes';
      msg.textContent = id ? m('modifierOk') : m('ajouterOk');
      await chargerListe();
      setTimeout(fermerFormulaire, 1200);
    } else {
      throw new Error(rep.erreur || 'Erreur serveur');
    }
  } catch (err) {
    // 🚪 Token expiré
    if (err.message === '401') {
      alert(m('erreurToken'));
      localStorage.clear();
      location.href = 'connexion.html';
      return;
    }
    // 📴 Mode local
    let liste = obtenirPeriodesLocales();
    donnees.id = id ? Number(id) : Date.now();
    if (id) {
      liste = liste.map(p => Number(p.id) === Number(id) ? {...p, ...donnees} : p);
    } else {
      liste.push(donnees);
    }
    sauvegarderPeriodesLocales(liste);
    listeCalendrier = liste;
    basculerModeLocal(true);
    msg.className = 'message succes';
    msg.textContent = (id ? m('modifierOk') : m('ajouterOk')) + " (mode local)";
    afficherListe();
    setTimeout(fermerFormulaire, 1200);
  }
});

// 🗑️ SUPPRIMER PÉRIODE
async function supprimer(id) {
  if (!confirm(m('confirmerSuppr'))) return;
  try {
    const res = await fetch(`${API_URL}/${id}`, { method: 'DELETE', headers:{'Authorization':`Bearer ${token}`} });
    if (res.status === 401) throw new Error('401');
    const rep = await res.json();
    if (rep.ok) {
      await chargerListe();
      alert(m('supprOk'));
    } else {
      throw new Error(rep.erreur);
    }
  } catch (err) {
    if (err.message === '401') {
      alert(m('erreurToken'));
      localStorage.clear();
      location.href = 'connexion.html';
      return;
    }
    // 📴 Mode local
    let liste = obtenirPeriodesLocales().filter(p => Number(p.id) !== Number(id));
    sauvegarderPeriodesLocales(liste);
    listeCalendrier = liste;
    basculerModeLocal(true);
    afficherListe();
    alert(m('supprOk') + " (mode local)");
  }
}

// 🚀 INITIALISATION
window.onload = async function() {
  document.querySelectorAll('.btn-langue').forEach(b => b.classList.toggle('active', b.id === 'btn-' + langue));
  await chargerListe();
};
</script>
</body>
</html>
