<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Changer mon mot de passe — MAMA-ZOUMANA</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    :root { --accent: #f59e0b; --sombre: #0f172a; }
    *{margin:0;padding:0;box-sizing:border-box}
    body{min-height:100vh;background:linear-gradient(135deg,var(--sombre),#1e293b);display:flex;align-items:center;justify-content:center;padding:20px}
    .cadre{position:relative;background:rgba(15,23,42,0.9);border-radius:20px;padding:40px 30px;max-width:480px;width:100%}
    .cadre::before{content:'';position:absolute;inset:-3px;border-radius:22px;background:conic-gradient(transparent,#f59e0b,#fbbf24,#f59e0b,transparent 30%);animation:tourne 3.5s linear infinite;z-index:-1}
    @keyframes tourne{100%{transform:rotate(360deg)}}
    .cadre h2{color:var(--accent);text-align:center;margin-bottom:10px}
    .cadre p{color:#cbd5e1;text-align:center;margin-bottom:25px}
    .form-control{background:rgba(30,41,59,0.7);border:1px solid rgba(245,158,11,0.25);color:white;border-radius:10px;padding:12px}
    .form-control:focus{background:rgba(30,41,59,0.9);border-color:var(--accent);box-shadow:0 0 0 0.25rem rgba(245,158,11,0.25);color:white}
    .btn{background:linear-gradient(135deg,#f59e0b,#f97316);border:none;color:#000;font-weight:700;padding:12px;border-radius:10px;width:100%}
    .btn-retour{background:transparent;border:1px solid #64748b;color:#94a3b8;margin-top:10px}
    .btn-retour:hover{border-color:#cbd5e1;color:#e2e8f0}
    .indicateur{height:4px;border-radius:2px;margin-top:5px}
    .faible{background:#ef4444;width:30%}
    .moyen{background:#f59e0b;width:60%}
    .fort{background:#22c55e;width:100%}
  </style>
</head>
<body>

<script>
// 🔒 Vérifie que l'utilisateur est bien connecté
if(!localStorage.getItem('token') || !localStorage.getItem('id_utilisateur')){
  alert("⛔ Connectez-vous d'abord !");
  location.href = 'connexion.html';
}
</script>

<div class="cadre">
  <h2>🔐 Changer mon mot de passe</h2>
  <p>Saisissez votre ancien mot de passe, puis choisissez-en un nouveau</p>

  <form id="form">
    <div class="mb-3">
      <label class="form-label text-light">🔑 Mot de passe actuel</label>
      <input type="password" id="ancienMdp" class="form-control" required>
    </div>

    <div class="mb-3">
      <label class="form-label text-light">🆕 Nouveau mot de passe</label>
      <input type="password" id="nouveauMdp" class="form-control" oninput="verifierForce()" required>
      <div id="indicateurForce" class="indicateur"></div>
      <small id="texteForce" class="text-muted">Au moins 6 caractères</small>
    </div>

    <div class="mb-4">
      <label class="form-label text-light">✅ Confirmer le nouveau mot de passe</label>
      <input type="password" id="confirmerMdp" class="form-control" required>
    </div>

    <button type="submit" class="btn">💾 Enregistrer le nouveau mot de passe</button>
    <button type="button" class="btn btn-retour" onclick="history.back()">← Retour sans changer</button>
  </form>
</div>

<script>
// 📊 Indique la force du mot de passe
function verifierForce(){
  const mdp = document.getElementById('nouveauMdp').value;
  const indicateur = document.getElementById('indicateurForce');
  const texte = document.getElementById('texteForce');
  
  if(mdp.length < 6){
    indicateur.className = 'indicateur faible';
    texte.textContent = "❌ Trop court (6 caractères minimum)";
    texte.style.color = '#ef4444';
  } else if(mdp.length < 10){
    indicateur.className = 'indicateur moyen';
    texte.textContent = "⚠️ Moyen — ajoutez des caractères";
    texte.style.color = '#f59e0b';
  } else {
    indicateur.className = 'indicateur fort';
    texte.textContent = "✅ Mot de passe sécurisé !";
    texte.style.color = '#22c55e';
  }
}

// ✉️ Soumission du formulaire
document.getElementById('form').addEventListener('submit', async e => {
  e.preventDefault();
  
  const ancienMdp = document.getElementById('ancienMdp').value.trim();
  const nouveauMdp = document.getElementById('nouveauMdp').value.trim();
  const confirmerMdp = document.getElementById('confirmerMdp').value.trim();
  const idUser = localStorage.getItem('id_utilisateur');

  // ✅ Vérifications
  if(nouveauMdp.length < 6){
    alert("⚠️ Le nouveau mot de passe doit faire au moins 6 caractères !");
    return;
  }
  if(nouveauMdp !== confirmerMdp){
    alert("❌ Les nouveaux mots de passe ne correspondent pas !");
    return;
  }

  try {
    const res = await fetch('/api/auth/changer-mot-de-passe', {
      method: 'POST',
      headers: { 
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${localStorage.getItem('token')}`
      },
      body: JSON.stringify({ 
        id_utilisateur: idUser,
        ancien_mot_de_passe: ancienMdp, 
        nouveau_mot_de_passe: nouveauMdp 
      })
    });

    const data = await res.json();

    if(data.ok){
      alert("✅ Mot de passe changé avec succès !\n\nVous pouvez maintenant vous connecter avec votre nouveau mot de passe.");
      // Déconnecte pour forfer une nouvelle connexion
      localStorage.removeItem('token');
      localStorage.removeItem('id_utilisateur');
      localStorage.removeItem('role');
      location.href = 'connexion.html';
    }else{
      alert("❌ " + (data.erreur || "Erreur lors du changement"));
    }
  } catch (err) {
    alert("❌ Erreur serveur — vérifiez la connexion");
  }
});
</script>
</body>
</html>
