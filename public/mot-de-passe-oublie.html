<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mot de passe oublié — MAMA-ZOUMANA</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    :root {
      --primaire: #0c4a6e;
      --accent: #f59e0b;
      --sombre: #0f172a;
    }
    *{margin:0;padding:0;box-sizing:border-box}
    body{min-height:100vh;background:linear-gradient(135deg,var(--sombre),#1e293b);display:flex;align-items:center;justify-content:center;padding:20px}

    .cadre-lumineux{position:relative;background:rgba(15,23,42,0.9);border-radius:20px;padding:40px 30px;max-width:480px;width:100%;overflow:hidden}
    .cadre-lumineux::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:conic-gradient(transparent,#f59e0b,#fbbf24,#f59e0b,transparent 30%);animation:rotation-bord 3.5s linear infinite}
    .cadre-lumineux::after{content:'';position:absolute;inset:3px;background:rgba(15,23,42,0.98);border-radius:18px;z-index:1}
    @keyframes rotation-bord{100%{transform:rotate(360deg)}}

    .contenu-form{position:relative;z-index:2}
    .titre-form{color:var(--accent);font-weight:700;text-align:center;margin-bottom:15px}
    .sous-titre{color:#cbd5e1;text-align:center;margin-bottom:30px;font-size:0.95rem}

    .form-label{color:#e2e8f0;font-weight:500}
    .form-control{background:rgba(30,41,59,0.7);border:1px solid rgba(245,158,11,0.25);color:white;border-radius:10px;padding:12px 14px}
    .form-control:focus{background:rgba(30,41,59,0.9);border-color:var(--accent);box-shadow:0 0 0 0.25rem rgba(245,158,11,0.25);color:white}

    .btn-envoi{width:100%;background:linear-gradient(135deg,var(--accent),#f97316);border:none;color:var(--sombre);font-weight:700;padding:12px;border-radius:10px;margin-top:10px}
    .btn-envoi:hover{transform:translateY(-2px);transition:transform 0.2s}
    .lien-retour{display:block;text-align:center;margin-top:20px;color:#94a3b8;text-decoration:none}
    .lien-retour:hover{color:var(--accent)}
  </style>
</head>
<body>

<div class="cadre-lumineux">
  <div class="contenu-form">
    <h2 class="titre-form">🔑 Mot de passe oublié</h2>
    <p class="sous-titre">Saisissez votre email, nous vous enverrons un lien de réinitialisation</p>

    <form id="formMdpOublie">
      <div class="mb-4">
        <label class="form-label">Adresse email</label>
        <input type="email" id="email" class="form-control" placeholder="votre@email.com" required>
      </div>
      <button type="submit" class="btn-envoi">📧 Envoyer le lien</button>
    </form>

    <a href="connexion.html" class="lien-retour">← Retour à la connexion</a>
  </div>
</div>

<script>
document.getElementById('formMdpOublie').addEventListener('submit', async e => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();

  try {
    const res = await fetch('/api/auth/mot-de-passe-oublie', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email })
    });

    const data = await res.json();

    if(data.ok){
      alert("✅ Un lien vous a été envoyé par email !\n(Vérifiez vos spams si vous ne le trouvez pas)");
      location.href = 'connexion.html';
    }else{
      alert("❌ " + (data.erreur || "Email introuvable"));
    }
  } catch (err) {
    alert("❌ Erreur serveur — vérifiez que le serveur est démarré");
  }
});
</script>

</body>
</html>
