<!DOCTYPE html>
<html lang="fr" class="lang-fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="consultationClasse">Classement & Emploi du Temps</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    :root {
      --primaire: #0c4a6e;
      --succes: #10b981;
      --accent: #f59e0b;
    }
    .jour-lundi { background: #e3f2fd; }
    .jour-mardi { background: #e8f5e9; }
    .jour-mercredi { background: #fff3e0; }
    .jour-jeudi { background: #f3e5f5; }
    .jour-vendredi { background: #ffebee; }
    .jour-samedi { background: #f5f5f5; }
    .table th { white-space: nowrap; }
    .chargement { opacity: 0.6; pointer-events: none; }
    tr:hover { transition: background 0.2s ease; }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark" style="background: linear-gradient(90deg, #0f172a, #0c4a6e);">
  <div class="container">
    <a class="navbar-brand" href="index.html">🏠 MAMA-ZOUMANA</a>
    <div class="d-flex align-items-center gap-2">
      <select id="selecteurLangue" class="form-select form-select-sm" onchange="changerLangue(this.value)">
        <option value="fr">🇫🇷 Français</option>
        <option value="en">🇬🇧 English</option>
        <option value="ar">🇸🇦 العربية</option>
      </select>
    </div>
  </div>
</nav>

<div class="container py-4">
  <h2 class="text-center mb-4">📚 <span data-i18n="consultationClasse">Consultation Classe & Élèves</span></h2>

  <div class="alert alert-primary text-center">
    <a href="classement-general.html" class="btn btn-primary btn-lg">📊 <span data-i18n="classementGeneral">Classement Général</span></a>
    <a href="classement-notes.html" class="btn btn-success btn-lg ms-2">🏅 <span data-i18n="voirClassementNotes">Classement par Notes</span></a>
  </div>

  <div class="card mb-4 shadow-sm">
    <div class="card-body">
      <label class="form-label fw-bold" data-i18n="choisirClasse">Sélectionnez une classe :</label>
      <select id="choixClasse" class="form-select form-select-lg" onchange="chargerDonnees()">
        <option value="" data-i18n="choisirClasse">-- Choisir une classe --</option>
      </select>
    </div>
  </div>

  <div id="infosClasse" class="alert alert-info d-none"></div>

  <!-- Liste des élèves -->
  <div class="card mb-4 shadow-sm">
    <div class="card-header bg-success text-white fw-bold">
      📋 <span data-i18n="listeEleves">Liste des Élèves</span>
    </div>
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-striped table-hover mb-0">
          <thead class="table-dark">
            <tr>
              <th width="60">#</th>
              <th data-i18n="matricule">Matricule</th>
              <th data-i18n="nomPrenoms">Nom & Prénoms</th>
              <th data-i18n="contact">Contact</th>
            </tr>
          </thead>
          <tbody id="corpsClassement">
            <tr>
              <td colspan="4" class="text-center text-muted py-4">
                <em data-i18n="choisirClasse">Choisissez une classe...</em>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Emploi du temps -->
  <div class="card shadow-sm">
    <div class="card-header text-white fw-bold" style="background: var(--primaire);">
      🕒 <span data-i18n="emploiTempsGeneral">Emploi du Temps Général</span>
    </div>
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-bordered mb-0">
          <thead class="table-dark">
            <tr>
              <th data-i18n="jour">Jour</th>
              <th data-i18n="horaires">Horaire</th>
              <th data-i18n="matiere">Matière</th>
              <th data-i18n="professeur">Professeur</th>
            </tr>
          </thead>
          <tbody id="corpsEmploi">
            <tr>
              <td colspan="4" class="text-center text-muted py-4">
                <em data-i18n="choisirClasse">Choisissez une classe...</em>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
  // ==================================================
  // ✅ CONFIGURATION — API CORRIGÉE
  // ==================================================
  const API_BASE = "https://mama-zoumana.onrender.com/api";
  const API_CLASSE = `${API_BASE}/classe-emploi`;
  let langueActuelle = localStorage.getItem('langue') || 'fr';

  // Traductions intégrées (plus de dépendance externe)
  const traductions = {
    fr: {
      choisirClasse: "-- Choisir une classe --",
      chargement: "Chargement des données…",
      classe: "Classe",
      effectif: "Effectif",
      eleve: "élève(s)",
      aucuneDonnee: "Aucune donnée trouvée",
      erreurChargement: "Erreur lors du chargement",
      consultationClasse: "Classement & Emploi du Temps",
      classementGeneral: "Classement Général",
      voirClassementNotes: "Classement par Notes",
      listeEleves: "Liste des Élèves",
      matricule: "Matricule",
      nomPrenoms: "Nom & Prénoms",
      contact: "Contact",
      emploiTempsGeneral: "Emploi du Temps Général",
      jour: "Jour",
      horaires: "Horaire",
      matiere: "Matière",
      professeur: "Professeur"
    },
    en: {
      choisirClasse: "-- Select a class --",
      chargement: "Loading data…",
      classe: "Class",
      effectif: "Total",
      eleve: "student(s)",
      aucuneDonnee: "No data found",
      erreurChargement: "Loading error",
      consultationClasse: "Ranking & Schedule",
      classementGeneral: "General Ranking",
      voirClassementNotes: "Grades Ranking",
      listeEleves: "Student List",
      matricule: "Student ID",
      nomPrenoms: "Full Name",
      contact: "Contact",
      emploiTempsGeneral: "Class Schedule",
      jour: "Day",
      horaires: "Time",
      matiere: "Subject",
      professeur: "Teacher"
    },
    ar: {
      choisirClasse: "-- اختر الفصل --",
      chargement: "جارٍ التحميل…",
      classe: "الفصل",
      effectif: "العدد",
      eleve: "تلميذ(ة)",
      aucuneDonnee: "لا توجد بيانات",
      erreurChargement: "خطأ في التحميل"
    }
  };

  // ==================================================
  // ✅ TRADUCTION
  // ==================================================
  function changerLangue(lang) {
    langueActuelle = lang;
    localStorage.setItem('langue', lang);
    document.documentElement.lang = lang;
    document.documentElement.classList.remove('lang-fr','lang-en','lang-ar');
    document.documentElement.classList.add(`lang-${lang}`);
    document.body.style.direction = lang === 'ar' ? 'rtl' : 'ltr';
    appliquerTraductions();
  }

  function appliquerTraductions() {
    const t = traductions[langueActuelle];
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const cle = el.getAttribute('data-i18n');
      if (t[cle]) el.textContent = t[cle];
    });
  }

  // ==================================================
  // ✅ REQUÊTE API UNIFORME + GESTION ERREURS
  // ==================================================
  async function requeteAPI(url) {
    try {
      const reponse = await fetch(url, { signal: AbortSignal.timeout(12000) });
      if (!reponse.ok) throw new Error(`Erreur ${reponse.status}`);
      return await reponse.json();
    } catch (err) {
      console.warn("❌", url, err.message);
      return { ok: false, erreur: err.message };
    }
  }

  // ==================================================
  // ✅ CHARGER LA LISTE DES CLASSES
  // ==================================================
  async function chargerClasses() {
    const sel = document.getElementById('choixClasse');
    const t = traductions[langueActuelle];
    sel.disabled = true;
    const data = await requeteAPI(`${API_CLASSE}/liste-classes`);
    sel.disabled = false;
    sel.innerHTML = `<option value="">-- ${t.choisirClasse} --</option>`;
    if (data.ok && Array.isArray(data.classes)) {
      data.classes.forEach(c => {
        const libelle = c.libelle_classe || c.libelle || c.niveau || c;
        sel.innerHTML += `<option value="${c.id_classe || c.id || libelle}">${libelle}</option>`;
      });
    } else {
      sel.innerHTML += `<option disabled>⚠️ ${t.erreurChargement}</option>`;
    }
  }

  // ==================================================
  // ✅ CHARGER DONNÉES CLASSE SÉLECTIONNÉE
  // ==================================================
  async function chargerDonnees() {
    const id = document.getElementById('choixClasse').value;
    const t = traductions[langueActuelle];
    const corpsClassement = document.getElementById('corpsClassement');
    const corpsEmploi = document.getElementById('corpsEmploi');
    const infosClasse = document.getElementById('infosClasse');

    // Réinitialisation si aucune classe
    if (!id) {
      corpsClassement.innerHTML = `<tr><td colspan="4" class="text-center text-muted py-4"><em>-- ${t.choisirClasse} --</em></td></tr>`;
      corpsEmploi.innerHTML = corpsClassement.innerHTML;
      infosClasse.classList.add('d-none');
      return;
    }

    // État chargement
    infosClasse.classList.remove('d-none', 'alert-info', 'alert-danger');
    infosClasse.classList.add('alert-info');
    infosClasse.textContent = t.chargement;
    corpsClassement.innerHTML = `<tr><td colspan="4" class="text-center py-4"><div class="spinner-border text-primary"></div></td></tr>`;
    corpsEmploi.innerHTML = corpsClassement.innerHTML;

    // Couleurs par jour
    const couleursJour = {
      'Lundi':'jour-lundi', 'Mardi':'jour-mardi', 'Mercredi':'jour-mercredi',
      'Jeudi':'jour-jeudi', 'Vendredi':'jour-vendredi', 'Samedi':'jour-samedi',
      'lundi':'jour-lundi', 'mardi':'jour-mardi', 'mercredi':'jour-mercredi',
      'jeudi':'jour-jeudi', 'vendredi':'jour-vendredi', 'samedi':'jour-samedi'
    };

    // 📊 Classement / Liste élèves
    const classement = await requeteAPI(`${API_CLASSE}/classement/${id}`);
    if (classement.ok && Array.isArray(classement.classement)) {
      infosClasse.innerHTML = `<strong>${t.classe} :</strong> ${classement.classe?.libelle_classe || ''} — <strong>${t.effectif} :</strong> ${classement.effectif || classement.classement.length} ${t.eleve}`;
      corpsClassement.innerHTML = '';
      if (classement.classement.length === 0) {
        corpsClassement.innerHTML = `<tr><td colspan="4" class="text-center text-muted py-4">${t.aucuneDonnee}</td></tr>`;
      } else {
        classement.classement.forEach((e, i) => {
          const nom = e.nom || e.nom_eleve || '';
          const prenoms = e.prenoms || e.prenom || '';
          const contact = e.telephone || e.email || e.contact || '-';
          corpsClassement.innerHTML += `<tr><td>${i+1}</td><td><code>${e.matricule || '-'}</code></td><td>${nom} ${prenoms}</td><td>${contact}</td></tr>`;
        });
      }
    } else {
      infosClasse.classList.remove('alert-info');
      infosClasse.classList.add('alert-danger');
      infosClasse.textContent = `${t.erreurChargement} : ${classement.erreur || ''}`;
      corpsClassement.innerHTML = `<tr><td colspan="4" class="text-center text-danger py-4">${t.aucuneDonnee}</td></tr>`;
    }

    // 🕒 Emploi du temps
    const emploi = await requeteAPI(`${API_CLASSE}/emploi-temps/${id}`);
    corpsEmploi.innerHTML = '';
    if (emploi.ok && Array.isArray(emploi.emploi_temps)) {
      if (emploi.emploi_temps.length === 0) {
        corpsEmploi.innerHTML = `<tr><td colspan="4" class="text-center text-muted py-4">${t.aucuneDonnee}</td></tr>`;
      } else {
        emploi.emploi_temps.forEach(e => {
          const jour = e.jour || e.jour_semaine || '';
          const heureD = (e.heure_debut || e.debut || '').slice(0,5);
          const heureF = (e.heure_fin || e.fin || '').slice(0,5);
          const matiere = e.matiere || e.libelle_matiere || '-';
          const prof = e.professeur || e.nom_prof || '-';
          corpsEmploi.innerHTML += `<tr class="${couleursJour[jour] || ''}"><td class="fw-bold">${jour}</td><td>${heureD} — ${heureF}</td><td>${matiere}</td><td>${prof}</td></tr>`;
        });
      }
    } else {
      corpsEmploi.innerHTML = `<tr><td colspan="4" class="text-center text-muted py-4">${t.aucuneDonnee}</td></tr>`;
    }
  }

  // ==================================================
  // ✅ INITIALISATION
  // ==================================================
  document.addEventListener('DOMContentLoaded', async () => {
    document.getElementById('selecteurLangue').value = langueActuelle;
    appliquerTraductions();
    await chargerClasses();
  });
</script>
</body>
</html>
