<!DOCTYPE html>
<html lang="fr" class="lang-fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>
    <span class="txt-fr">Déconnexion — MAMA-ZOUMANA</span>
    <span class="txt-en">Logout — MAMA-ZOUMANA</span>
    <span class="txt-ar">تسجيل الخروج — ماما زومانا</span>
  </title>

  <!-- URLs vérifiées, harmonisées et conformes -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    /* ✅ VARIABLES COULEURS  — MODE CLAIR */
    :root {
      --sombre: #0f172a;
      --sombre-clair: #1e293b;
      --bord-orange: #f59e0b;
      --texte-dore: #fbbf24;
      --texte: #f8fafc;
      --texte-secondaire: #cbd5e1;
      --fond-page: #f1f5f9;
      --fond-carte: #ffffff;
      --texte-principal: #1e293b;
      --ombre: rgba(12, 74, 110, 0.12);
    }

    /* 🌙 MODE SOMBRE — NOCTURNE */
    body.mode-nuit {
      --fond-page: #0f172a;
      --fond-carte: #1e293b;
      --texte-principal: #f8fafc;
      --texte-secondaire: #cbd5e1;
      --ombre: rgba(245, 158, 11, 0.2);
    }

    /* ✅ MODÈLE DE LANGUE UNIFORME */
    .txt-en, .txt-ar { display: none !important; }
    body.lang-fr .txt-fr { display: inline !important; }
    body.lang-fr .txt-en, body.lang-fr .txt-ar { display: none !important; }
    body.lang-en .txt-en { display: inline !important; }
    body.lang-en .txt-fr, body.lang-en .txt-ar { display: none !important; }
    body.lang-ar .txt-ar { display: inline !important; }
    body.lang-ar .txt-fr, body.lang-ar .txt-en { display: none !important; }
    body.lang-ar { direction: rtl; }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--fond-page);
      color: var(--texte-principal);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.4s ease, color 0.4s ease;
      font-family: 'Segoe UI', sans-serif;
    }

    body.mode-nuit {
      background: linear-gradient(135deg, var(--sombre), var(--sombre-clair));
    }

    .carte {
      background: var(--fond-carte);
      padding: 2.5rem;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 0 25px var(--ombre);
      border: 1px solid transparent;
      transition: all 0.4s ease;
      position: relative;
      overflow: hidden;
    }

    body.mode-nuit .carte {
      border: 1px solid rgba(245, 158, 11, 0.2);
    }

    .carte::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: conic-gradient(transparent, var(--bord-orange), var(--texte-dore), var(--bord-orange), transparent 30%);
      animation: rotation-bord 3.5s linear infinite;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    body.mode-nuit .carte::before {
      opacity: 1;
    }

    .carte::after {
      content: '';
      position: absolute;
      inset: 2px;
      background: var(--fond-carte);
      border-radius: 14px;
      z-index: 0;
      transition: background 0.4s ease;
    }

    @keyframes rotation-bord {
      100% { transform: rotate(360deg); }
    }

    .carte-contenu {
      position: relative;
      z-index: 1;
    }

    .titre-carte {
      color: var(--bord-orange);
      font-weight: 700;
      margin-bottom: 1rem;
      transition: color 0.4s ease;
    }

    .texte-info {
      color: var(--texte-secondaire);
      margin-bottom: 1.5rem;
      transition: color 0.4s ease;
    }

    .icone-principale {
      color: var(--bord-orange);
      transition: color 0.4s ease;
    }

    .btn-orange {
      background: linear-gradient(135deg, var(--bord-orange), #f97316);
      color: var(--sombre);
      font-weight: 700;
      border: none;
      border-radius: 10px;
      padding: 0.75rem 2rem;
      width: 100%;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .btn-orange:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
      color: var(--sombre);
    }

    .btn-orange::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      animation: reflet-bouton 2.5s ease-in-out infinite;
    }

    @keyframes reflet-bouton {
      0% { left: -100%; }
      100% { left: 100%; }
    }

    .btn-theme {
      position: absolute;
      top: 15px;
      right: 15px;
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid var(--bord-orange);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--bord-orange);
      transition: all 0.3s ease;
      z-index: 2;
    }

    .btn-theme:hover {
      transform: scale(1.1);
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.3);
    }

    /* ✅ Amélioration mobile */
    @media (max-width: 576px) {
      .carte { padding: 2rem 1.5rem; }
    }
  </style>
</head>
<body class="lang-fr">

<div class="container">
  <div class="carte position-relative">
    <!-- 🌙 Bouton Jour/Nuit -->
    <button id="btnTheme" class="btn-theme" title="Basculer jour/nuit">☀️</button>

    <div class="carte-contenu">
      <i class="bi bi-box-arrow-right fs-1 mb-3 d-block icone-principale"></i>

      <h3 class="titre-carte">
        <span class="txt-fr">Déconnexion réussie</span>
        <span class="txt-en">Successfully logged out</span>
        <span class="txt-ar">تم تسجيل الخروج بنجاح</span>
      </h3>

      <p class="texte-info opacity-80">
        <span class="txt-fr">Vous êtes bien déconnecté. À bientôt sur MAMA-ZOUMANA.</span>
        <span class="txt-en">You have been logged out. See you soon on MAMA-ZOUMANA.</span>
        <span class="txt-ar">تم تسجيل خروجك بنجاح. نراك قريباً في ماما زومانا.</span>
      </p>

      <a href="connexion.html" class="btn btn-orange text-decoration-none">
        <span class="txt-fr">🔐 Se reconnecter</span>
        <span class="txt-en">🔐 Log back in</span>
        <span class="txt-ar">🔐 تسجيل الدخول مجدداً</span>
      </a>
    </div>
  </div>
</div>

<script>
// ==================================================
// 🌙 MODE JOUR / NUIT — Identique à la connexion
// ==================================================
const btnTheme = document.getElementById('btnTheme');

function appliquerTheme(nuit) {
  if (nuit) {
    document.body.classList.add('mode-nuit');
    btnTheme.textContent = '🌙';
  } else {
    document.body.classList.remove('mode-nuit');
    btnTheme.textContent = '☀️';
  }
  localStorage.setItem('themeNuit', nuit ? '1' : '0');
}

btnTheme.addEventListener('click', () => {
  appliquerTheme(!document.body.classList.contains('mode-nuit'));
});

// ==================================================
// 🗣️ GESTION DE LA LANGUE
// ==================================================
function appliquerLangue(lang) {
  document.body.classList.remove('lang-fr', 'lang-en', 'lang-ar');
  document.body.classList.add('lang-' + lang);
  document.documentElement.lang = lang;
  localStorage.setItem('langue', lang);
}

// ==================================================
// ✅ SUPPRESSION COMPLÈTE DES DONNÉES DE SESSION
// ==================================================
localStorage.removeItem('token');
localStorage.removeItem('role');
localStorage.removeItem('nom');
localStorage.removeItem('prenom');
localStorage.removeItem('id');
localStorage.removeItem('matricule');
localStorage.removeItem('email');
localStorage.removeItem('est_admin');
localStorage.removeItem('enfants');

// ==================================================
// ✅ RESTAURER LANGUE ET THÈME AU CHARGEMENT
// ==================================================
window.addEventListener('DOMContentLoaded', () => {
  // Restaurer langue
  const langueSauvegardee = localStorage.getItem('langue') || 'fr';
  appliquerLangue(langueSauvegardee);

  // Restaurer thème
  const themeNuit = localStorage.getItem('themeNuit') === '1';
  appliquerTheme(themeNuit);
});
</script>

</body>
</html>
