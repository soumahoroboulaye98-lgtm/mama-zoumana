<!DOCTYPE html>
<html lang="fr" class="lang-fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>
    <span class="txt-fr">Vérification Code — MAMA-ZOUMANA</span>
    <span class="txt-en">Code Verification — MAMA-ZOUMANA</span>
    <span class="txt-ar">التحقق من الرمز — ماما زومانا</span>
  </title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    :root {
      --primaire: #0c4a6e;
      --secondaire: #0369a1;
      --accent: #f59e0b;
      --clair: #f8fafc;
      --sombre: #0f172a;
    }

    /* ✅ TRADUCTIONS HARMONISÉES */
    .txt-en, .txt-ar { display: none !important; }
    body.lang-fr .txt-fr { display: inline !important; }
    body.lang-fr .txt-en, body.lang-fr .txt-ar { display: none !important; }
    body.lang-en .txt-en { display: inline !important; }
    body.lang-en .txt-fr, body.lang-en .txt-ar { display: none !important; }
    body.lang-ar .txt-ar { display: inline !important; }
    body.lang-ar .txt-fr, body.lang-ar .txt-en { display: none !important; }
    body.lang-ar { direction: rtl; }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, var(--sombre), #1e293b);
      display: flex; align-items: center; justify-content: center;
      padding: 20px; font-family: 'Segoe UI', sans-serif;
    }

    /* 🎇 CADRE LUMINEUX IDENTIQUE */
    .cadre-lumineux {
      position: relative;
      background: rgba(15, 23, 42, 0.9);
      border-radius: 20px;
      padding: 40px 30px;
      max-width: 460px; width: 100%;
      overflow: hidden;
      box-shadow: 0 0 25px rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.2);
    }

    .cadre-lumineux::before {
      content: '';
      position: absolute;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background: conic-gradient(
        transparent,
        #f59e0b,
        #fbbf24,
        #f59e0b,
        transparent 30%
      );
      animation: rotation-bord 3.5s linear infinite;
    }

    .cadre-lumineux::after {
      content: '';
      position: absolute;
      inset: 3px;
      background: rgba(15, 23, 42, 0.98);
      border-radius: 18px;
      z-index: 1;
    }

    @keyframes rotation-bord {
      100% { transform: rotate(360deg); }
    }

    .contenu-form { position: relative; z-index: 2; }
    .titre-form { color: var(--accent); font-weight: 700; text-align: center; margin-bottom: 20px; }
    .sous-titre { color: #cbd5e1; text-align: center; margin-bottom: 30px; font-size: 0.95rem; }

    .btn-langue {
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid var(--accent);
      border-radius: 20px;
      padding: 4px 10px;
      font-size: 0.85rem;
      cursor: pointer;
      margin: 0 2px;
      color: var(--accent);
      font-weight: 600;
      transition: all 0.2s;
    }
    .btn-langue.active {
      background: var(--accent);
      color: var(--sombre);
      box-shadow: 0 0 8px rgba(245, 158, 11, 0.4);
    }

    .form-control {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(245, 158, 11, 0.25);
      color: white;
      border-radius: 10px;
      padding: 12px 14px;
      text-align: center;
      font-size: 1.2rem;
      letter-spacing: 8px;
      font-weight: 600;
      transition: all 0.3s ease;
    }
    .form-control:focus {
      background: rgba(30, 41, 59, 0.9);
      border-color: var(--accent);
      box-shadow: 0 0 0 0.25rem rgba(245, 158, 11, 0.25);
      color: white;
      outline: none;
    }

    .btn-envoi {
      width: 100%;
      background: linear-gradient(135deg, var(--accent), #f97316);
      border: none;
      color: var(--sombre);
      font-weight: 700;
      padding: 12px;
      border-radius: 10px;
      margin-top: 10px;
      position: relative;
      overflow: hidden;
      transition: transform 0.2s ease;
    }
    .btn-envoi:hover { transform: translateY(-2px); }
    .btn-envoi::after {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      animation: reflet-bouton 2.5s ease-in-out infinite;
    }
    @keyframes reflet-bouton {
      0% { left: -100%; }
      100% { left: 100%; }
    }

    .lien-reno { color: var(--accent); text-decoration: none; font-size: 0.9rem; display: block; text-align: center; margin-top: 15px; }
    .lien-reno:hover { color: #fbbf24; }

    .msg-erreur { color: #ef4444; text-align: center; margin-top: 15px; display: none; }
    .msg-succes { color: #10b981; text-align: center; margin-top: 15px; display: none; }
  </style>
</head>
<body class="lang-fr">

<div class="cadre-lumineux">
  <div class="contenu-form">
    <!-- 🌐 LANGUE -->
    <div class="d-flex justify-content-end mb-3">
      <button class="btn-langue active" data-lang="fr">FR</button>
      <button class="btn-langue" data-lang="en">EN</button>
      <button class="btn-langue" data-lang="ar">AR</button>
    </div>

    <h3 class="titre-form">
      <i class="bi bi-shield-lock"></i>
      <span class="txt-fr"> VÉRIFICATION COMPTE</span>
      <span class="txt-en"> ACCOUNT VERIFICATION</span>
      <span class="txt-ar"> التحقق من الحساب</span>
    </h3>
    <p class="sous-titre">
      <span class="txt-fr">Entrez le code à 6 chiffres reçu par email</span>
      <span class="txt-en">Enter the 6-digit code received by email</span>
      <span class="txt-ar">أدخل الرمز المكون من 6 أرقام المستلم عبر البريد الإلكتروني</span>
    </p>

    <form id="form-verif">
      <input type="text" id="code" class="form-control" maxlength="6" placeholder="000000" required inputmode="numeric">
      <div id="msg-erreur" class="msg-erreur"></div>
      <div id="msg-succes" class="msg-succes"></div>
      <button type="submit" class="btn-envoi mt-4">
        <i class="bi bi-check-circle"></i>
        <span class="txt-fr"> VALIDER MON COMPTE</span>
        <span class="txt-en"> VERIFY MY ACCOUNT</span>
        <span class="txt-ar"> تأكيد حسابي</span>
      </button>
      <a href="#" class="lien-reno" id="renvoyer">
        <span class="txt-fr">🔄 Renvoyer le code</span>
        <span class="txt-en">🔄 Resend code</span>
        <span class="txt-ar">🔄 إعادة إرسال الرمز</span>
      </a>
    </form>
  </div>
</div>

<script>
// ==================================================
// ⚙️ CONFIGURATION — 100% HARMONISÉE ✅
// ==================================================
const API_URL = 'https://mama-zoumana-api.onrender.com/api';
let langue = localStorage.getItem('langue') || 'fr';

const msg = {
  codeIncorrect: {
    fr: "❌ Code incorrect ou expiré",
    en: "❌ Incorrect or expired code",
    ar: "❌ رمز غير صحيح أو منتهي الصلاحية"
  },
  verifSucces: {
    fr: "✅ Compte vérifié — En attente de validation par l'administrateur",
    en: "✅ Account verified — Waiting for admin validation",
    ar: "✅ تم التحقق من الحساب — بانتظار موافقة المدير"
  },
  erreurServeur: {
    fr: "❌ Erreur de connexion au serveur",
    en: "❌ Server connection error",
    ar: "❌ خطأ في الاتصال بالخادم"
  },
  codeRenvoye: {
    fr: "✅ Code renvoyé ! Vérifiez votre email",
    en: "✅ Code resent! Check your email",
    ar: "✅ تم إعادة إرسال الرمز! تحقق من بريدك الإلكتروني"
  }
};

// ==================================================
// 🌐 GESTION DES LANGUES ✅
// ==================================================
function appliquerLangue(lang) {
  langue = lang;
  localStorage.setItem('langue', lang);
  document.body.classList.remove('lang-fr','lang-en','lang-ar');
  document.body.classList.add('lang-' + lang);
  document.querySelectorAll('.btn-langue').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
}

document.querySelectorAll('.btn-langue').forEach(btn => {
  btn.addEventListener('click', () => appliquerLangue(btn.dataset.lang));
});

// Restaurer langue sauvegardée
document.addEventListener('DOMContentLoaded', () => {
  appliquerLangue(localStorage.getItem('langue') || 'fr');
});

// ==================================================
// ✅ SOUMISSION — URL ET ROUTE CORRIGÉES ✅
// ==================================================
document.getElementById('form-verif').addEventListener('submit', async e => {
  e.preventDefault();
  const code = document.getElementById('code').value.trim();
  const msgErreur = document.getElementById('msg-erreur');
  const msgSucces = document.getElementById('msg-succes');

  msgErreur.style.display = 'none';
  msgSucces.style.display = 'none';

  if (!code || code.length !== 6) {
    msgErreur.textContent = "⚠️ " + { fr: "6 chiffres requis", en: "6 digits required", ar: "مطلوب 6 أرقام" }[langue];
    msgErreur.style.display = 'block';
    return;
  }

  try {
    // ✅ URL HARMONISÉE : API_URL + /inscription/verifier
    const res = await fetch(`${API_URL}/inscription/verifier`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code })
    });

    const data = await res.json();

    if (data.ok) {
      msgSucces.textContent = msg.verifSucces[langue];
      msgSucces.style.display = 'block';
      setTimeout(() => {
        window.location.href = 'connexion.html';
      }, 2500);
    } else {
      msgErreur.textContent = msg.codeIncorrect[langue];
      msgErreur.style.display = 'block';
    }
  } catch {
    msgErreur.textContent = msg.erreurServeur[langue];
    msgErreur.style.display = 'block';
  }
});

// ==================================================
// ✅ RENVOYER LE CODE — ROUTE CORRIGÉE ✅
// ==================================================
document.getElementById('renvoyer').addEventListener('click', async e => {
  e.preventDefault();
  const msgErreur = document.getElementById('msg-erreur');
  const msgSucces = document.getElementById('msg-succes');

  msgErreur.style.display = 'none';
  msgSucces.style.display = 'none';

  try {
    // ✅ URL HARMONISÉE : API_URL + /inscription/renvoyer
    const res = await fetch(`${API_URL}/inscription/renvoyer`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' }
    });

    const data = await res.json();

    if (data.ok) {
      msgSucces.textContent = msg.codeRenvoye[langue];
      msgSucces.style.display = 'block';
    } else {
      msgErreur.textContent = (data.erreur || msg.erreurServeur[langue]);
      msgErreur.style.display = 'block';
    }
  } catch {
    msgErreur.textContent = msg.erreurServeur[langue];
    msgErreur.style.display = 'block';
  }
});
</script>

</body>
</html>
