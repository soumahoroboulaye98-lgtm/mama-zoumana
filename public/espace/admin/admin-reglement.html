<!DOCTYPE html>
<html lang="fr" class="lang-fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>
    <span class="lang-fr">Administration — Règlement Intérieur</span>
    <span class="lang-en">Administration — Internal Rules</span>
    <span class="lang-ar">الإدارة — النظام الداخلي</span>
  </title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    :root {
      --fond: #f8fafc;
      --surface: #ffffff;
      --texte: #1e293b;
      --texte-secondaire: #64748b;
      --bord: #e2e8f0;
      --primaire: #0c4a6e;
      --accent: #f59e0b;
      --succes: #10b981;
      --danger: #ef4444;
      --ombre: 0 2px 8px rgba(0,0,0,0.06);
    }
    [data-theme="sombre"] {
      --fond: #0f172a;
      --surface: #1e293b;
      --texte: #f8fafc;
      --texte-secondaire: #94a3b8;
      --bord: #334155;
      --primaire: #38bdf8;
      --accent: #fbbf24;
      --succes: #34d399;
      --danger: #f87171;
      --ombre: 0 2px 12px rgba(0,0,0,0.35);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; transition: all 0.25s ease; }
    body { background: var(--fond); color: var(--texte); min-height: 100vh; font-family:'Segoe UI', sans-serif; }
    .entete-page { background: var(--surface); border-bottom: 3px solid var(--accent); padding: 1.2rem 0; box-shadow: var(--ombre); }
    .carte { background: var(--surface); border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; border-left: 4px solid var(--accent); border: 1px solid var(--bord); box-shadow: var(--ombre); }
    .carte:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,0.08); }
    .form-control, .form-select {
      background: var(--fond); border: 1px solid var(--bord); color: var(--texte); border-radius: 8px;
    }
    .form-control:focus, .form-select:focus {
      background: var(--fond); border-color: var(--accent); color: var(--texte);
      box-shadow: 0 0 0 0.25rem rgba(245,158,11,0.20);
    }
    .btn-valide { background: var(--succes); color: white; border-radius: 8px; border: none; padding: 0.5rem 1rem; }
    .btn-valide:hover { filter: brightness(1.08); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(16,185,129,0.25); }
    .btn-modif { background: var(--accent); color: #000; padding: 6px 12px; font-size: 14px; border-radius: 6px; border: none; }
    .btn-modif:hover { filter: brightness(1.08); }
    .btn-suppr { background: var(--danger); color: white; padding: 6px 12px; font-size: 14px; border-radius: 6px; border: none; }
    .btn-suppr:hover { filter: brightness(1.08); }
    .badge-publie { background: rgba(16,185,129,0.15); color: var(--succes); padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: 600; }
    .badge-brouillon { background: rgba(245,158,11,0.15); color: var(--accent); padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: 600; }
    .contenu-article { color: var(--texte-secondaire); line-height: 1.8; white-space: pre-wrap; margin-top: 0.75rem; padding: 1rem; background: var(--fond); border-radius: 8px; }
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); align-items: center; justify-content: center; z-index: 1050; }
    .modal.active { display: flex; }
    .modal-contenu { background: var(--surface); padding: 1.8rem; border-radius: 12px; width: 92%; max-width: 680px; max-height: 92vh; overflow-y: auto; border: 1px solid var(--bord); box-shadow: var(--ombre); }
    .modal-contenu h2 { color: var(--accent); margin-bottom: 1.2rem; }
    .ligne { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 1rem; }
    .btn-fermer { background: #475569; color: white; border-radius: 6px; border: none; padding: 0.5rem 1rem; }
    .btn-enregistrer { background: var(--primaire); color: white; border-radius: 6px; border: none; padding: 0.5rem 1rem; }
    .btn-enregistrer:hover { filter: brightness(1.08); }
    .message { margin-top: 1rem; padding: 0.75rem; border-radius: 6px; display: none; }
    .message.succes { background: rgba(16,185,129,0.1); color: var(--succes); display: block; }
    .message.erreur { background: rgba(239,68,68,0.1); color: var(--danger); display: block; }
    .alerte-api { border-left: 3px solid var(--danger); background: rgba(239,68,68,0.1); border-radius: 8px; padding: 0.75rem 1rem; margin-bottom: 1rem; }
    .btn-mode { border-radius: 20px; padding: 4px 12px; font-size: 14px; border: 1px solid var(--bord); background: var(--surface); color: var(--texte); }
    .btn-mode:hover { border-color: var(--accent); }
    .lang-en, .lang-ar { display: none; }
    body.lang-fr .lang-fr { display: inline; }
    body.lang-en { direction: ltr; }
    body.lang-en .lang-fr, body.lang-en .lang-ar { display: none; }
    body.lang-en .lang-en { display: inline; }
    body.lang-ar { direction: rtl; }
    body.lang-ar .lang-fr, body.lang-ar .lang-en { display: none; }
    body.lang-ar .lang-ar { display: inline; }
    @media (max-width: 768px) {
      .ligne { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body class="lang-fr" data-theme="clair">

<!-- 🔗 CONFIGURATION API — PLUS DE LOCALHOST -->
<script>
const API_URL = "https://mama-zoumana-api.onrender.com/api";

function getToken() {
  return localStorage.getItem('token');
}

async function requeteAPI(chemin, options = {}) {
  const reponse = await fetch(`${API_URL}${chemin}`, {
    ...options,
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${getToken()}`,
      ...options.headers
    }
  });
  const donnees = await reponse.json();
  if (reponse.status === 401) {
    alert("⛔ Session expirée — Veuillez vous reconnecter");
    localStorage.removeItem('token');
    localStorage.removeItem('role');
    window.location.href = 'connexion.html';
    return;
  }
  return donnees;
}

const token = getToken();
const role = localStorage.getItem('role');
let langue = localStorage.getItem('langue') || 'fr';
let theme = localStorage.getItem('theme') || 'clair';
let modeLocal = false;

// 💾 TRADUCTIONS
const MSG = {
  fr: {
    accesReserve: "⛔ Accès réservé à l'Administrateur",
    serveurIndispo: "⚠️ Serveur indisponible — Mode local actif",
    compteur: "article(s)",
    ajouterTitre: "Ajouter un article",
    modifierTitre: "Modifier un article",
    titreFR: "Titre (FR) *",
    titreEN: "Titre (EN)",
    titreAR: "Titre (AR)",
    contenuFR: "Contenu (FR) *",
    contenuEN: "Contenu (EN)",
    contenuAR: "Contenu (AR)",
    ordre: "Ordre",
    publie: "Publié",
    brouillon: "📄 Brouillon",
    estPublie: "✅ Publié",
    annuler: "Annuler",
    enregistrer: "Enregistrer",
    ajouterOk: "✅ Article ajouté !",
    modifierOk: "✅ Article modifié !",
    confirmerSuppr: "Confirmer la suppression ?",
    supprOk: "✅ Article supprimé !",
    ajouterBtn: "➕ Ajouter un article",
    modifierBtn: "✏️ Modifier",
    supprimerBtn: "🗑️ Supprimer",
    retour: "Retour",
    aucunArticle: "Aucun article enregistré",
    reglement: "Règlement Intérieur"
  },
  en: {
    accesReserve: "⛔ Access restricted to Administrator",
    serveurIndispo: "⚠️ Server offline — Local mode active",
    compteur: "article(s)",
    ajouterTitre: "Add an article",
    modifierTitre: "Edit article",
    titreFR: "Title (FR) *",
    titreEN: "Title (EN)",
    titreAR: "Title (AR)",
    contenuFR: "Content (FR) *",
    contenuEN: "Content (EN)",
    contenuAR: "Content (AR)",
    ordre: "Order",
    publie: "Published",
    brouillon: "📄 Draft",
    estPublie: "✅ Published",
    annuler: "Cancel",
    enregistrer: "Save",
    ajouterOk: "✅ Article added!",
    modifierOk: "✅ Article updated!",
    confirmerSuppr: "Confirm deletion?",
    supprOk: "✅ Article deleted!",
    ajouterBtn: "➕ Add article",
    modifierBtn: "✏️ Edit",
    supprimerBtn: "🗑️ Delete",
    retour: "Back",
    aucunArticle: "No article registered",
    reglement: "Internal Rules"
  },
  ar: {
    accesReserve: "⛔ الوصول مقصور على المدير",
    serveurIndispo: "⚠️ الخادم غير متاح — العمل محلي",
    compteur: "مادة",
    ajouterTitre: "إضافة مادة",
    modifierTitre: "تعديل المادة",
    titreFR: "العنوان (فرنسي) *",
    titreEN: "العنوان (إنجليزي)",
    titreAR: "العنوان (عربي) *",
    contenuFR: "المحتوى (فرنسي) *",
    contenuEN: "المحتوى (إنجليزي)",
    contenuAR: "المحتوى (عربي)",
    ordre: "الترتيب",
    publie: "منشور",
    brouillon: "📄 مسودة",
    estPublie: "✅ منشور",
    annuler: "إلغاء",
    enregistrer: "حفظ",
    ajouterOk: "✅ تمت إضافة المادة!",
    modifierOk: "✅ تم تعديل المادة!",
    confirmerSuppr: "تأكيد الحذف؟",
    supprOk: "✅ تم حذف المادة!",
    ajouterBtn: "➕ إضافة مادة",
    modifierBtn: "✏️ تعديل",
    supprimerBtn: "🗑️ حذف",
    retour: "عودة",
    aucunArticle: "لا توجد مواد مسجلة",
    reglement: "النظام الداخلي"
  }
};
function m(cle) { return MSG[langue]?.[cle] || MSG.fr[cle]; }

// 🌙 THÈME
function appliquerTheme(t) {
  theme = t;
  document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem('theme', t);
  document.getElementById('btn-theme').innerHTML = t === 'clair' ? '<i class="bi bi-moon"></i>' : '<i class="bi bi-sun"></i>';
}
function basculerTheme() { appliquerTheme(theme === 'clair' ? 'sombre' : 'clair'); }

// 🗣️ LANGUE
function appliquerLangue(lg) {
  langue = lg;
  localStorage.setItem('langue', lg);
  document.body.classList.remove('lang-fr','lang-en','lang-ar');
  document.body.classList.add('lang-' + lg);
  document.querySelectorAll('.btn-langue').forEach(b => b.classList.remove('btn-outline-warning', 'bg-warning', 'text-dark', 'fw-bold'));
  document.getElementById('btn-' + lg)?.classList.add('btn-outline-warning', 'bg-warning', 'text-dark', 'fw-bold');
}

// 🔒 SÉCURITÉ
if(!token || !['admin','super_admin','directeur'].includes((role||'').toLowerCase())){
  alert(m('accesReserve'));
  localStorage.clear();
  location.href = 'connexion.html';
}

// 💾 STOCKAGE LOCAL
function obtenirArticlesLocaux() { return JSON.parse(localStorage.getItem('reglement_articles') || '[]'); }
function sauvegarderArticlesLocaux(liste) { localStorage.setItem('reglement_articles', JSON.stringify(liste)); }
</script>

<!-- 📌 EN-TÊTE -->
<div class="entete-page">
  <div class="container d-flex justify-content-between align-items-center">
    <div>
      <h3 class="mb-1">
        <i class="bi bi-file-text me-2" style="color:var(--accent)"></i>
        <span class="lang-fr">Gestion du Règlement Intérieur</span>
        <span class="lang-en">Internal Rules Management</span>
        <span class="lang-ar">إدارة النظام الداخلي</span>
      </h3>
      <p class="mb-0 opacity-75 small">
        <span class="lang-fr">Publier et organiser les articles du règlement</span>
        <span class="lang-en">Publish and organize rule articles</span>
        <span class="lang-ar">نشر وتنظيم مواد النظام الداخلي</span>
      </p>
    </div>
    <div class="d-flex align-items-center gap-2">
      <button class="btn-mode" id="btn-theme" onclick="basculerTheme()" title="Mode jour/nuit">
        <i class="bi bi-moon"></i>
      </button>
      <button class="btn btn-sm btn-outline-light btn-langue" onclick="appliquerLangue('fr')" id="btn-fr">FR</button>
      <button class="btn btn-sm btn-outline-light btn-langue" onclick="appliquerLangue('en')" id="btn-en">EN</button>
      <button class="btn btn-sm btn-outline-light btn-langue" onclick="appliquerLangue('ar')" id="btn-ar">AR</button>
      <a href="dashboard.html" class="btn btn-outline-secondary btn-sm ms-1">
        <i class="bi bi-arrow-left"></i>
        <span class="lang-fr"> Retour</span>
        <span class="lang-en"> Back</span>
        <span class="lang-ar"> عودة</span>
      </a>
    </div>
  </div>
</div>

<div class="container py-4">
  <div id="alerteApi" class="alerte-api d-none">
    <i class="bi bi-wifi-off me-2"></i>
    <span id="texteAlerteApi"></span>
  </div>

  <div class="d-flex justify-content-between align-items-center mb-4">
    <p class="mb-0 fw-bold"><span id="compteur">0</span> <span class="lang-fr">article(s)</span><span class="lang-en">article(s)</span><span class="lang-ar">مادة</span></p>
    <button class="btn btn-valide" onclick="ouvrirFormulaire()">
      <i class="bi bi-plus-lg"></i>
      <span class="lang-fr"> Ajouter un article</span>
      <span class="lang-en"> Add article</span>
      <span class="lang-ar"> إضافة مادة</span>
    </button>
  </div>

  <div id="liste"></div>
</div>

<div class="modal" id="formModal">
  <div class="modal-contenu">
    <h2 id="titreForm">...</h2>
    <form id="formArticle">
      <input type="hidden" id="id">
      <input type="text" id="titre_fr" class="form-control" placeholder="Titre (FR) *" required>
      <div class="ligne">
        <input type="text" id="titre_en" class="form-control" placeholder="Titre (EN)">
        <input type="text" id="titre_ar" class="form-control" placeholder="Titre (AR)">
      </div>
      <textarea id="contenu_fr" class="form-control" rows="5" placeholder="Contenu (FR) *" required></textarea>
      <textarea id="contenu_en" class="form-control" rows="4" placeholder="Contenu (EN)"></textarea>
      <textarea id="contenu_ar" class="form-control" rows="4" placeholder="Contenu (AR)"></textarea>
      <div class="ligne align-items-center">
        <input type="number" id="ordre" class="form-control" placeholder="Ordre" value="1">
        <label style="display:flex;align-items:center;gap:8px;margin-bottom:0;color:var(--texte)">
          <input type="checkbox" id="est_publie" checked>
          <span class="lang-fr"> Publié</span>
          <span class="lang-en"> Published</span>
          <span class="lang-ar"> منشور</span>
        </label>
      </div>
      <div class="actions">
        <button type="button" class="btn-fermer" onclick="fermerFormulaire()">
          <span class="lang-fr">Annuler</span>
          <span class="lang-en">Cancel</span>
          <span class="lang-ar">إلغاء</span>
        </button>
        <button type="submit" class="btn-enregistrer">
          <span class="lang-fr">Enregistrer</span>
          <span class="lang-en">Save</span>
          <span class="lang-ar">حفظ</span>
        </button>
      </div>
      <div class="message" id="message"></div>
    </form>
  </div>
</div>

<script>
let listeArticles = [];

function basculerModeLocal(actif) {
  modeLocal = actif;
  const alerte = document.getElementById('alerteApi');
  document.getElementById('texteAlerteApi').textContent = m('serveurIndispo');
  alerte.classList.toggle('d-none', !actif);
}

// 📋 CHARGER LA LISTE
async function chargerListe(forcerLocal = false) {
  let liste = [];
  if (!forcerLocal) {
    try {
      // ✅ UTILISE requeteAPI — PLUS DE fetch NI API_URL NI HEADERS
      const data = await requeteAPI('/reglement/liste?tout=1');
      if (data.ok) {
        liste = data.articles || [];
        sauvegarderArticlesLocaux(liste);
        basculerModeLocal(false);
      } else {
        throw new Error();
      }
    } catch {
      forcerLocal = true;
    }
  }
  if (forcerLocal) {
    basculerModeLocal(true);
    liste = obtenirArticlesLocaux();
  }
  listeArticles = liste;
  document.getElementById('compteur').textContent = liste.length;
  afficherListe();
}

// 🖥️ AFFICHER LA LISTE
function afficherListe() {
  const conteneur = document.getElementById('liste');
  if (!listeArticles.length) {
    conteneur.innerHTML = `<div class="carte text-center py-4 text-muted">${m('aucunArticle')}</div>`;
    return;
  }
  conteneur.innerHTML = '';
  listeArticles.sort((a,b) => a.ordre - b.ordre).forEach(a => {
    const titreAffiche = langue === 'en' && a.titre_en ? a.titre_en :
                         langue === 'ar' && a.titre_ar ? a.titre_ar : a.titre_fr;
    const contenuAffiche = langue === 'en' && a.contenu_en ? a.contenu_en :
                           langue === 'ar' && a.contenu_ar ? a.contenu_ar : a.contenu_fr;
    conteneur.innerHTML += `
      <div class="carte">
        <h5 class="fw-bold mb-2">
          ${a.ordre}. ${titreAffiche || ''}
          <span class="${a.est_publie ? 'badge-publie' : 'badge-brouillon'} ms-2">
            ${a.est_publie ? m('estPublie') : m('brouillon')}
          </span>
        </h5>
        <div class="contenu-article">${(contenuAffiche || '').replace(/</g,'&lt;')}</div>
        <div class="mt-3">
          <button class="btn-modif" onclick="modifier(${a.id})">✏️ ${m('modifierBtn')}</button>
          <button class="btn-suppr" onclick="supprimer(${a.id})">🗑️ ${m('supprimerBtn')}</button>
        </div>
      </div>`;
  });
}

// 📝 OUVRIR FORMULAIRE
function ouvrirFormulaire() {
  document.getElementById('formArticle').reset();
  document.getElementById('id').value = '';
  document.getElementById('titreForm').textContent = m('ajouterTitre');
  document.getElementById('est_publie').checked = true;
  document.getElementById('formModal').classList.add('active');
}

// ✏️ MODIFIER ARTICLE
function modifier(id) {
  const a = listeArticles.find(x => Number(x.id) === Number(id));
  if(!a) return;
  ['id','titre_fr','titre_en','titre_ar','contenu_fr','contenu_en','contenu_ar','ordre'].forEach(k => {
    const el = document.getElementById(k);
    if(el) el.value = a[k] || '';
  });
  document.getElementById('est_publie').checked = Boolean(a.est_publie);
  document.getElementById('titreForm').textContent = m('modifierTitre');
  document.getElementById('formModal').classList.add('active');
}

// ❌ FERMER FORMULAIRE
function fermerFormulaire() {
  document.getElementById('formModal').classList.remove('active');
  document.getElementById('message').className = 'message';
  document.getElementById('message').textContent = '';
}

// 💾 ENREGISTRER ARTICLE
document.getElementById('formArticle').addEventListener('submit', async e => {
  e.preventDefault();
  const id = document.getElementById('id').value;
  const donnees = {
    titre_fr: document.getElementById('titre_fr').value,
    titre_en: document.getElementById('titre_en').value,
    titre_ar: document.getElementById('titre_ar').value,
    contenu_fr: document.getElementById('contenu_fr').value,
    contenu_en: document.getElementById('contenu_en').value,
    contenu_ar: document.getElementById('contenu_ar').value,
    ordre: parseInt(document.getElementById('ordre').value) || 1,
    est_publie: document.getElementById('est_publie').checked
  };
  const msg = document.getElementById('message');
  try {
    const url = id ? `/reglement/${id}` : `/reglement/ajouter`;
    const methode = id ? 'PUT' : 'POST';
    const rep = await requeteAPI(url, {
      method: methode,
      body: JSON.stringify(donnees)
    });
    if (rep.ok) {
      msg.className = 'message succes';
      msg.textContent = id ? m('modifierOk') : m('ajouterOk');
      await chargerListe();
      setTimeout(fermerFormulaire, 1200);
    } else {
      throw new Error(rep.erreur || 'Erreur serveur');
    }
  } catch (err) {
    // 📴 Mode local de secours
    let liste = obtenirArticlesLocaux();
    donnees.id = id ? Number(id) : Date.now();
    if (id) {
      liste = liste.map(a => Number(a.id) === Number(id) ? {...a, ...donnees} : a);
    } else {
      liste.push(donnees);
    }
    sauvegarderArticlesLocaux(liste);
    listeArticles = liste;
    basculerModeLocal(true);
    msg.className = 'message succes';
    msg.textContent = (id ? m('modifierOk') : m('ajouterOk')) + " (local)";
    afficherListe();
    setTimeout(fermerFormulaire, 1200);
  }
});

// 🗑️ SUPPRIMER ARTICLE
async function supprimer(id) {
  if (!confirm(m('confirmerSuppr'))) return;
  try {
    const rep = await requeteAPI(`/reglement/${id}`, { method: 'DELETE' });
    if (rep.ok) {
      await chargerListe();
      alert(m('supprOk'));
    } else {
      throw new Error(rep.erreur);
    }
  } catch {
    let liste = obtenirArticlesLocaux().filter(a => Number(a.id) !== Number(id));
    sauvegarderArticlesLocaux(liste);
    listeArticles = liste;
    basculerModeLocal(true);
    afficherListe();
    alert(m('supprOk') + " (local)");
  }
}

// 🚀 INITIALISATION
window.onload = async function() {
  appliquerTheme(theme);
  appliquerLangue(langue);
  await chargerListe();
};
</script>
