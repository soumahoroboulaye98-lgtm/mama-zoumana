<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestion des Matières — MAMA-ZOUMANA</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    :root { --sombre:#0f172a; --bord-orange:#f59e0b; --succes:#10b981; --texte:#f8fafc; --fond-dore:#b78628; --fond-dore-clair:#d4a03a; }
    body{background:linear-gradient(160deg,var(--fond-dore),var(--fond-dore-clair));color:var(--texte);min-height:100vh}
    .entete{background:rgba(15,23,42,0.85);border-bottom:2px solid var(--bord-orange);padding:1.5rem 0}
    .carte{position:relative;background:rgba(15,23,42,0.9);border-radius:16px;overflow:hidden;padding:1.5rem;margin-bottom:1.5rem}
    .carte::before{content:'';position:absolute;inset:-3px;background:conic-gradient(from 0deg,var(--bord-orange),var(--fond-dore),var(--bord-orange));animation:tourne 3s linear infinite;z-index:-1}
    @keyframes tourne{to{transform:rotate(360deg)}}
    .barre-langue{display:flex;gap:0.75rem;justify-content:center;margin-bottom:2rem}
    .form-control,.form-select{background:rgba(30,41,59,0.9);border:1px solid #475569;color:white}
    .form-control:focus,.form-select:focus{background:rgba(30,41,59,0.95);color:white;border-color:var(--bord-orange)}
    [dir="rtl"]{font-family:'Segoe UI Tahoma',sans-serif}
  </style>
</head>
<body>
<script>
if(!localStorage.getItem('token') || localStorage.getItem('role')!=='admin'){alert("⛔ Accès réservé Admin");location.href='dashboard.html'}
const token = localStorage.getItem('token');
</script>

<div class="entete">
  <div class="container d-flex justify-content-between align-items-center">
    <div><h3 class="mb-1">📚 Gestion des Matières</h3></div>
    <a href="dashboard.html" class="btn btn-outline-light"><i class="bi bi-arrow-left"></i> Retour</a>
  </div>
</div>

<div class="container py-4">
  <div class="barre-langue">
    <button class="btn btn-outline-warning active" onclick="changerLangue('fr')">🇫🇷</button>
    <button class="btn btn-outline-warning" onclick="changerLangue('ar')">🇸🇦</button>
    <button class="btn btn-outline-warning" onclick="changerLangue('en')">🇬🇧</button>
  </div>

  <!-- FORMULAIRE AJOUT/MODIF -->
  <div class="carte mb-4">
    <h5 id="titre-form">➕ Ajouter une Matière</h5>
    <form id="formMatiere">
      <input type="hidden" id="id_matiere">
      <div class="row g-3">
        <div class="col-md-5">
          <label class="form-label">Nom de la matière</label>
          <input type="text" id="nom_matiere" class="form-control" required>
        </div>
        <div class="col-md-3">
          <label class="form-label">Coefficient</label>
          <input type="number" id="coefficient" class="form-control" min="1" value="1" required>
        </div>
        <div class="col-md-4 align-self-end">
          <button type="submit" class="btn btn-success w-100">💾 Enregistrer</button>
        </div>
      </div>
    </form>
  </div>

  <!-- LISTE DES MATIERES -->
  <div class="carte">
    <h5>📋 Liste des matières</h5>
    <div class="table-responsive mt-3">
      <table class="table table-dark table-striped">
        <thead><tr><th>#</th><th>Matière</th><th>Coeff</th><th>Actions</th></tr></thead>
        <tbody id="liste-matieres"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
let langueActuelle='fr';
function changerLangue(l){langueActuelle=l;document.documentElement.lang=l;document.body.dir=l==='ar'?'rtl':'ltr';charger()}

async function charger(){
  const r = await fetch('/api/matieres',{headers:{Authorization:`Bearer ${token}`}}).then(x=>x.json());
  document.getElementById('liste-matieres').innerHTML=r.lignes.map((m,i)=>`
    <tr>
      <td>${i+1}</td>
      <td>${m.nom_matiere}</td>
      <td class="text-warning">${m.coefficient}</td>
      <td>
        <button class="btn btn-sm btn-outline-warning me-1" onclick="modifier(${JSON.stringify(m).replace(/"/g,'&quot;')})"><i class="bi bi-pencil"></i></button>
        <button class="btn btn-sm btn-outline-danger" onclick="supprimer(${m.id_matiere})"><i class="bi bi-trash"></i></button>
      </td>
    </tr>`).join('');
}

function modifier(m){
  document.getElementById('id_matiere').value=m.id_matiere;
  document.getElementById('nom_matiere').value=m.nom_matiere;
  document.getElementById('coefficient').value=m.coefficient;
  document.getElementById('titre-form').textContent='✏️ Modifier la Matière';
}

async function supprimer(id){
  if(!confirm("Supprimer cette matière ?")) return;
  await fetch(`/api/matieres/${id}`,{method:'DELETE',headers:{Authorization:`Bearer ${token}`}});
  charger();
}

document.getElementById('formMatiere').addEventListener('submit',async e=>{
  e.preventDefault();
  const id = document.getElementById('id_matiere').value;
  const data = {
    nom_matiere:document.getElementById('nom_matiere').value,
    coefficient:document.getElementById('coefficient').value
  };
  const methode = id ? 'PUT' : 'POST';
  const url = id ? `/api/matieres/${id}` : '/api/matieres/ajouter';
  await fetch(url,{method:methode,headers:{'Content-Type':'application/json',Authorization:`Bearer ${token}`},body:JSON.stringify(data)});
  document.getElementById('formMatiere').reset();
  document.getElementById('id_matiere').value='';
  document.getElementById('titre-form').textContent='➕ Ajouter une Matière';
  charger();
});

charger();
</script>
</body>
</html>
