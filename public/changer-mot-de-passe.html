<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Changer mon mot de passe — MAMA-ZOUMANA</title>

  <!-- URLs vérifiées et harmonisées -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    :root { 
      --accent: #f59e0b; 
      --sombre: #0f172a;
      --fond-cardre: rgba(15, 23, 42, 0.92);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, var(--sombre), #1e293b);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .cadre {
      position: relative;
      background: var(--fond-cardre);
      border-radius: 20px;
      padding: 40px 30px;
      max-width: 480px;
      width: 100%;
      color: #f8fafc;
    }

    .cadre::before {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 22px;
      background: conic-gradient(transparent, #f59e0b, #fbbf24, #f97316, #f59e0b, transparent 30%);
      animation: tourne 3.5s linear infinite;
      z-index: -1;
    }

    @keyframes tourne {
      100% { transform: rotate(360deg); }
    }

    .cadre h2 {
      color: var(--accent);
      text-align: center;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .cadre > p {
      color: #cbd5e1;
      text-align: center;
      margin-bottom: 30px;
    }

    .form-label {
      color: #e2e8f0;
      font-weight: 500;
    }

    .form-control {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(245, 158, 11, 0.25);
      color: #fff;
      border-radius: 10px;
      padding: 12px 15px;
      transition: all 0.3s ease;
    }

    .form-control:focus {
      background: rgba(30, 41, 59, 0.9);
      border-color: var(--accent);
      box-shadow: 0 0 0 0.25rem rgba(245, 158, 11, 0.25);
      color: #fff;
      outline: none;
    }

    .form-control::placeholder {
      color: #64748b;
    }

    .btn {
      background: linear-gradient(135deg, #f59e0b, #f97316);
      border: none;
      color: #000;
      font-weight: 700;
      padding: 12px;
      border-radius: 10px;
      width: 100%;
      transition: all 0.3s ease;
    }

    .btn:hover {
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      color: #000;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.35);
    }

    .btn-retour {
      background: transparent;
      border: 1px solid #64748b;
      color: #94a3b8;
      margin-top: 12px;
      font-weight: 500;
    }

    .btn-retour:hover {
      border-color: #cbd5e1;
      color: #e2e8f0;
      background: rgba(148, 163, 184, 0.1);
      transform: none;
    }

    .indicateur {
      height: 4px;
      border-radius: 2px;
      margin-top: 8px;
      transition: all 0.3s ease;
    }

    .faible { background: #ef4444; width: 30%; }
    .moyen { background: #f59e0b; width: 65%; }
    .fort  { background: #22c55e; width: 100%; }

    .texte-indicateur {
      font-size: 0.85rem;
      margin-top: 5px;
      display: block;
    }
  </style>
</head>
<body>

<!-- 🔒 Vérification de connexion -->
<script>
if (!localStorage.getItem('token') || !localStorage.getItem('id_utilisateur')) {
  alert("⛔ Connectez-vous d'abord !");
  location.href = 'connexion.html';
}
</script>

<div class="cadre">
  <h2>🔐 Changer mon mot de passe</h2>
  <p>Saisissez votre ancien mot de passe, puis choisissez-en un nouveau.</p>

  <form id="form">
    <div class="mb-3">
      <label class="form-label">🔑 Mot de passe actuel</label>
      <input type="password" id="ancienMdp" class="form-control" placeholder="••••••••" required>
    </div>

    <div class="mb-3">
      <label class="form-label">🆕 Nouveau mot de passe</label>
      <input type="password" id="nouveauMdp" class="form-control" placeholder="Au moins 6 caractères" oninput="verifierForce()" required>
      <div id="indicateurForce" class="indicateur"></div>
      <small id="texteForce" class="texte-indicateur text-muted">Au moins 6 caractères</small>
    </div>

    <div class="mb-4">
      <label class="form-label">✅ Confirmer le nouveau mot de passe</label>
      <input type="password" id="confirmerMdp" class="form-control" placeholder="Confirmez le mot de passe" required>
    </div>

    <button type="submit" class="btn">💾 Enregistrer le nouveau mot de passe</button>
    <button type="button" class="btn btn-retour" onclick="history.back()">← Retour sans changer</button>
  </form>
</div>

<script>
// 📊 Indicateur de force du mot de passe
function verifierForce() {
  const mdp = document.getElementById('nouveauMdp').value;
  const indicateur = document.getElementById('indicateurForce');
  const texte = document.getElementById('texteForce');

  if (mdp.length < 6) {
    indicateur.className = 'indicateur faible';
    texte.textContent = "❌ Trop court (6 caractères minimum)";
    texte.style.color = '#ef4444';
  } else if (mdp.length < 10) {
    indicateur.className = 'indicateur moyen';
    texte.textContent = "⚠️ Moyen — ajoutez des lettres ou chiffres";
    texte.style.color = '#f59e0b';
  } else {
    indicateur.className = 'indicateur fort';
    texte.textContent = "✅ Mot de passe très sécurisé !";
    texte.style.color = '#22c55e';
  }
}

// ✉️ Soumission du formulaire
document.getElementById('form').addEventListener('submit', async e => {
  e.preventDefault();

  const ancienMdp = document.getElementById('ancienMdp').value.trim();
  const nouveauMdp = document.getElementById('nouveauMdp').value.trim();
  const confirmerMdp = document.getElementById('confirmerMdp').value.trim();
  const idUser = localStorage.getItem('id_utilisateur');

  // ✅ Vérifications
  if (nouveauMdp.length < 6) {
    alert("⚠️ Le nouveau mot de passe doit contenir au moins 6 caractères !");
    return;
  }
  if (nouveauMdp !== confirmerMdp) {
    alert("❌ Les nouveaux mots de passe ne correspondent pas !");
    return;
  }
  if (ancienMdp === nouveauMdp) {
    alert("⚠️ Le nouveau mot de passe doit être différent de l'ancien !");
    return;
  }

  try {
    const res = await fetch('/api/auth/changer-mot-de-passe', {
      method: 'POST',
      headers: { 
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${localStorage.getItem('token')}`
      },
      body: JSON.stringify({ 
        id_utilisateur: idUser,
        ancien_mot_de_passe: ancienMdp, 
        nouveau_mot_de_passe: nouveauMdp 
      })
    });

    const data = await res.json();

    if (data.ok) {
      alert("✅ Mot de passe changé avec succès !\n\nVous pouvez maintenant vous connecter avec votre nouveau mot de passe.");
      // Déconnexion pour nouvelle connexion
      localStorage.removeItem('token');
      localStorage.removeItem('id_utilisateur');
      localStorage.removeItem('role');
      location.href = 'connexion.html';
    } else {
      alert("❌ " + (data.erreur || "Erreur lors du changement de mot de passe."));
    }
  } catch (err) {
    alert("❌ Erreur serveur — vérifiez votre connexion internet.");
  }
});
</script>

</body>
</html>
