<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vérification Code — MAMA-ZOUMANA</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    :root {
      --primaire: #0c4a6e;
      --secondaire: #0369a1;
      --accent: #f59e0b;
      --clair: #f8fafc;
      --sombre: #0f172a;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, var(--sombre), #1e293b);
      display: flex; align-items: center; justify-content: center;
      padding: 20px; font-family: 'Segoe UI', sans-serif;
    }

    /* 🎇 CADRE LUMINEUX IDENTIQUE */
    .cadre-lumineux {
      position: relative;
      background: rgba(15, 23, 42, 0.9);
      border-radius: 20px;
      padding: 40px 30px;
      max-width: 460px; width: 100%;
      overflow: hidden;
      box-shadow: 0 0 25px rgba(245, 158, 11, 0.15);
    }

    .cadre-lumineux::before {
      content: '';
      position: absolute;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background: conic-gradient(
        transparent,
        #f59e0b,
        #fbbf24,
        #f59e0b,
        transparent 30%
      );
      animation: rotation-bord 3.5s linear infinite;
    }

    .cadre-lumineux::after {
      content: '';
      position: absolute;
      inset: 3px;
      background: rgba(15, 23, 42, 0.98);
      border-radius: 18px;
      z-index: 1;
    }

    @keyframes rotation-bord {
      100% { transform: rotate(360deg); }
    }

    .contenu-form { position: relative; z-index: 2; }
    .titre-form { color: var(--accent); font-weight: 700; text-align: center; margin-bottom: 20px; }
    .sous-titre { color: #cbd5e1; text-align: center; margin-bottom: 30px; font-size: 0.95rem; }

    .form-control {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(245, 158, 11, 0.25);
      color: white;
      border-radius: 10px;
      padding: 12px 14px;
      text-align: center;
      font-size: 1.2rem;
      letter-spacing: 8px;
      font-weight: 600;
      transition: all 0.3s ease;
    }
    .form-control:focus {
      background: rgba(30, 41, 59, 0.9);
      border-color: var(--accent);
      box-shadow: 0 0 0 0.25rem rgba(245, 158, 11, 0.25);
      color: white;
    }

    .btn-envoi {
      width: 100%;
      background: linear-gradient(135deg, var(--accent), #f97316);
      border: none;
      color: var(--sombre);
      font-weight: 700;
      padding: 12px;
      border-radius: 10px;
      margin-top: 10px;
      position: relative;
      overflow: hidden;
      transition: transform 0.2s ease;
    }
    .btn-envoi:hover { transform: translateY(-2px); }
    .btn-envoi::after {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      animation: reflet-bouton 2.5s ease-in-out infinite;
    }
    @keyframes reflet-bouton {
      0% { left: -100%; }
      100% { left: 100%; }
    }

    .lien-reno { color: var(--accent); text-decoration: none; font-size: 0.9rem; display: block; text-align: center; margin-top: 15px; }
    .lien-reno:hover { color: #fbbf24; }
  </style>
</head>
<body>

<div class="cadre-lumineux">
  <div class="contenu-form">
    <h3 class="titre-form"><i class="bi bi-shield-lock"></i> VÉRIFICATION COMPTE</h3>
    <p class="sous-titre">Entrez le code à 6 chiffres reçu par email</p>

    <form id="form-verif">
      <input type="text" id="code" class="form-control" maxlength="6" placeholder="0 0 0 0 0 0" required inputmode="numeric">
      <button type="submit" class="btn-envoi mt-4">
        <i class="bi bi-check-circle"></i> VALIDER MON COMPTE
      </button>
      <a href="#" class="lien-reno" id="renvoyer">Renvoyer le code</a>
    </form>
  </div>
</div>

<script>
document.getElementById('form-verif').addEventListener('submit', async e => {
  e.preventDefault();
  const code = document.getElementById('code').value.trim();
  
  try {
    const res = await fetch('/api/inscription/verifier', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ code })
    });
    const data = await res.json();
    if (data.ok) {
      alert('✅ Compte vérifié — En attente validation admin');
      window.location.href = 'connexion.html';
    } else {
      alert('❌ Code incorrect ou expiré');
    }
  } catch {
    alert('❌ Erreur de connexion');
  }
});
</script>

</body>
</html>
