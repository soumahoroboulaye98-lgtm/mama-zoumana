<!DOCTYPE html>
<html lang="fr" class="lang-fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="classementGeneral">Classement Général</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    :root {
      --primaire: #0c4a6e;
      --succes: #10b981;
    }
    .groupe-classe td { background: rgba(12,74,110,0.08); font-weight: 600; }
    tr:hover { transition: background 0.2s ease; }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark" style="background: linear-gradient(90deg, #0f172a, #10b981);">
  <div class="container">
    <a class="navbar-brand" href="index.html">🏠 MAMA-ZOUMANA</a>
    <div class="d-flex align-items-center gap-2">
      <select id="selecteurLangue" class="form-select form-select-sm" onchange="changerLangue(this.value)">
        <option value="fr">🇫🇷 Français</option>
        <option value="en">🇬🇧 English</option>
        <option value="ar">🇸🇦 العربية</option>
      </select>
    </div>
  </div>
</nav>

<div class="container py-4">
  <h2 class="text-center mb-4">📊 <span data-i18n="classementGeneral">Classement Général des Élèves</span></h2>

  <div class="alert alert-success text-center mb-4 shadow-sm">
    <strong data-i18n="totalEleves">Total Élèves</strong> : <span id="totalEleves">0</span>
  </div>

  <div class="card shadow-sm">
    <div class="card-header text-white fw-bold" style="background: #212529;">
      📋 <span data-i18n="listeComplete">Liste complète</span>
    </div>
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-striped table-hover mb-0">
          <thead class="table-dark">
            <tr>
              <th width="60">#</th>
              <th data-i18n="classe">Classe</th>
              <th data-i18n="matricule">Matricule</th>
              <th data-i18n="nomPrenoms">Nom & Prénoms</th>
              <th data-i18n="contact">Contact</th>
            </tr>
          </thead>
          <tbody id="corpsClassement">
            <tr>
              <td colspan="5" class="text-center text-muted py-4">
                <div class="spinner-border text-success"></div>
                <p class="mt-2 mb-0" data-i18n="chargement">Chargement...</p>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="mt-4 text-center">
    <a href="classe-emploi.html" class="btn btn-primary">
      ↩️ <span data-i18n="retour">Retour par Classe</span>
    </a>
  </div>
</div>

<script>
  // ==================================================
  // ✅ CONFIGURATION API — PLUS DE CONFIG EXTERNE
  // ==================================================
  const API_BASE = "https://mama-zoumana.onrender.com/api";
  const API = `${API_BASE}/classe-emploi`;
  let langueActuelle = localStorage.getItem('langue') || 'fr';

  // ==================================================
  // ✅ TRADUCTIONS INTÉGRÉES
  // ==================================================
  const traductions = {
    fr: {
      classementGeneral: "Classement Général des Élèves",
      totalEleves: "Total Élèves",
      listeComplete: "Liste complète",
      chargement: "Chargement...",
      aucuneDonnee: "Aucune donnée trouvée",
      erreurChargement: "Erreur lors du chargement",
      retour: "Retour par Classe",
      classe: "Classe",
      matricule: "Matricule",
      nomPrenoms: "Nom & Prénoms",
      contact: "Contact",
      niveau: "Niveau"
    },
    en: {
      classementGeneral: "General Student Ranking",
      totalEleves: "Total Students",
      listeComplete: "Complete List",
      chargement: "Loading...",
      aucuneDonnee: "No data found",
      erreurChargement: "Loading error",
      retour: "Back by Class",
      classe: "Class",
      matricule: "Student ID",
      nomPrenoms: "Full Name",
      contact: "Contact",
      niveau: "Level"
    },
    ar: {
      classementGeneral: "الترتيب العام للتلاميذ",
      totalEleves: "إجمالي التلاميذ",
      listeComplete: "القائمة الكاملة",
      chargement: "جارٍ التحميل...",
      aucuneDonnee: "لا توجد بيانات",
      erreurChargement: "خطأ في التحميل",
      retour: "العودة حسب الفصل",
      classe: "الفصل",
      matricule: "المعرف",
      nomPrenoms: "الاسم الكامل",
      contact: "الاتصال",
      niveau: "المستوى"
    }
  };

  // ==================================================
  // ✅ GESTION DE LA LANGUE
  // ==================================================
  function changerLangue(lang) {
    langueActuelle = lang;
    localStorage.setItem('langue', lang);
    document.documentElement.lang = lang;
    document.documentElement.classList.remove('lang-fr','lang-en','lang-ar');
    document.documentElement.classList.add(`lang-${lang}`);
    document.body.style.direction = lang === 'ar' ? 'rtl' : 'ltr';
    appliquerTraductions();
  }

  function appliquerTraductions() {
    const t = traductions[langueActuelle];
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const cle = el.getAttribute('data-i18n');
      if (t[cle]) el.textContent = t[cle];
    });
  }

  // ==================================================
  // ✅ REQUÊTE API SÉCURE
  // ==================================================
  async function requeteAPI(url) {
    try {
      const reponse = await fetch(url, { signal: AbortSignal.timeout(12000) });
      if (!reponse.ok) throw new Error(`Erreur ${reponse.status}`);
      return await reponse.json();
    } catch (err) {
      console.warn("❌", url, err.message);
      return { ok: false, erreur: err.message };
    }
  }

  // ==================================================
  // ✅ CHARGER CLASSEMENT GÉNÉRAL
  // ==================================================
  async function chargerClassement() {
    const t = traductions[langueActuelle];
    const corps = document.getElementById('corpsClassement');
    const totalAff = document.getElementById('totalEleves');

    const data = await requeteAPI(`${API}/classement-general`);

    if (data.ok && Array.isArray(data.classement)) {
      totalAff.textContent = data.total_eleves || data.classement.length;
      let html = '';
      let numero = 1;
      let derniereClasse = '';

      data.classement.forEach(e => {
        const classe = e.libelle_classe || e.classe || '';
        const nom = e.nom || e.nom_eleve || '';
        const prenoms = e.prenoms || e.prenom || '';
        const contact = e.telephone || e.email || e.contact || '-';

        // En-tête de groupe par classe
        if (classe !== derniereClasse) {
          derniereClasse = classe;
          html += `<tr class="groupe-classe"><td colspan="5">📚 ${classe}</td></tr>`;
        }

        html += `<tr>
          <td>${numero}</td>
          <td>${classe}</td>
          <td><code>${e.matricule || '-'}</code></td>
          <td>${nom} ${prenoms}</td>
          <td>${contact}</td>
        </tr>`;
        numero++;
      });

      corps.innerHTML = html || `<tr><td colspan="5" class="text-center text-muted py-4">${t.aucuneDonnee}</td></tr>`;
    } else {
      corps.innerHTML = `<tr><td colspan="5" class="text-center text-danger py-4">❌ ${data.erreur || t.erreurChargement}</td></tr>`;
      totalAff.textContent = '—';
    }
  }

  // ==================================================
  // ✅ INITIALISATION
  // ==================================================
  document.addEventListener('DOMContentLoaded', async () => {
    document.getElementById('selecteurLangue').value = langueActuelle;
    appliquerTraductions();
    await chargerClassement();
  });
</script>
</body>
</html>
