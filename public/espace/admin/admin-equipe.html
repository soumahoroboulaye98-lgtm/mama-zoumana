<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>
    <span class="lang-fr">Administration — Équipe Pédagogique</span>
    <span class="lang-en">Administration — Teaching Staff</span>
    <span class="lang-ar">الإدارة — الفريق التربوي</span>
  </title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    :root {
      --sombre: #0f172a; --sombre-clair: #1e293b;
      --bord-orange: #f59e0b; --vert: #10b981;
      --rouge: #ef4444; --bleu: #3b82f6;
      --texte: #f8fafc;
    }
    *{margin:0;padding:0;box-sizing:border-box;transition:all 0.2s ease}
    body{background:var(--sombre);color:var(--texte);min-height:100vh;font-family:'Segoe UI',sans-serif;}
    .entete-page{background:var(--sombre-clair);border-bottom:2px solid var(--bord-orange);padding:1.2rem 0}
    .carte{background:var(--sombre-clair);border-radius:12px;border-left:3px solid var(--bord-orange);padding:1.5rem;margin-bottom:1.5rem}
    .form-control,.form-select{background:#0f172a;border:1px solid #334155;color:white;border-radius:8px}
    .form-control:focus,.form-select:focus{background:#0f172a;border-color:var(--bord-orange);color:white;box-shadow:0 0 0 0.25rem rgba(245,158,11,0.25)}
    .btn-valide{background:var(--vert);color:white;border-radius:8px;border:none;padding:0.5rem 1rem;}
    .btn-valide:hover{box-shadow:0 0 15px rgba(16,185,129,0.4);transform:translateY(-1px)}
    .btn-modif{background:var(--bord-orange);color:white;padding:6px 12px;font-size:14px;border-radius:6px;border:none;}
    .btn-modif:hover{background:#d97706;}
    .btn-suppr{background:var(--rouge);color:white;padding:6px 12px;font-size:14px;border-radius:6px;border:none;}
    .btn-suppr:hover{background:#dc2626;}
    .badge-actif{background:rgba(16,185,129,0.15);color:#34d399;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:600;}
    .badge-inactif{background:rgba(148,163,184,0.2);color:#94a3b8;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:600;}
    .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);align-items:center;justify-content:center;z-index:1050}
    .modal.active{display:flex}
    .modal-contenu{background:var(--sombre-clair);padding:1.8rem;border-radius:12px;width:92%;max-width:680px;max-height:92vh;overflow-y:auto;border:1px solid #334155}
    .modal-contenu h2{color:var(--bord-orange);margin-bottom:1.2rem}
    .ligne{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .actions{display:flex;justify-content:flex-end;gap:10px;margin-top:1rem}
    .btn-fermer{background:#475569;color:white;border-radius:6px;border:none;padding:0.5rem 1rem;}
    .btn-enregistrer{background:var(--bleu);color:white;border-radius:6px;border:none;padding:0.5rem 1rem;}
    .btn-enregistrer:hover{background:#2563eb;color:white}
    .message{margin-top:1rem;padding:0.75rem;border-radius:6px;display:none}
    .message.succes{background:rgba(16,185,129,0.1);color:#34d399;display:block}
    .message.erreur{background:rgba(239,68,68,0.1);color:#fca5a5;display:block}
    .alerte-api{border-left:3px solid var(--rouge);background:rgba(239,68,68,0.1);border-radius:8px;padding:0.75rem 1rem;margin-bottom:1rem;}
    .btn-langue.active{background:var(--bord-orange);color:#000;border-color:var(--bord-orange);font-weight:bold;}
    .info-ligne{color:#cbd5e1;font-size:14px;margin:4px 0}
    .photo-mini{width:48px;height:48px;border-radius:50%;object-fit:cover;border:2px solid var(--bord-orange);margin-right:12px}

    /* 🗣️ GESTION DES LANGUES */
    .lang-en, .lang-ar { display: none; }
    body.lang-fr .lang-fr { display: inline; }
    body.lang-en { direction: ltr; }
    body.lang-en .lang-fr, body.lang-en .lang-ar { display: none; }
    body.lang-en .lang-en { display: inline; }
    body.lang-ar { direction: rtl; }
    body.lang-ar .lang-fr, body.lang-ar .lang-en { display: none; }
    body.lang-ar .lang-ar { display: inline; }
  </style>
</head>
<body class="lang-fr">

<!-- 📌 EN-TÊTE -->

<!-- 📝 MODAL FORMULAIRE -->
<div class="modal" id="formModal">
  <div class="modal-contenu">
    <h2 id="titreForm">...</h2>
    <form id="formMembre">
      <input type="hidden" id="id">
      <div class="ligne">
        <input type="text" id="nom" class="form-control" placeholder="Nom *" required>
        <input type="text" id="prenoms" class="form-control" placeholder="Prénoms *" required>
      </div>
      <div class="ligne">
        <input type="text" id="poste_fr" class="form-control" placeholder="Poste (FR) *" required>
        <input type="text" id="poste_en" class="form-control" placeholder="Poste (EN)">
      </div>
      <input type="text" id="poste_ar" class="form-control" placeholder="Poste (AR)">
      <div class="ligne">
        <input type="text" id="matiere_fr" class="form-control" placeholder="Matière (FR)">
        <input type="text" id="matiere_en" class="form-control" placeholder="Matière (EN)">
      </div>
      <input type="text" id="matiere_ar" class="form-control" placeholder="Matière (AR)">
      <textarea id="presentation_fr" class="form-control" rows="3" placeholder="Présentation (FR)"></textarea>
      <textarea id="presentation_en" class="form-control" rows="3" placeholder="Présentation (EN)"></textarea>
      <textarea id="presentation_ar" class="form-control" rows="3" placeholder="Présentation (AR)"></textarea>
      <div class="ligne">
        <input type="text" id="photo_url" class="form-control" placeholder="URL Photo">
        <input type="email" id="email" class="form-control" placeholder="Email">
      </div>
      <div class="ligne align-items-center">
        <input type="number" id="ordre" class="form-control" placeholder="Ordre" value="1">
        <label style="display:flex;align-items:center;gap:8px;margin-bottom:0;color:var(--texte)">
          <input type="checkbox" id="est_actif" checked>
          <span class="lang-fr"> Actif</span>
          <span class="lang-en"> Active</span>
          <span class="lang-ar"> نشط</span>
        </label>
      </div>
      <div class="actions">
        <button type="button" class="btn-fermer" onclick="fermerFormulaire()">
          <span class="lang-fr">Annuler</span>
          <span class="lang-en">Cancel</span>
          <span class="lang-ar">إلغاء</span>
        </button>
        <button type="submit" class="btn-enregistrer">
          <span class="lang-fr">Enregistrer</span>
          <span class="lang-en">Save</span>
          <span class="lang-ar">حفظ</span>
        </button>
      </div>
      <div class="message" id="message"></div>
    </form>
  </div>
</div>

<script>
let listeMembres = [];

// 📡 ALERTE MODE LOCAL
function basculerModeLocal(actif) {
  modeLocal = actif;
  const alerte = document.getElementById('alerteApi');
  document.getElementById('texteAlerteApi').textContent = m('serveurIndispo');
  alerte.classList.toggle('d-none', !actif);
}

// 🗣️ CHANGEMENT DE LANGUE
function changerLangue(nouvelleLangue) {
  langue = nouvelleLangue;
  localStorage.setItem('langue', langue);
  document.body.classList.remove('lang-fr','lang-en','lang-ar');
  document.body.classList.add('lang-' + langue);
  document.querySelectorAll('.btn-langue').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + langue).classList.add('active');
  afficherListe();
}

// 📋 CHARGER LA LISTE
async function chargerListe(forcerLocal = false) {
  let liste = [];
  if (!forcerLocal) {
    try {
      const res = await fetch(`${API_URL}/liste?tout=1`, { headers:{'Authorization':`Bearer ${token}`} });
      if (!res.ok) throw new Error();
      const data = await res.json();
      liste = data.membres || [];
      sauvegarderMembresLocaux(liste);
      basculerModeLocal(false);
    } catch {
      forcerLocal = true;
    }
  }
  if (forcerLocal) {
    basculerModeLocal(true);
    liste = obtenirMembresLocaux();
  }
  listeMembres = liste;
  document.getElementById('compteur').textContent = liste.length;
  afficherListe();
}

// 🖥️ AFFICHER LA LISTE
function afficherListe() {
  const conteneur = document.getElementById('liste');
  if (!listeMembres.length) {
    conteneur.innerHTML = `<div class="carte text-center py-4 text-muted">${m('aucunMembre')}</div>`;
    return;
  }
  conteneur.innerHTML = '';
  listeMembres.sort((a,b) => a.ordre - b.ordre).forEach(m => {
    const photo = m.photo_url ? `<img src="${m.photo_url}" alt="" class="photo-mini" onerror="this.style.display='none'">` : '';
    const statut = m.est_actif ? `<span class="badge-actif">${m('oui')}</span>` : `<span class="badge-inactif">${m('non')}</span>`;
    conteneur.innerHTML += `
      <div class="carte">
        <div class="d-flex align-items-start">
          ${photo}
          <div style="flex:1">
            <h5 class="fw-bold mb-1">${m.prenoms || ''} ${m.nom || ''} ${statut}</h5>
            <div class="info-ligne"><strong>${m('poste')} :</strong> ${m.poste_fr || ''}</div>
            ${m.matiere_fr ? `<div class="info-ligne"><strong>${m('matiere')} :</strong> ${m.matiere_fr}</div>` : ''}
            ${m.email ? `<div class="info-ligne"><i class="bi bi-envelope me-1"></i> ${m.email}</div>` : ''}
            <div class="info-ligne text-muted small">Ordre : ${m.ordre || 1}</div>
          </div>
        </div>
        <div class="mt-3">
          <button class="btn-modif" onclick="modifier(${m.id})">✏️ ${m('modifierBtn')}</button>
          <button class="btn-suppr" onclick="supprimer(${m.id})">🗑️ ${m('supprimerBtn')}</button>
        </div>
      </div>`;
  });
}

// 📝 OUVRIR FORMULAIRE
function ouvrirFormulaire() {
  document.getElementById('formMembre').reset();
  document.getElementById('id').value = '';
  document.getElementById('titreForm').textContent = m('ajouterTitre');
  document.getElementById('est_actif').checked = true;
  document.getElementById('formModal').classList.add('active');
}

// ✏️ MODIFIER MEMBRE
function modifier(id) {
  const m = listeMembres.find(x => Number(x.id) === Number(id));
  if(!m) return;
  ['id','nom','prenoms','poste_fr','poste_en','poste_ar','matiere_fr','matiere_en','matiere_ar','presentation_fr','presentation_en','presentation_ar','photo_url','email','ordre'].forEach(k => {
    const el = document.getElementById(k);
    if(el) el.value = m[k] || '';
  });
  document.getElementById('est_actif').checked = Boolean(m.est_actif);
  document.getElementById('titreForm').textContent = m('modifierTitre');
  document.getElementById('formModal').classList.add('active');
}

// ❌ FERMER FORMULAIRE
function fermerFormulaire() {
  document.getElementById('formModal').classList.remove('active');
  document.getElementById('message').className = 'message';
  document.getElementById('message').textContent = '';
}

// 💾 ENREGISTRER MEMBRE
document.getElementById('formMembre').addEventListener('submit', async e => {
  e.preventDefault();
  const id = document.getElementById('id').value;
  const donnees = {
    nom: document.getElementById('nom').value,
    prenoms: document.getElementById('prenoms').value,
    poste_fr: document.getElementById('poste_fr').value,
    poste_en: document.getElementById('poste_en').value,
    poste_ar: document.getElementById('poste_ar').value,
    matiere_fr: document.getElementById('matiere_fr').value,
    matiere_en: document.getElementById('matiere_en').value,
    matiere_ar: document.getElementById('matiere_ar').value,
    presentation_fr: document.getElementById('presentation_fr').value,
    presentation_en: document.getElementById('presentation_en').value,
    presentation_ar: document.getElementById('presentation_ar').value,
    photo_url: document.getElementById('photo_url').value,
    email: document.getElementById('email').value,
    ordre: parseInt(document.getElementById('ordre').value) || 1,
    est_actif: document.getElementById('est_actif').checked
  };

  const msg = document.getElementById('message');
  try {
    const url = id ? `${API_URL}/${id}` : `${API_URL}/ajouter`;
    const methode = id ? 'PUT' : 'POST';
    const res = await fetch(url, {
      method: methode,
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
      body: JSON.stringify(donnees)
    });
    const rep = await res.json();
    if (rep.ok) {
      msg.className = 'message succes';
      msg.textContent = id ? m('modifierOk') : m('ajouterOk');
      await chargerListe();
      setTimeout(fermerFormulaire, 1200);
    } else {
      throw new Error(rep.erreur || 'Erreur serveur');
    }
  } catch (err) {
    // 📴 Mode local
    let liste = obtenirMembresLocaux();
    donnees.id = id ? Number(id) : Date.now();
    if (id) {
      liste = liste.map(m => Number(m.id) === Number(id) ? {...m, ...donnees} : m);
    } else {
      liste.push(donnees);
    }
    sauvegarderMembresLocaux(liste);
    listeMembres = liste;
    basculerModeLocal(true);
    msg.className = 'message succes';
    msg.textContent = (id ? m('modifierOk') : m('ajouterOk')) + " (local)";
    afficherListe();
    setTimeout(fermerFormulaire, 1200);
  }
});

// 🗑️ SUPPRIMER MEMBRE
async function supprimer(id) {
  if (!confirm(m('confirmerSuppr'))) return;
  try {
    const res = await fetch(`${API_URL}/${id}`, { method: 'DELETE', headers:{'Authorization':`Bearer ${token}`} });
    const rep = await res.json();
    if (rep.ok) {
      await chargerListe();
      alert(m('supprOk'));
    } else {
      throw new Error(rep.erreur);
    }
  } catch {
    let liste = obtenirMembresLocaux().filter(m => Number(m.id) !== Number(id));
    sauvegarderMembresLocaux(liste);
    listeMembres = liste;
    basculerModeLocal(true);
    afficherListe();
    alert(m('supprOk') + " (local)");
  }
}

// 🚀 INITIALISATION
window.onload = async function() {
  document.querySelectorAll('.btn-langue').forEach(b => b.classList.toggle('active', b.id === 'btn-' + langue));
  await chargerListe();
};
</script>
