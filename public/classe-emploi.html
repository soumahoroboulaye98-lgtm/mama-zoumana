<!DOCTYPE html>
<html lang="fr" class="lang-fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="consultationClasse">Classement & Emploi du Temps</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    .jour-lundi { background: #e3f2fd; }
    .jour-mardi { background: #e8f5e9; }
    .jour-mercredi { background: #fff3e0; }
    .jour-jeudi { background: #f3e5f5; }
    .jour-vendredi { background: #ffebee; }
    .jour-samedi { background: #f5f5f5; }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand" href="index.html">🏠 MAMA-ZOUMANA</a>
    <select id="selecteurLangue" class="form-select form-select-sm w-auto ms-auto" onchange="changerLangue(this.value)">
      <option value="fr">🇫🇷 Français</option>
      <option value="en">🇬🇧 English</option>
      <option value="ar">🇸🇦 العربية</option>
    </select>
  </div>
</nav>

<div class="container py-4">
  <h2 class="text-center mb-4">📚 <span data-i18n="consultationClasse">Consultation Classe & Élèves</span></h2>

  <div class="alert alert-primary text-center">
    <a href="classement-general.html" class="btn btn-primary btn-lg">📊 <span data-i18n="classementGeneral">Classement Général</span></a>
    <a href="classement-notes.html" class="btn btn-success btn-lg ms-2">🏅 <span data-i18n="voirClassementNotes">Classement par Notes</span></a>
  </div>

  <div class="card mb-4">
    <div class="card-body">
      <label class="form-label fw-bold" data-i18n="choisirClasse">Sélectionnez une classe :</label>
      <select id="choixClasse" class="form-select form-select-lg" onchange="chargerDonnees()">
        <option value="" data-i18n="choisirClasse">-- Choisir une classe --</option>
      </select>
    </div>
  </div>

  <div id="infosClasse" class="alert alert-info d-none"></div>

  <div class="card mb-4">
    <div class="card-header bg-success text-white fw-bold">📋 <span data-i18n="listeEleves">Liste des Élèves</span></div>
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-striped table-hover mb-0">
          <thead class="table-dark">
            <tr>
              <th>#</th>
              <th data-i18n="matricule">Matricule</th>
              <th data-i18n="nomPrenoms">Nom & Prénoms</th>
              <th data-i18n="contact">Contact</th>
            </tr>
          </thead>
          <tbody id="corpsClassement">
            <tr><td colspan="4" class="text-center text-muted py-3" data-i18n="choisirClasse">Choisissez une classe...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-header bg-primary text-white fw-bold">🕒 <span data-i18n="emploiTempsGeneral">Emploi du Temps Général</span></div>
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-bordered mb-0">
          <thead class="table-dark">
            <tr>
              <th data-i18n="jour">Jour</th>
              <th data-i18n="horaires">Horaire</th>
              <th data-i18n="matiere">Matière</th>
              <th data-i18n="professeur">Professeur</th>
            </tr>
          </thead>
          <tbody id="corpsEmploi">
            <tr><td colspan="4" class="text-center text-muted py-3" data-i18n="choisirClasse">Choisissez une classe...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="lang-config.js"></script>
<script>
const API_CLASSE = `${API_URL}/classe-emploi`;

window.onload = async () => {
  await chargerClasses();
  document.getElementById('selecteurLangue').value = langueActuelle;
  appliquerTraductions();
};

async function chargerClasses() {
  const res = await fetch(`${API_CLASSE}/liste-classes`);
  const data = await res.json();
  if (data.ok) {
    const sel = document.getElementById('choixClasse');
    sel.innerHTML = `<option value="">-- ${traductions[langueActuelle].choisirClasse} --</option>`;
    data.classes.forEach(c => sel.innerHTML += `<option value="${c.id_classe}">${c.libelle_classe} (${c.niveau})</option>`);
  }
}

async function chargerDonnees() {
  const id = document.getElementById('choixClasse').value;
  const t = traductions[langueActuelle];
  if (!id) {
    document.getElementById('corpsClassement').innerHTML = `<tr><td colspan="4" class="text-center">-- ${t.choisirClasse} --</td></tr>`;
    document.getElementById('corpsEmploi').innerHTML = `<tr><td colspan="4" class="text-center">-- ${t.choisirClasse} --</td></tr>`;
    document.getElementById('infosClasse').classList.add('d-none');
    return;
  }

  document.getElementById('infosClasse').classList.remove('d-none');
  document.getElementById('infosClasse').textContent = t.chargement;

  fetch(`${API_CLASSE}/classement/${id}`).then(r => r.json()).then(data => {
    if (data.ok) {
      document.getElementById('infosClasse').innerHTML = `<strong>${t.classe} :</strong> ${data.classe?.libelle_classe || ''} — <strong>${t.effectif} :</strong> ${data.effectif} ${t.eleve}`;
      let html = '';
      data.classement.forEach((e, i) => {
        html += `<tr><td>${i+1}</td><td><code>${e.matricule}</code></td><td>${e.nom} ${e.prenoms}</td><td>${e.email || e.telephone || '-'}</td></tr>`;
      });
      document.getElementById('corpsClassement').innerHTML = html || `<tr><td colspan="4" class="text-center">${t.aucuneDonnee}</td></tr>`;
    }
  });

  fetch(`${API_CLASSE}/emploi-temps/${id}`).then(r => r.json()).then(data => {
    if (data.ok) {
      const couleurs = {Lundi:'jour-lundi',Mardi:'jour-mardi',Mercredi:'jour-mercredi',Jeudi:'jour-jeudi',Vendredi:'jour-vendredi',Samedi:'jour-samedi'};
      let html = '';
      data.emploi_temps.forEach(e => {
        html += `<tr class="${couleurs[e.jour] || ''}"><td class="fw-bold">${e.jour}</td><td>${e.heure_debut.slice(0,5)} — ${e.heure_fin.slice(0,5)}</td><td>${e.matiere}</td><td>${e.professeur}</td></tr>`;
      });
      document.getElementById('corpsEmploi').innerHTML = html || `<tr><td colspan="4" class="text-center">${t.aucuneDonnee}</td></tr>`;
    }
  });
}
</script>
</body>
</html>
