<!DOCTYPE html>
<html lang="fr" class="lang-fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>
    <span class="lang-fr">Administration — Équipe Pédagogique</span>
    <span class="lang-en">Administration — Teaching Staff</span>
    <span class="lang-ar">الإدارة — الفريق التربوي</span>
  </title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    :root {
      --fond: #f8fafc;
      --surface: #ffffff;
      --texte: #1e293b;
      --texte-secondaire: #64748b;
      --bord: #e2e8f0;
      --primaire: #0c4a6e;
      --accent: #f59e0b;
      --succes: #10b981;
      --danger: #ef4444;
      --ombre: 0 2px 8px rgba(0,0,0,0.06);
    }
    [data-theme="sombre"] {
      --fond: #0f172a;
      --surface: #1e293b;
      --texte: #f8fafc;
      --texte-secondaire: #94a3b8;
      --bord: #334155;
      --primaire: #38bdf8;
      --accent: #fbbf24;
      --succes: #34d399;
      --danger: #f87171;
      --ombre: 0 2px 12px rgba(0,0,0,0.35);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; transition: all 0.25s ease; }
    body { background: var(--fond); color: var(--texte); min-height: 100vh; font-family:'Segoe UI', sans-serif; }
    .entete-page { background: var(--surface); border-bottom: 3px solid var(--accent); padding: 1.2rem 0; box-shadow: var(--ombre); }
    .carte { background: var(--surface); border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; border-left: 4px solid var(--accent); border: 1px solid var(--bord); box-shadow: var(--ombre); }
    .carte:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,0.08); }
    .form-control, .form-select {
      background: var(--fond); border: 1px solid var(--bord); color: var(--texte); border-radius: 8px;
    }
    .form-control:focus, .form-select:focus {
      background: var(--fond); border-color: var(--accent); color: var(--texte);
      box-shadow: 0 0 0 0.25rem rgba(245,158,11,0.20);
    }
    .btn-valide { background: var(--succes); color: white; border-radius: 8px; border: none; padding: 0.5rem 1rem; }
    .btn-valide:hover { filter: brightness(1.08); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(16,185,129,0.25); }
    .btn-modif { background: var(--accent); color: #000; padding: 6px 12px; font-size: 14px; border-radius: 6px; border: none; }
    .btn-modif:hover { filter: brightness(1.08); }
    .btn-suppr { background: var(--danger); color: white; padding: 6px 12px; font-size: 14px; border-radius: 6px; border: none; }
    .btn-suppr:hover { filter: brightness(1.08); }
    .badge-actif { background: rgba(16,185,129,0.15); color: #34d399; padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: 600; }
    .badge-inactif { background: rgba(148,163,184,0.2); color: #94a3b8; padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: 600; }
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); align-items: center; justify-content: center; z-index: 1050; }
    .modal.active { display: flex; }
    .modal-contenu { background: var(--surface); padding: 1.8rem; border-radius: 12px; width: 92%; max-width: 680px; max-height: 92vh; overflow-y: auto; border: 1px solid var(--bord); box-shadow: var(--ombre); }
    .modal-contenu h2 { color: var(--accent); margin-bottom: 1.2rem; }
    .ligne { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 1rem; }
    .btn-fermer { background: #475569; color: white; border-radius: 6px; border: none; padding: 0.5rem 1rem; }
    .btn-enregistrer { background: var(--primaire); color: white; border-radius: 6px; border: none; padding: 0.5rem 1rem; }
    .btn-enregistrer:hover { filter: brightness(1.08); }
    .message { margin-top: 1rem; padding: 0.75rem; border-radius: 6px; display: none; }
    .message.succes { background: rgba(16,185,129,0.1); color: var(--succes); display: block; }
    .message.erreur { background: rgba(239,68,68,0.1); color: var(--danger); display: block; }
    .alerte-api { border-left: 3px solid var(--danger); background: rgba(239,68,68,0.1); border-radius: 8px; padding: 0.75rem 1rem; margin-bottom: 1rem; }
    .info-ligne { color: var(--texte-secondaire); font-size: 14px; margin: 4px 0; }
    .photo-mini { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent); margin-right: 12px; flex-shrink: 0; }
    .btn-mode { border-radius: 20px; padding: 4px 12px; font-size: 14px; border: 1px solid var(--bord); background: var(--surface); color: var(--texte); }
    .btn-mode:hover { border-color: var(--accent); }
    .lang-en, .lang-ar { display: none; }
    body.lang-fr .lang-fr { display: inline; }
    body.lang-en { direction: ltr; }
    body.lang-en .lang-fr, body.lang-en .lang-ar { display: none; }
    body.lang-en .lang-en { display: inline; }
    body.lang-ar { direction: rtl; }
    body.lang-ar .lang-fr, body.lang-ar .lang-en { display: none; }
    body.lang-ar .lang-ar { display: inline; }
    @media (max-width: 768px) {
      .ligne { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body class="lang-fr" data-theme="clair">

<!-- 🔗 CONFIGURATION API & VARIABLES GLOBALES -->
<script>
  // ✅ Adresse API centralisée
  const API_URL = "https://mama-zoumana-api.onrender.com/api";

  // ✅ Récupération sécurisée
  function getToken() { return localStorage.getItem('token') || ''; }
  function getRole() { return (localStorage.getItem('role') || '').toLowerCase(); }
  let langue = localStorage.getItem('langue') || 'fr';
  let theme = localStorage.getItem('theme') || 'clair';
  let modeLocal = false;

  // ✅ Requête API UNIFIÉE avec gestion 401
  async function requeteAPI(chemin, options = {}) {
    const token = getToken();
    const reponse = await fetch(`${API_URL}${chemin}`, {
      ...options,
      headers: {
        'Content-Type': 'application/json',
        'Authorization': token ? `Bearer ${token}` : '',
        ...options.headers
      }
    });

    // ⚠️ Session expirée → déconnexion
    if (reponse.status === 401) {
      alert("⛔ Session expirée — Veuillez vous reconnecter");
      localStorage.clear();
      window.location.href = 'connexion.html';
      return { ok: false, _deconnexion: true };
    }

    return await reponse.json();
  }

  const token = getToken();
  const role = getRole();
  if (!token || !['admin','super_admin','directeur'].includes(role)) {
    alert(m('accesReserve'));
    localStorage.clear();
    location.href = 'connexion.html';
  }

  // 💾 STOCKAGE LOCAL
  function obtenirMembresLocaux() { return JSON.parse(localStorage.getItem('equipe_membres') || '[]'); }
  function sauvegarderMembresLocaux(liste) { localStorage.setItem('equipe_membres', JSON.stringify(liste)); }

  // ✅ Appliquer langue et thème IMMÉDIATEMENT
  document.body.classList.remove('lang-fr','lang-en','lang-ar');
  document.body.classList.add('lang-' + langue);
  document.documentElement.setAttribute('data-theme', theme);
</script>

<script>
let listeMembres = [];

// 📡 ALERTE MODE LOCAL
function basculerModeLocal(actif) {
  modeLocal = actif;
  const alerte = document.getElementById('alerteApi');
  document.getElementById('texteAlerteApi').textContent = m('serveurIndispo');
  alerte.classList.toggle('d-none', !actif);
}

// 🌙 GESTION THÈME
function appliquerTheme(t) {
  theme = t;
  document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem('theme', t);
  document.getElementById('btn-theme').innerHTML = t === 'clair' 
    ? '<i class="bi bi-moon"></i>' 
    : '<i class="bi bi-sun"></i>';
}
function basculerTheme() { 
  appliquerTheme(theme === 'clair' ? 'sombre' : 'clair'); 
}

// 🗣️ GESTION LANGUE
function appliquerLangue(lg) {
  langue = lg;
  localStorage.setItem('langue', lg);
  document.body.classList.remove('lang-fr','lang-en','lang-ar');
  document.body.classList.add('lang-' + lg);
  document.querySelectorAll('.btn-langue').forEach(b => b.classList.remove('btn-outline-warning', 'bg-warning', 'text-dark', 'fw-bold'));
  document.getElementById('btn-' + lg)?.classList.add('btn-outline-warning', 'bg-warning', 'text-dark', 'fw-bold');
  afficherListe();
}

// 📋 CHARGER LA LISTE
async function chargerListe(forcerLocal = false) {
  let liste = [];
  if (!forcerLocal) {
    try {
      const data = await requeteAPI('/equipe/liste?tout=1');
      if (data._deconnexion) return;
      if (data.ok) {
        liste = Array.isArray(data.membres) ? data.membres : [];
        sauvegarderMembresLocaux(liste);
        basculerModeLocal(false);
      } else {
        throw new Error('Erreur serveur');
      }
    } catch (err) {
      console.warn('Mode local activé :', err.message);
      forcerLocal = true;
    }
  }
  if (forcerLocal) {
    basculerModeLocal(true);
    liste = obtenirMembresLocaux();
  }
  listeMembres = liste;
  document.getElementById('compteur').textContent = liste.length;
  afficherListe();
}

// 🖥️ AFFICHAGE SÉCURISÉ
function afficherListe() {
  const conteneur = document.getElementById('liste');
  if (!listeMembres.length) {
    conteneur.innerHTML = `<div class="carte text-center py-4 text-muted">${m('aucunMembre')}</div>`;
    return;
  }

  conteneur.innerHTML = '';

  // ✅ TRI SÉCURISÉ — évite l'erreur si ordre est undefined
  listeMembres.sort((a, b) => {
    const ordreA = typeof a.ordre === 'number' ? a.ordre : 999;
    const ordreB = typeof b.ordre === 'number' ? b.ordre : 999;
    return ordreA - ordreB;
  }).forEach(membre => {
    // ✅ Valeurs PAR DÉFAUT pour TOUS les champs
    const id = membre.id || '';
    const nom = membre.nom || '';
    const prenoms = membre.prenoms || '';
    const poste = membre.poste_fr || '';
    const matiere = membre.matiere_fr || '';
    const email = membre.email || '';
    const ordre = membre.ordre || 1;
    const estActif = Boolean(membre.est_actif ?? true);

    // ✅ Photo sécurisée
    const photo = membre.photo_url 
      ? `<img src="${membre.photo_url}" alt="" class="photo-mini" onerror="this.style.display='none'">` 
      : '';

    // ✅ Statut sécurisé — ERREUR CORRIGÉE : ne plus appeler m() dans le HTML
    const texteOui = m('oui');
    const texteNon = m('non');
    const statut = estActif 
      ? `<span class="badge-actif">${texteOui}</span>` 
      : `<span class="badge-inactif">${texteNon}</span>`;

    // ✅ Génération HTML
    conteneur.innerHTML += `
      <div class="carte">
        <div class="d-flex align-items-start">
          ${photo}
          <div style="flex:1">
            <h5 class="fw-bold mb-2">${prenoms} ${nom} ${statut}</h5>
            <div class="info-ligne"><strong>${m('poste')} :</strong> ${poste}</div>
            ${matiere ? `<div class="info-ligne"><strong>${m('matiere')} :</strong> ${matiere}</div>` : ''}
            ${email ? `<div class="info-ligne"><i class="bi bi-envelope me-1"></i> ${email}</div>` : ''}
            <div class="info-ligne text-muted small">Ordre : ${ordre}</div>
          </div>
        </div>
        <div class="mt-3 d-flex gap-2">
          <button class="btn-modif" onclick="modifier(${id})">✏️ ${m('modifierBtn')}</button>
          <button class="btn-suppr" onclick="supprimer(${id})">🗑️ ${m('supprBtn')}</button>
        </div>
      </div>`;
  });
}

// 📝 OUVRIR FORMULAIRE
function ouvrirFormulaire() {
  document.getElementById('formMembre').reset();
  document.getElementById('id').value = '';
  document.getElementById('titreForm').textContent = m('ajouterTitre');
  document.getElementById('est_actif').checked = true;
  document.getElementById('ordre').value = '1';
  document.getElementById('formModal').classList.add('active');
}

// ✏️ MODIFIER UN MEMBRE
function modifier(id) {
  const membre = listeMembres.find(x => Number(x.id) === Number(id));
  if (!membre) return;

  ['id','nom','prenoms','poste_fr','poste_en','poste_ar','matiere_fr','matiere_en','matiere_ar','presentation_fr','presentation_en','presentation_ar','photo_url','email','ordre'].forEach(k => {
    const el = document.getElementById(k);
    if (el) el.value = membre[k] || '';
  });

  document.getElementById('est_actif').checked = Boolean(membre.est_actif ?? true);
  document.getElementById('titreForm').textContent = m('modifierTitre');
  document.getElementById('formModal').classList.add('active');
}

// ❌ FERMER FORMULAIRE
function fermerFormulaire() {
  document.getElementById('formModal').classList.remove('active');
  document.getElementById('message').className = 'message';
  document.getElementById('message').textContent = '';
}

// 💅🏽 NETTOYER LES CHAMPS avant envoi
function nettoyerChamps(obj) {
  const nettoye = {};
  for (const k in obj) {
    nettoye[k] = typeof obj[k] === 'string' ? obj[k].trim() : obj[k];
  }
  return nettoye;
}

// 💾 ENREGISTRER
document.getElementById('formMembre').addEventListener('submit', async e => {
  e.preventDefault();
  const id = document.getElementById('id').value.trim();
  const msg = document.getElementById('message');

  const donnees = nettoyerChamps({
    nom: document.getElementById('nom').value,
    prenoms: document.getElementById('prenoms').value,
    poste_fr: document.getElementById('poste_fr').value,
    poste_en: document.getElementById('poste_en').value,
    poste_ar: document.getElementById('poste_ar').value,
    matiere_fr: document.getElementById('matiere_fr').value,
    matiere_en: document.getElementById('matiere_en').value,
    matiere_ar: document.getElementById('matiere_ar').value,
    presentation_fr: document.getElementById('presentation_fr').value,
    presentation_en: document.getElementById('presentation_en').value,
    presentation_ar: document.getElementById('presentation_ar').value,
    photo_url: document.getElementById('photo_url').value,
    email: document.getElementById('email').value,
    ordre: parseInt(document.getElementById('ordre').value) || 1,
    est_actif: document.getElementById('est_actif').checked
  });

  try {
    const url = id ? `/equipe/${id}` : '/equipe/ajouter';
    const methode = id ? 'PUT' : 'POST';
    const rep = await requeteAPI(url, {
      method: methode,
      body: JSON.stringify(donnees)
    });

    if (rep?._deconnexion) return;

    if (rep?.ok) {
      msg.className = 'message succes';
      msg.textContent = id ? m('modifierOk') : m('ajouterOk');
      await chargerListe();
      setTimeout(fermerFormulaire, 1200);
    } else {
      throw new Error(rep?.erreur || 'Erreur serveur');
    }
  } catch (err) {
    console.warn('Enregistrement en mode local :', err.message);
    // 📴 Mode local de secours
    let liste = obtenirMembresLocaux();
    donnees.id = id ? Number(id) : Date.now();
    if (id) {
      liste = liste.map(m => Number(m.id) === Number(id) ? { ...m, ...donnees } : m);
    } else {
      liste.push(donnees);
    }
    sauvegarderMembresLocaux(liste);
    listeMembres = liste;
    basculerModeLocal(true);
    msg.className = 'message succes';
    msg.textContent = (id ? m('modifierOk') : m('ajouterOk')) + " (mode local)";
    afficherListe();
    setTimeout(fermerFormulaire, 1200);
  }
});

// 🗑️ SUPPRIMER UN MEMBRE
async function supprimer(id) {
  if (!confirm(m('confirmerSuppr'))) return;
  try {
    const rep = await requeteAPI(`/equipe/${id}`, { method: 'DELETE' });
    if (rep?._deconnexion) return;

    if (rep?.ok) {
      await chargerListe();
      alert(m('supprOk'));
    } else {
      throw new Error(rep?.erreur || 'Erreur suppression');
    }
  } catch (err) {
    console.warn('Suppression en mode local :', err.message);
    // 📴 Mode local de secours
    let liste = obtenirMembresLocaux().filter(m => Number(m.id) !== Number(id));
    sauvegarderMembresLocaux(liste);
    listeMembres = liste;
    basculerModeLocal(true);
    afficherListe();
    alert(m('supprOk') + " (mode local)");
  }
}

// 🚀 INITIALISATION
window.onload = async function() {
  appliquerTheme(theme);
  appliquerLangue(langue);
  await chargerListe();
};
</script>
